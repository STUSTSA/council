name: build-android-apk

# 自用安卓外殼（TWA）。手動執行，或 tools/android 有改動時執行。
# 產出的 APK 在該次執行頁面最下方的 Artifacts，名稱 council-apk。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build release APK
        working-directory: tools/android
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: council-apk
          path: tools/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # 另外放到 Release，手機點連結就能直接下載 .apk（不用登入、不用解壓縮 zip）
      - name: Publish APK to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/android/app/build/outputs/apk/release/app-release.apk council.apk
          # 先把已存在但被建成草稿的 apk-latest 轉成正式發佈（草稿用 tag 找不到）
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[]|select(.tag_name=="apk-latest")][0].id // empty')
          [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false >/dev/null
          # 不再刪掉重建（會偶爾變成草稿、手機下載連結就 404）：release 已存在就只換檔案，並確保是正式發佈狀態
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "安卓 APK（最新）" --notes "自用安卓外殼" --target "$GITHUB_SHA"
          gh release upload apk-latest council.apk --clobber
          gh release edit apk-latest --draft=false --notes "自用安卓外殼；每次建置會換檔。建置自 $GITHUB_SHA"
