name: build-android-apk

# 自用安卓外殼（TWA）。手動執行，或 tools/android 有改動時執行。
# 產出的 APK 在該次執行頁面最下方的 Artifacts，名稱 council-apk。
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build release APK
        working-directory: tools/android
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: council-apk
          path: tools/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # 另外放到 Release，手機點連結就能直接下載 .apk（不用登入、不用解壓縮 zip）
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/android/app/build/outputs/apk/release/app-release.apk council.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest council.apk --title "安卓 APK（最新）" --notes "自用安卓外殼，每次建置會覆蓋。" --target "$GITHUB_SHA"
