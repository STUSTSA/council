name: android-screenshot

# 開發驗證用：在模擬器（Android 13／14／15）裝上最新 APK、開首頁、截圖，上傳成 Actions 產出檔與 apk-test Release。手動執行。
on:
  workflow_dispatch:
  push:
    branches: ["claude/android-**"]
    paths: [".github/workflows/android-screenshot.yml", "tools/android/**", "core/board.css"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle --no-daemon :app:assembleRelease
        working-directory: tools/android
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: tools/android/app/build/outputs/apk/release/app-release.apk }

  shot:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app-release.apk
            adb shell am start -n tw.edu.stust.council/.MainActivity
            sleep 25
            adb exec-out screencap -p > shot-${{ matrix.api }}-light.png
            adb shell cmd uimode night yes
            sleep 8
            adb exec-out screencap -p > shot-${{ matrix.api }}-dark.png
            adb logcat -d -s AndroidRuntime:E > crash-${{ matrix.api }}.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.api }}
          path: |
            shot-*.png
            crash-*.txt

  publish:
    needs: shot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: out
      - name: Upload to a temporary prerelease (developer verification only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-test --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          find out -type f -empty -delete; ls -la out; gh release create apk-test out/* --prerelease --title "模擬器截圖（驗證用）" --notes "暫時的，會刪除。" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
