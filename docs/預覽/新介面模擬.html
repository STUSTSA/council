<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUSTSA 會務系統完整模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 圓角（2026-11-17 收斂，原本太圓）：大色塊與卡片 18、內層項目 14、小方塊 12 以下；膠囊（999）與圓鈕不變 */
/* ===== 色調：三組可切換，各有深淺 ===== */
:root{--out:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.3,1.45,.45,1);--in:cubic-bezier(.4,0,1,1);--fast:160ms;--base:280ms;--slow:460ms}
/* --pri／--pri-ink＝主要動作的底與字（分段切換與工具列的鏡片、實心膠囊鈕、新增圓鈕、併入鈕、今日卡片…）。預設是文字色配色塊色；有的配色改成重點色 */
[data-pal]{--pri:var(--ink);--pri-ink:var(--blk)}
:root,[data-pal="mono"]{--bg:#f2f2f4;--blk:#fff;--blk2:#e6e6ea;--ink:#111114;--muted:#6a6a74;--hair:#d9d9df;--acc:#e0342a;--acc-ink:#fff;--ok:#2fb86e;--late:#e0342a}
[data-pal="mono"][data-theme="dark"]{--bg:#000;--blk:#151517;--blk2:#232327;--ink:#f1f1f4;--muted:#9a9aa6;--hair:#2c2c34;--acc:#ff5a4e;--acc-ink:#111114;--ok:#3ccf7f;--late:#ff5a4e}
/* 黃藍延伸（學生會標誌色 #f0bc23／#0a5baa）：--acc＝選中，--acc2＝焦點、今天、要注意的數字 */
[data-pal="b1"]{--bg:#edf1f6;--blk:#fff;--blk2:#d8e2ee;--ink:#0b1f3a;--muted:#5b6b82;--hair:#d3dce8;--acc:#0a5baa;--acc-ink:#fff;--acc2:#f0bc23;--acc2-ink:#0b1f3a;--ok:#2f9d62;--late:#d8412f}
[data-pal="b2"]{--bg:#f5f0e1;--blk:#fffdf6;--blk2:#ebe2c8;--ink:#0a2a4d;--muted:#6d6a5c;--hair:#e2d9bf;--acc:#f0bc23;--acc-ink:#0a2a4d;--acc2:#0a5baa;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="b3"]{--bg:#f2f2f4;--blk:#fff;--blk2:#e6e6ea;--ink:#111114;--muted:#6a6a74;--hair:#d9d9df;--acc:#0a5baa;--acc-ink:#fff;--acc2:#f0bc23;--acc2-ink:#111114;--ok:#2fb86e;--late:#e0342a}
[data-pal="b4"]{--bg:#fff;--blk:#eaf1f9;--blk2:#cfdff0;--ink:#0a2f57;--muted:#56708e;--hair:#c9d9ea;--acc:#f0bc23;--acc-ink:#0a2f57;--acc2:#0a5baa;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="b5"]{--bg:#0a5baa;--blk:#fff;--blk2:#e3ecf6;--ink:#0b1f3a;--muted:#5b6b82;--hair:#d3dce8;--acc:#f0bc23;--acc-ink:#0b1f3a;--acc2:#f0bc23;--acc2-ink:#0b1f3a;--ok:#2f9d62;--late:#d8412f}
:is([data-pal="b1"],[data-pal="b3"])[data-theme="dark"]{--bg:#05090f;--blk:#0f1826;--blk2:#1c2a40;--ink:#eef3fa;--muted:#8fa0b8;--hair:#22314a;--acc:#4d97e6;--acc-ink:#05090f;--acc2:#f0bc23;--acc2-ink:#05090f;--ok:#58d48c;--late:#ff6a58}
:is([data-pal="b2"],[data-pal="b4"],[data-pal="b5"])[data-theme="dark"]{--bg:#05090f;--blk:#0f1826;--blk2:#1c2a40;--ink:#eef3fa;--muted:#8fa0b8;--hair:#22314a;--acc:#f0bc23;--acc-ink:#05090f;--acc2:#4d97e6;--acc2-ink:#05090f;--ok:#58d48c;--late:#ff6a58}
[data-pal="mono"]{--acc2:var(--acc);--acc2-ink:var(--acc-ink)}
/* 2026-11-17 待選的配色（預覽列切換；每一組都有淺色與深色）：ink＝黑白黃、sage＝灰綠萊姆、mist＝霧藍琥珀；另外沿用上面的 b3＝白底藍主 */
[data-pal="ink"]{--bg:#f1f1ee;--blk:#fff;--blk2:#e4e4df;--ink:#131313;--muted:#6b6b66;--hair:#dad9d3;--acc:#f0bc23;--acc-ink:#131313;--acc2:#131313;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="ink"][data-theme="dark"]{--bg:#0c0c0c;--blk:#181818;--blk2:#262626;--ink:#f2f2ee;--muted:#9a9a94;--hair:#2e2e2e;--acc:#f0bc23;--acc-ink:#111;--acc2:#f2f2ee;--acc2-ink:#111;--ok:#3ccf7f;--late:#ff5a4e}
[data-pal="sage"]{--bg:#dfe5dc;--blk:#fff;--blk2:#cdd7ca;--ink:#14181a;--muted:#5d6a61;--hair:#c8d2c5;--acc:#c8f04a;--acc-ink:#14181a;--acc2:#14181a;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="sage"][data-theme="dark"]{--bg:#0d100e;--blk:#171b18;--blk2:#252b26;--ink:#eef2ea;--muted:#94a096;--hair:#2a312b;--acc:#c8f04a;--acc-ink:#10140f;--acc2:#eef2ea;--acc2-ink:#10140f;--ok:#58d48c;--late:#ff6a58}
[data-pal="mist"]{--bg:#e8edf2;--blk:#f8fafc;--blk2:#d3dce6;--ink:#1a2b3c;--muted:#5f7183;--hair:#cfd9e3;--acc:#1a2b3c;--acc-ink:#fff;--acc2:#e8a33d;--acc2-ink:#1a2b3c;--ok:#2f9d62;--late:#d8412f}
[data-pal="mist"][data-theme="dark"]{--bg:#0b1016;--blk:#141b23;--blk2:#212b36;--ink:#e9eff5;--muted:#8c9aa8;--hair:#25303b;--acc:#e9eff5;--acc-ink:#0b1016;--acc2:#e8a33d;--acc2-ink:#0b1016;--ok:#58d48c;--late:#ff6a58}
/* 2026-11-17 依 DievE 給的四張參考圖再加四組：fire＝冬日爐火（淡藍底、奶油色塊、暖黃選中、青藍焦點）、pastel＝粉彩（淡紫白底、白色塊、淡藍次色塊、香草黃選中、黑色焦點）、
   neu＝柔光（灰白單色、琥珀選中、橘色焦點，色塊帶新擬物的雙向柔影）、sun＝暖陽（暖灰底、白色塊、飽和黃選中、棕色焦點） */
[data-pal="fire"]{--pri:#ffd87b;--pri-ink:#1f3b44;--bg:#ecf5f6;--blk:#fffef3;--blk2:#d7edef;--ink:#1f3b44;--muted:#63808a;--hair:#d5e6e8;--acc:#ffd87b;--acc-ink:#1f3b44;--acc2:#3f8d99;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="fire"][data-theme="dark"]{--pri:#ffd87b;--pri-ink:#14201f;--bg:#0b1315;--blk:#142024;--blk2:#1f3338;--ink:#eaf5f6;--muted:#8aa6ab;--hair:#22383e;--acc:#ffd87b;--acc-ink:#14201f;--acc2:#9fd3da;--acc2-ink:#0b1315;--ok:#58d48c;--late:#ff6a58}
[data-pal="pastel"]{--bg:#f6f5fa;--blk:#fff;--blk2:#d8dfe9;--ink:#212121;--muted:#6c6f78;--hair:#e1e2ea;--acc:#eff0a3;--acc-ink:#212121;--acc2:#212121;--acc2-ink:#fff;--ok:#5f9b6b;--late:#d8412f}
[data-pal="pastel"][data-theme="dark"]{--bg:#111113;--blk:#1b1b1f;--blk2:#292c33;--ink:#f6f5fa;--muted:#9a9ca6;--hair:#2d2f37;--acc:#eff0a3;--acc-ink:#1a1a1a;--acc2:#f6f5fa;--acc2-ink:#111113;--ok:#8fcf9a;--late:#ff6a58}
[data-pal="neu"]{--pri:#ffc94d;--pri-ink:#3a2a00;--bg:#ececee;--blk:#f1f1f3;--blk2:#e2e2e6;--ink:#37373b;--muted:#85858c;--hair:#dcdce1;--acc:#ffc94d;--acc-ink:#3a2a00;--acc2:#ff9f43;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f;--blk-sh:7px 7px 16px rgba(120,120,135,.22),-7px -7px 16px rgba(255,255,255,.95)}
[data-pal="neu"][data-theme="dark"]{--pri:#ffc94d;--pri-ink:#2a1e00;--bg:#232429;--blk:#27282e;--blk2:#31333a;--ink:#ececf0;--muted:#9698a2;--hair:#34363e;--acc:#ffc94d;--acc-ink:#2a1e00;--acc2:#ff9f43;--acc2-ink:#1c1c20;--ok:#58d48c;--late:#ff6a58;--blk-sh:7px 7px 16px rgba(0,0,0,.42),-6px -6px 14px rgba(255,255,255,.045)}
[data-pal="sun"]{--pri:#fdb92e;--pri-ink:#1f1f1f;--bg:#efedea;--blk:#fff;--blk2:#e3ded7;--ink:#1f1f1f;--muted:#7d7466;--hair:#dedad3;--acc:#fdb92e;--acc-ink:#1f1f1f;--acc2:#7a4a3e;--acc2-ink:#fff;--ok:#7f9a34;--late:#d8412f}
[data-pal="sun"][data-theme="dark"]{--pri:#fdb92e;--pri-ink:#1a1712;--bg:#131211;--blk:#1e1c1a;--blk2:#2c2926;--ink:#f3f0ec;--muted:#a39a8d;--hair:#32302c;--acc:#fdb92e;--acc-ink:#1a1712;--acc2:#d9a08f;--acc2-ink:#131211;--ok:#a9c45a;--late:#ff6a58}
/* 定案（2026-11-16）：淺色＝黃主藍點，深色＝黑黃（原本定黑紅，同晚改定；紅色只留給逾期與刪除） */
[data-pal="fin"]{--bg:#f5f0e1;--blk:#fffdf6;--blk2:#ebe2c8;--ink:#0a2a4d;--muted:#6d6a5c;--hair:#e2d9bf;--acc:#f0bc23;--acc-ink:#0a2a4d;--acc2:#0a5baa;--acc2-ink:#fff;--ok:#2f9d62;--late:#d8412f}
[data-pal="fin"][data-theme="dark"]{--bg:#000;--blk:#151517;--blk2:#232327;--ink:#f1f1f4;--muted:#9a9aa6;--hair:#2c2c34;--acc:#f0bc23;--acc-ink:#111114;--acc2:#f0bc23;--acc2-ink:#111114;--ok:#3ccf7f;--late:#ff5a4e}
[data-pal]{--on-bg:var(--ink)}
[data-pal="b5"]:not([data-theme="dark"]){--on-bg:#fff}
/* E 的底色是深藍：原本用底色當內層色塊的地方改用次色塊，底色上的逾期數字改用黃 */
[data-pal="b5"]:not([data-theme="dark"]) :is(.day:not(.on),.rq,.ppl .av){background:var(--blk2)}
[data-pal="b5"]:not([data-theme="dark"]) .hm-name .lt{color:var(--acc2)}
[data-pal="b5"]:not([data-theme="dark"]) .rail:has(.on) .tile:not(.on){opacity:1}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:#55565c;color:var(--ink);font:15px/1.55 "Jost","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
.num{font-family:"Jost",sans-serif;font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 互動回饋（全站同一套）：可互動的東西被指到放大、按下縮回；沒有光暈、沒有模糊 */
.tap{transition:transform .42s var(--spring),background-color var(--base) var(--out),color var(--base) var(--out),opacity var(--base) var(--out)}
@media (hover:hover){.tap:hover{transform:scale(1.05)}}
.tap:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translate(-22px,30px) scale(.985)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 預覽外殼（不是產品） */
#stage{flex:1;min-height:0;display:flex;justify-content:center}
#app{position:relative;width:100%;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;transition:max-width .46s var(--out),background-color var(--slow) var(--out)}
/* 換主題（themeSwap）：整頁一次淡過去；淡的期間元件自己的過渡全部停掉，只留分段鈕的滑塊照常滑 */
#app.swap,#app.swap *:not(.lens),#app.swap *::before,#app.swap *::after{transition:none}
::view-transition{pointer-events:none}
::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation-duration:140ms;animation-timing-function:linear}
/* 只有正在輸入的欄位可以選字；其餘文字、圖示、連結長按都不會反白、不會跳出系統選單 */
#app{touch-action:manipulation}
#app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app :is(input,textarea,[contenteditable="true"]){user-select:text;-webkit-user-select:text}
#app :is(a,svg,img){-webkit-user-drag:none}
#view{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:26px clamp(16px,4vw,56px) 120px}

.blk{background:var(--blk);border-radius:18px;box-shadow:var(--blk-sh,none);transition:background-color var(--slow) var(--out)}
h2{color:var(--on-bg);margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.1;letter-spacing:.06em}
.seg{display:inline-flex;padding:5px;border-radius:999px;background:var(--blk2);position:relative}
.seg button{position:relative;z-index:1;min-height:36px;padding:0 20px;white-space:nowrap;border-radius:999px;font-size:14px;color:var(--muted);transition:color var(--base) var(--out)}
.seg button[aria-selected="true"]{color:var(--pri-ink)}
.seg .lens{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--pri);transition:transform var(--slow) var(--spring),width var(--slow) var(--spring)}
.round{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--blk)}
.round.dark{background:var(--ink);color:var(--blk)}
/* ===== 首頁（桌面：Switch 式） ===== */
.hm-top{display:flex;align-items:center;gap:14px}
.me{display:flex;align-items:center;height:52px;padding:0 20px 0 14px;border-radius:999px;background:var(--blk)}
.hlg{height:32px;width:auto}.hlg .ly{fill:var(--lg-y)}.hlg .lb{fill:var(--lg-b)}.hlg .li{fill:var(--ink)}
.me b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:500}
.me-av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--bg)}.slg{width:24px;height:27px}.slg .ly{fill:var(--lg-y)}.slg .lb{fill:var(--lg-b)}
.me small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.hm-top .sp{flex:1}
.clock,.hm-name b,.mh-big{color:var(--on-bg)}
.hm-name span,.mh-date{color:color-mix(in srgb,var(--on-bg) 70%,transparent)}
.clock{font-size:28px;font-weight:300;letter-spacing:.02em}
.hm-mid{display:grid;justify-items:start;gap:16px;margin:clamp(22px,6vh,64px) 0 14px}
.hm-name{display:flex;align-items:baseline;gap:16px;height:clamp(44px,5.6vw,68px);white-space:nowrap}
.hm-name b{font-size:clamp(32px,4.6vw,56px);font-weight:700;line-height:1.1;letter-spacing:.04em}
.hm-name span{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.hm-name .lt{color:var(--late)}
.rail{display:flex;gap:34px;overflow-x:auto;scrollbar-width:none;padding:30px 30px 34px;margin:0 -30px;scroll-padding-inline:30px;scroll-snap-type:x proximity}
.tile{flex:none;position:relative;width:clamp(150px,17vw,214px);aspect-ratio:1;border-radius:18px;background:var(--c);color:var(--ci);display:grid;align-content:space-between;padding:18px 20px;text-align:left;scroll-snap-align:center;transition:transform var(--slow) var(--spring),opacity var(--base) var(--out)}
.tile .mk{font-size:clamp(54px,7vw,92px);font-weight:200;line-height:.9}
.tile .nm{font-size:17px;font-weight:700;letter-spacing:.08em}
.tile .n{position:absolute;top:16px;right:16px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--late);color:#fff;font-size:12.5px;display:grid;place-items:center}
.tile.on{transform:scale(1.13);z-index:1}
/* 焦點框：整列共用一個，換焦點時滑到新的那張（不是每張各自亮起） */
.rail{position:relative}
.fring{position:absolute;left:0;top:0;z-index:2;border-radius:26px;border:3px solid var(--acc2);pointer-events:none;transition:transform 380ms var(--spring),width 380ms var(--spring),height 380ms var(--spring)}
.fring::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:3px solid var(--acc2);animation:ringp 1.6s var(--out) infinite}
@keyframes ringp{from{opacity:.55;transform:none}to{opacity:0;transform:scale(1.07)}}
.rail:has(.on) .tile:not(.on){opacity:.82}
.tile.pj{width:auto;height:clamp(150px,17vw,214px);aspect-ratio:1.5}
.tile.pj .mk{font-size:clamp(40px,5vw,64px)}
/* 主頁下排：全會行事曆＋個人常用連結（像瀏覽器的書籤列） */
.dock{display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;margin:clamp(14px,4vh,40px) auto 0;padding:8px;border-radius:999px;background:var(--blk);overflow-x:auto;scrollbar-width:none}
.dock .dv{flex:none;width:1px;height:22px;background:var(--hair)}
.lkw{position:relative;flex:none;display:flex}
.lkc{flex:none;position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--ink);text-decoration:none}
.lkc b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--blk2);font-size:14px;font-weight:700}.lkc b[hidden]{display:none}
.lkc img{width:26px;height:26px;border-radius:6px;object-fit:contain}.lkc b:not([hidden])+img{position:absolute;opacity:0}
.lkc.pubc{border-radius:50%;background:var(--pri);color:var(--pri-ink)}.lkc.pubc svg{width:20px;height:20px}
.lkc.more{border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hair)}.lkc.more svg{width:18px;height:18px}
.lkx{position:absolute;right:-4px;top:-4px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--late);color:#fff}.lkx svg{width:11px;height:11px}
.dock.ed .lkw a{pointer-events:none}
.lkf{flex:none;display:inline-flex;align-items:center;gap:8px;padding-left:8px;color:var(--muted)}.lkf svg{width:17px;height:17px;flex:none}.lkb{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--ink)}
.lkf input{width:96px;height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--bg);outline:none}.lkf input:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}.lkf #lkU{width:190px}
#app.narrow .dock{position:absolute;left:16px;right:16px;bottom:18px;z-index:40;max-width:calc(100% - 32px);margin:0 auto;justify-content:flex-start}   /* 寬度沿用上面的 fit-content：有幾顆就多寬，左右置中 */
/* 首頁（手機） */
.mh{display:grid;gap:14px}
.mh-date{font-size:13px;color:var(--muted);margin-top:8px}
.mh-big{font-size:36px;font-weight:700;line-height:1.05;letter-spacing:.04em}
.mh-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px 18px;display:grid;gap:14px;text-align:left}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat b{font-size:34px;font-weight:300;line-height:1}
.stat small{font-size:12.5px;color:var(--muted)}
.stat.hot{background:var(--acc2);color:var(--acc2-ink)}.stat.hot small{color:inherit;opacity:.75}
.mh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mh-grid .tile{width:auto;aspect-ratio:1.25;border-radius:14px}
.mh-grid .tile .mk{font-size:46px}
.bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:4}
.bar .pill{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--blk)}
.bar .pill button{display:grid;place-items:center;width:52px;height:44px;border-radius:999px;color:var(--muted)}
.bar .pill button[aria-selected="true"]{background:var(--ink);color:var(--blk)}

.rows{position:relative;display:grid;gap:10px}

.row{position:relative;height:46px;margin:7px 0}

.bar2 .act{flex:0 0 var(--p);height:100%;border-radius:16px 5px 5px 16px;background:var(--fc,var(--blk2));animation:actIn .7s var(--out) both;animation-delay:calc(var(--i)*70ms);transition:background-color var(--base) var(--out)}

.bar2 .ina{padding:0 22px 0 12px}
.bar2 .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}

.bar2 .sp{flex:1}
#app.narrow .bar2 .av{display:none}   /* 窄畫面：名稱跟負責人擠在同一段時先讓名稱 */
.av{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--blk);color:var(--ink);font-size:12.5px}

.det{padding:20px 22px;display:grid;gap:16px;animation:up var(--base) var(--out) both}

/* 狀態標籤：一條軌道，目前的那一格實心；可以新增、改名、刪除 */

.stg .x{opacity:.6;font-size:15px;line-height:1}
/* ===== 行事曆：五類 ===== */
.cal{display:grid;gap:18px;max-width:1080px;margin:0 auto}

/* 找共同時間：一週七列時間軸，上半細條＝第一個單位有事、下半＝第二個單位有事，整格的重點色＝符合條件的時段 */
.fbtn{box-shadow:inset 0 0 0 1.5px var(--hair)}.fbtn.dark{box-shadow:none}
.fps .pm{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:3px;background:currentColor;vertical-align:-1px}.fps .pm.b{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
/* 找共同時間：月曆上的短條（.pc-m，在海報月曆那一段）＋下面這一天的時間軸 */
.fnd{display:grid;gap:10px}
.fnd-h{display:flex;align-items:baseline;gap:10px}.fnd-h b{font-size:26px;font-weight:300}.fnd-h small{font-size:12.5px;color:var(--muted)}.fnd-h .sp{flex:1}.fnd-h .tot{font-size:26px;font-weight:300}.fnd-h .tot small{margin-left:4px}
.fda{position:relative;height:16px;font-size:10.5px;color:var(--muted)}.fda span{position:absolute;transform:translateX(-50%)}.fda span:first-child{transform:none}.fda span:last-child{transform:translateX(-100%)}
.fdt{position:relative;height:64px;border-radius:12px;background:linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/calc(100% / 7) 100% var(--bg);overflow:hidden}
.fdt i{position:absolute;min-width:4px;border-radius:5px}
.fdt i.o{top:0;bottom:0;border-radius:0;background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 4px 0 var(--acc)}
.fdt i.a{top:10px;height:19px;background:var(--ink)}
.fdt i.b{bottom:10px;height:19px;background:color-mix(in srgb,var(--ink) 8%,var(--blk));box-shadow:inset 0 0 0 1.5px var(--ink)}
.fgr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.fgr span{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;background:color-mix(in srgb,var(--acc) 24%,transparent);font-size:13.5px}.fgr span.none{background:transparent;box-shadow:none;color:var(--muted);padding:0}
/* 今日／明日 */
.nds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.nd{--nb:var(--blk);--ni:var(--ink);--nm:var(--muted);--nr:var(--hair);display:flex;flex-direction:column;gap:14px;min-height:190px;padding:18px 18px 16px;border-radius:18px;background:var(--nb);color:var(--ni);text-align:left}
.nd.tdy{--nb:var(--pri);--ni:var(--pri-ink);--nm:color-mix(in srgb,var(--pri-ink) 62%,var(--pri));--nr:color-mix(in srgb,var(--pri-ink) 18%,transparent)}
.nd-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--nr)}
.nd-n{font-size:52px;font-weight:300;line-height:.8}
.nd-l{display:grid;justify-items:end;gap:3px}.nd-l b{font-size:14px;font-weight:700;letter-spacing:.12em;white-space:nowrap}.nd-l b i{font-style:normal;font-weight:400;color:var(--nm)}.nd-l small{font-size:12px;color:var(--nm)}
.nd-ls{display:grid;gap:11px}.nd-r{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:baseline}
.nd-r>.num{font-size:12.5px;color:var(--nm);white-space:nowrap}.nd-r b{display:block;font-size:14px;font-weight:500;line-height:1.4}.nd-r small{display:block;font-size:11.5px;color:var(--nm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-m{font-size:12px;color:var(--nm);padding-left:calc(3.4em + 8px)}.nd-e{margin-top:auto}.nd-e i{display:block;width:28px;height:1px;background:var(--nm)}
#app.narrow .nds{gap:10px}#app.narrow .nd{min-height:170px;padding:15px 14px 14px}#app.narrow .nd-n{font-size:44px}#app.narrow .nd-l b{font-size:13px;letter-spacing:.06em}
.monp{position:relative}.pop.dn{left:auto;right:0;bottom:auto;top:60px;min-width:120px}
/* 海報月曆（照舊版）：選到的日期＝重點色圓、今天＝焦點色粗體；事件只畫點與線，每層 9px */
.pc{--lane:9px;container-type:inline-size}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.pc-mon{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(60px,19cqw,116px);line-height:.82;letter-spacing:-.02em}.pc-mon .num{font-weight:300;margin-right:.14em;letter-spacing:-.04em}
.pc-yr{font-weight:600;font-size:clamp(24px,6.4cqw,40px);line-height:.95;text-align:right}
.pc-wk,.pc-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.pc-wk{padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--ink);font-family:"Jost",sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-align:center;color:var(--muted)}
.pc-week{position:relative;align-content:start;min-height:calc(48px + var(--lanes) * var(--lane));padding-bottom:6px}
.pc-d{position:relative;isolation:isolate;justify-self:center;display:grid;place-items:center;width:40px;height:40px;margin-top:4px;border-radius:50%;font-size:19px;line-height:1;transition:transform .42s var(--spring),color var(--base) var(--out)}
.pc-d::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.6);transition:opacity var(--base) var(--out),transform .42s var(--spring)}
.pc-d.pad{visibility:hidden}.pc-d.has{font-weight:500}.pc-d.now{color:var(--acc2);font-weight:700}
.pc-d.on{color:var(--acc-ink)}.pc-d.on::before{opacity:1;transform:none}.pc-d:active{transform:scale(.9)}
@media (hover:hover){.pc-d:not(.on):hover::before{opacity:.28;transform:none}}
.pc-e{position:absolute;top:calc(48px + var(--ln) * var(--lane));left:calc(var(--i0) / 7 * 100%);width:calc((var(--i1) - var(--i0) + 1) / 7 * 100%);height:5px;color:var(--ink);pointer-events:none}
.pc-e.span::before{content:"";position:absolute;top:0;height:5px;left:calc(50% / (var(--i1) - var(--i0) + 1) - 2.5px);right:calc(50% / (var(--i1) - var(--i0) + 1) - 2.5px);border-radius:3px;background:linear-gradient(currentColor,currentColor) center/calc(100% - 5px) 1.5px no-repeat,radial-gradient(circle 2.5px at 2.5px 50%,currentColor 96%,transparent),radial-gradient(circle 2.5px at calc(100% - 2.5px) 50%,currentColor 96%,transparent)}
.pc-e:not(.span)::after{content:"";position:absolute;top:0;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.pc-m{position:absolute;left:50%;top:calc(100% + 4px);width:24px;height:4px;margin-left:-12px;border-radius:2px;background:var(--hair);overflow:hidden}.pc-m::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f) * 100%);border-radius:2px;background:var(--acc2)}   /* 找共同時間：那天符合的比例 */
.pc-foot{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted);letter-spacing:.24em}
/* 今日層（照舊版）：底板與文字顏色開啟時取自今日卡片 */
.td-ov{position:absolute;inset:0;z-index:60}.td-ov[hidden]{display:none}
.td-bg{position:absolute;inset:0;background:var(--nb)}
.td-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:26px clamp(18px,4vw,56px) 60px}

.td-ov.on .td-row{opacity:1;transform:none;transition:opacity .35s,transform .5s var(--out);transition-delay:calc(.26s + var(--i) * .04s)}
.td-t{font-size:13px;opacity:.75;white-space:nowrap}
.td-b{display:grid;gap:2px;min-width:0}.td-b b{font-size:16px;font-weight:500;line-height:1.45}.td-b small{font-size:12.5px;opacity:.62}

.others{display:flex;flex-wrap:wrap;gap:8px;animation:up var(--base) var(--out) both}
.chip{height:36px;padding:0 16px;border-radius:999px;background:var(--blk2);color:var(--muted);font-size:13.5px;line-height:1}

.list{display:grid;gap:12px}
@container (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.cal{container-type:inline-size}

.narrow .seg button{padding:0 13px}.mh .seg{justify-self:start}

.pr-g{display:grid;gap:18px}

/* ===== 完整模擬：共用 ===== */

.tagx.st{background:var(--ok);color:#fff}.tagx.st[data-st="go"]{background:#f0bc23;color:#0a2a4d}.tagx.st[data-st="stall"]{background:var(--late)}

/* 唯讀檢視：外框標籤；不能動的東西不接受點按、也不會被指到放大 */

.card .c-send{display:flex;align-items:center;gap:10px;padding:0 0 12px}.card .c-send .sp{flex:1}.card .c-send small{font-size:12.5px;color:var(--muted)}   /* 秘書處會議：上一步／送出 */

[aria-disabled="true"]{pointer-events:none}
.card.ro .c-title{cursor:default}.c-head .rp{font-size:12.5px;color:var(--late);letter-spacing:.1em}.bd-top b{line-height:1.15}.bd-top .lg.sm{width:46px;height:46px;margin-left:4px}
:is(h2,.sec-h b,.bd-top b) .en{font-size:10.5px;margin-bottom:3px}
.badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--late);color:#fff;font-size:11.5px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.round{position:relative}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
#float{position:absolute;inset:0;z-index:6;pointer-events:none}
#float>*{pointer-events:auto}
#view.nav-on{padding-left:clamp(16px,4vw,56px)}
#app:not(.narrow) #view.nav-on{padding-left:104px}
/* ===== 部門工具列（手機在底部、桌面在左側直排）=====
   結構、尺寸、互動照舊版看板的工具列：圖示在上、文字在下，鏡片是固定大小的實心膠囊，鏡片底下那一格的圖示反白；
   手機只有鏡片底下那一格顯示文字，其他格的圖示往下置中。顏色用新的平面色塊（沒有毛玻璃、沒有按下的白光）。
   整條列的放大與偏移、鏡片與設定鍵的形變由 JS 的彈簧寫在 inline 的 scale／transform，這裡不對這兩個屬性設 transition */
.nav{position:absolute;z-index:6;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;transform:translateX(-50%)}
/* 工具列浮在內容上面：跟主頁下排一樣帶柔和陰影，外加一圈細線（深色時色塊跟工具列同色，靠這圈分開） */
.tb-main,.tb-gear{box-shadow:0 0 0 1px var(--hair),0 14px 30px -10px var(--stack-sh,rgba(10,42,77,.38))}
.tb-main{position:relative;display:flex;padding:6px;border-radius:999px;background:var(--blk);touch-action:none}
.tb-tabs{position:relative;z-index:1;display:flex;gap:2px}
.nav .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:76px;padding:5px 2px 4px;border-radius:24px;background:transparent;color:var(--muted);font-size:11.5px;letter-spacing:.08em;line-height:1.2;scale:var(--ts,1)}
.tab-ind{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;color:var(--ink)}
.tab-ind svg{width:19px;height:19px;stroke-width:1.7}.nav .tab.on .tab-ind svg{stroke-width:2}
.nav .tab.on .tab-l,.nav .tab.hov .tab-l{color:var(--ink);font-weight:500}
.tb-lens{position:absolute;left:0;top:6px;z-index:0;width:56px;height:30px;border-radius:999px;background:var(--pri);pointer-events:none;will-change:transform;transition:opacity .25s,background-color .35s}
.tb-lens.off{opacity:0}
.nav .tab.lit .tab-ind{color:var(--pri-ink)}
.tb-gear{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--blk);color:var(--ink);transition:color .35s,background-color .35s}
.tb-gear svg{width:21px;height:21px}
.tb-gear.on{background:var(--pri);color:var(--pri-ink)}
.nav .tab-l,.nav .tab-ind{transition:color .35s,opacity .25s var(--out),transform .42s var(--spring)}
#app.narrow .nav .tab:not(.lit) .tab-l{opacity:0;transform:translateY(-3px) scale(.92)}
#app.narrow .nav .tab:not(.lit) .tab-ind{transform:translateY(8px)}
#app.narrow .nav{width:calc(100% - 24px);max-width:480px}
#app.narrow .tb-main{flex:1}#app.narrow .tb-tabs{flex:1;justify-content:space-around}#app.narrow .nav .tab{flex:1;width:auto}#app.narrow .tb-gear{flex:none;width:58px;height:58px}
#app:not(.narrow) .nav{left:14px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
#app:not(.narrow) .tb-main{flex-direction:column}#app:not(.narrow) .tb-tabs{flex-direction:column;gap:0}
#app:not(.narrow) .nav .tab{width:50px;height:48px;padding:0;border-radius:999px}
#app:not(.narrow) .tab-ind{width:auto;height:auto}#app:not(.narrow) .tab-ind svg{width:20px;height:20px}
#app:not(.narrow) .nav .tab-l{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#app:not(.narrow) .tb-lens{left:6px;top:0;width:50px;height:44px}
.seg{touch-action:pan-y}
.sec-h{display:flex;align-items:flex-end;gap:12px;color:var(--on-bg)}
.sec-h b{font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:.06em}
.sec-h span{font-size:14px;opacity:.7;letter-spacing:.06em}
.sec-h .sp{flex:1}
.quiet{grid-column:1/-1;color:var(--muted);font-size:13.5px;padding:8px 4px;justify-self:start}
/* 登入 */
.login{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:clamp(18px,5dvh,44px);color:var(--on-bg)}
/* 開場標誌（照 2026-11-16 分鏡）：1 兩個小人從兩側滑入 2 扣上（黃的從左推過來，力道往右）3 標誌往上讓位、文字冒出，每個字各自的速度與時間 4 完成後才出現登入鈕；文字是由左到右：每個字自己從左邊被揭開、同時往右滑到位，整排也是左邊的字先開始 */
.login .olg{width:auto;height:min(210px,40dvh);max-width:70%;overflow:visible}
#app.narrow .login .olg{height:min(200px,34dvh);max-width:54%}
.olg .li{fill:var(--ink)}.olg .lb{fill:var(--lg-b)}.olg .ly{fill:var(--lg-y)}
/* 深色：左邊的小人只留線稿、右邊實心（照 DievE 給的單色版） */
#app[data-theme="dark"] .olg .oy{fill:none;stroke:var(--ink);stroke-width:1.800px}
.olg .oh{animation:o-up .56s 760ms cubic-bezier(.3,1.2,.4,1) both}
.olg .oy{animation:o-y .62s .14s cubic-bezier(.2,.8,.2,1) both}
.olg .ob{animation:o-b .62s .14s cubic-bezier(.2,.8,.2,1) both}
.olg .ol{animation:o-l var(--t) var(--d) cubic-bezier(.16,1,.3,1) both}
.login .pillb{animation:o-btn .5s 2s var(--out) both}
@keyframes o-y{from{transform:translateX(-210px);opacity:0}30%{opacity:1}62%{transform:translateX(9px)}78%{transform:translateX(9px)}}
@keyframes o-b{from{transform:translateX(120px);opacity:0}30%{opacity:1}56%{transform:translateX(-3px)}70%{transform:translateX(11px)}}
@keyframes o-up{from{transform:translateY(70px)}}
@keyframes o-l{from{clip-path:inset(0 100% 0 0);transform:translateX(-26px);opacity:.15}to{clip-path:inset(0 0 0 0)}}
@keyframes o-btn{from{opacity:0;transform:translateY(14px)}}
.login .pillb{display:flex;align-items:center;gap:10px;height:54px;padding:0 28px;font-size:15.5px}
/* ===== 即時回報 ===== */
.live{display:grid;gap:18px;align-items:start}
#app:not(.narrow) .live.split{grid-template-columns:minmax(260px,360px) minmax(0,1fr)}
.cps{display:grid;gap:10px}
#app:not(.narrow) .live:not(.split) .cps{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cps .sepr{grid-column:1/-1;height:1px;margin:8px 0;background:color-mix(in srgb,var(--on-bg) 22%,transparent)}
.cp{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;border-radius:999px;background:var(--blk);box-shadow:var(--blk-sh,none);text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .24s var(--spring),opacity var(--base) var(--out),box-shadow var(--base) var(--out)}
@media (hover:hover){.cp:hover{transform:scale(1.025)}}
.cp b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .rp{font-size:12.5px;color:var(--late);letter-spacing:.1em}
.cp.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cp.drag{z-index:30;transition:background-color .22s var(--out);cursor:grabbing}
.fete{position:absolute;inset:0;z-index:58;overflow:hidden;pointer-events:none}.fete i{position:absolute;will-change:transform}
.fete .fw{width:min(1100px,190vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--ok) 0,color-mix(in srgb,var(--acc) 70%,transparent) 42%,transparent 70%)}
.cp.over{transform:scale(.96);box-shadow:inset 0 0 0 2px var(--acc2)}
.cp.done{opacity:.5}.cp.done.sel{opacity:1}
.card{position:relative;display:flex;flex-direction:column;min-height:340px;padding:22px 24px 0;border-radius:18px;background:var(--blk);animation:up var(--base) var(--out) both}
#app:not(.narrow) .live.split .card{position:sticky;top:0;max-height:calc(100dvh - 170px)}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:40px}
/* 卡片內部的排法看卡片自己的寬度（中等寬度的視窗、分欄時卡片也會很窄） */
.card{container:card/inline-size}
.c-head,.c-meta,.c-save,.c-tools{flex:none}
@container card (max-width:560px){
 .card .c-head .sp{flex:0 0 100%;height:0}.card .c-title{flex:1 1 0;min-width:8em;white-space:normal}
 .card .ln{flex-wrap:wrap;row-gap:6px;padding-block:6px}.card .ln:not(.tm) .tx{flex:1 1 calc(100% - 46px)}.card .ln:not(.tm):has(.x) .tx{flex-basis:calc(100% - 86px)}
 .card .pa{max-width:100%}.card .tl{flex-basis:100%}.card .tl button{width:36px;height:36px}
 .card .lk{display:flex;flex-wrap:wrap}.card .lk input{flex:1 1 40%;min-width:0}
 .card .ppl2{grid-template-columns:1fr;gap:18px}.card .ppl2>div{padding:0}.card .ppl2>div:first-child{border-right:0}
}
.cps>.card{grid-column:1/-1}
.c-title{flex:0 1 auto;min-width:0;font-size:19px;font-weight:700;line-height:1.35;border-radius:8px;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
input.c-title{flex:1;border:0;background:color-mix(in srgb,var(--ink) 6%,transparent);padding:2px 8px;margin:0 -8px;outline:none}
.cnt{flex:none;min-width:32px;height:22px;padding:0 9px;border-radius:999px;box-shadow:inset 0 0 0 1.500px var(--ink);font-size:11.5px;line-height:1}
.cnt[aria-pressed="true"]{background:var(--ink);color:var(--blk)}
.c-head .sp{flex:1}
.tri{flex:none;display:grid;place-items:center;width:54px;height:30px;border-radius:999px;box-shadow:inset 0 0 0 1.500px var(--ink)}
.tri svg{width:11px;height:11px;fill:currentColor}
.tri:disabled{opacity:.3;pointer-events:none}
.rep{flex:none;height:30px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.500px var(--hair);color:var(--muted);font-size:13px;line-height:1}
.rep[aria-pressed="true"]{background:var(--late);box-shadow:none;color:#fff}
.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 14px;font-size:12.5px;color:var(--muted)}
.c-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;align-content:start;gap:4px;padding:0 8px 10px;margin:0 -8px}
.ln{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 8px;margin:0 -8px;border-radius:12px;transition:background-color var(--fast) var(--out)}
.ln.can{cursor:text}
@media (hover:hover){.ln.can:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}}
.ln .tx{flex:1;min-width:0;transition:color var(--base) var(--out)}
.ln input.tx{border:0;border-bottom:1px solid var(--hair);background:transparent;padding:6px 0;outline:none}
.ln input.tx:focus{border-bottom-color:var(--ink)}
.ln.done span.tx{color:var(--muted);text-decoration:line-through}
.ln .pl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ln .x{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--muted);opacity:0;transition:opacity var(--fast) var(--out),transform .24s var(--spring)}
.ln:hover .x,.ln:focus-within .x{opacity:1}
.ck{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.600px var(--muted);transition:transform .24s var(--spring),background-color var(--fast) var(--out),box-shadow var(--fast) var(--out)}
.ck svg{width:14px;height:14px;stroke:var(--blk);stroke-width:2.400;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .28s var(--spring)}
.ck[aria-checked="true"]{background:var(--ink);box-shadow:none}.ck[aria-checked="true"] svg{transform:none}
.ck:active{transform:scale(.8)}
/* 時間行＝時間線（照舊版看板的 .ev-times）：每個時間行左邊一顆圓點，相鄰的時間行用一條細直線串起來；圓點就是核取——空心＝還沒、實心＝完成。
   時間是純文字（逾期紅字），不用色塊；編輯中時間變成可以點的淡底膠囊。圓點放在行的左側固定位置，文字折行時不會跑到圓點下面 */
.ln.tm{position:relative;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 8px 8px 42px}
.ln.tm .ck{position:absolute;left:8px;top:8px;border-radius:50%;background:none;box-shadow:none}
.ln.tm .ck::before{content:"";width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--ink);transition:background-color var(--fast) var(--out),transform .28s var(--spring)}
.ln.tm .ck svg{display:none}.ln.tm .ck[aria-checked="true"]{background:none}.ln.tm .ck[aria-checked="true"]::before{background:var(--ink);transform:scale(1.12)}
.ln.tm:has(+ .ln.tm)::after{content:"";position:absolute;left:18.25px;top:28px;bottom:-17px;width:1.5px;border-radius:1px;background:var(--hair);pointer-events:none}
.ln.tm .tx{flex:1 1 9em}
.tmc{flex:none;font-size:13px;line-height:1.5;color:var(--muted);white-space:nowrap}.tmc.late{color:var(--late)}
.ln.tm:has(input.tx) .tmc{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--bg);color:var(--ink)}.ln.tm:has(input.tx) .tmc.late{color:var(--late)}
.empty{color:var(--muted);padding:8px 0}
.lk{display:flex;align-items:center;gap:8px;min-height:40px}
.lk input{flex:1;min-width:0;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--bg);outline:none}
.lk input:focus{box-shadow:inset 0 0 0 1.500px var(--ink)}
a.lnk{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--acc2) 14%,var(--blk));color:var(--acc2);font-size:13px;text-decoration:none;line-height:1}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.c-save{display:flex;align-items:center;gap:12px;min-height:30px;font-size:12.5px;color:var(--muted)}
.c-save button{text-decoration:underline;text-underline-offset:4px}
.c-tools{flex:none;z-index:2;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 -24px;padding:14px 24px 18px;border-radius:0 0 18px 18px;background:var(--blk)}
.live:not(.split) .c-body{overflow:visible}
.card.full{position:absolute;inset:0;z-index:60;min-height:0;max-height:none;border-radius:0;padding:18px clamp(18px,5vw,56px) 0;animation:none}
.card.full .c-body{overscroll-behavior:contain}.card.full .c-tools{margin:0 calc(-1*clamp(18px,5vw,56px));padding-inline:clamp(18px,5vw,56px);padding-bottom:calc(18px + env(safe-area-inset-bottom));border-radius:0}
.c-back{flex:none;width:42px;height:42px;margin-left:-8px;background:transparent}
#view.lock{overflow-y:hidden}.live.split .c-body{overscroll-behavior:contain}
.pa{position:relative;display:flex;align-items:center;gap:10px;height:42px;max-width:46%;padding:0 16px 0 20px;border-radius:999px;box-shadow:inset 0 0 0 1.500px var(--ink);font-size:14px;font-weight:500}
.pa span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa svg{width:10px;height:10px;fill:currentColor;flex:none;transition:transform var(--base) var(--spring)}
.pa[aria-expanded="true"] svg{transform:rotate(180deg)}
.pop{position:absolute;left:24px;bottom:78px;z-index:8;min-width:200px;display:grid;gap:4px;padding:8px;border-radius:14px;background:var(--blk2)}
.pop button{height:40px;padding:0 16px;border-radius:14px;text-align:left;color:var(--ink);font-size:14px;transition:background-color var(--fast,160ms) var(--out),transform .24s var(--spring)}
.pop button[aria-selected="true"]{background:var(--blk);font-weight:700}

@media (hover:hover){.tl button:hover{transform:scale(1.14)}}
.tl.paned button{color:color-mix(in srgb,var(--ink) 28%,transparent)}
.tl.paned button.on{color:var(--ink);transform:scale(1.42)}
/* 人、時間、地點、紀錄頁 */
.ppl2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.500fr);min-height:150px}

.ppl2>div{display:grid;align-content:start;gap:12px;padding:0 20px}

.dash{display:grid;place-items:center;min-width:84px;height:36px;padding:0 16px;border-radius:999px;border:1.500px dashed var(--ink);font-size:17px;line-height:1}

.art{display:none}
.tile .top,.wc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}

.en{display:block;font-family:"Jost",sans-serif;font-style:normal;font-size:10px;font-weight:400;letter-spacing:.22em;line-height:1.5;opacity:.62;white-space:nowrap}
.tile .nm{font-size:17px;font-weight:700;letter-spacing:.08em}
.tile .go2,.wc .go2{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,currentColor 14%,transparent)}
.tile .go2 svg,.wc .go2 svg{width:16px;height:16px;transform:rotate(-45deg)}
.wc .big{font-size:36px}
.wc .art{width:58%;right:4%;bottom:auto;top:14px}
.tile .big,.wc .big{position:relative;font-size:clamp(30px,3.4vw,40px);font-weight:300;line-height:1}
.tile .big small,.wc .big small{display:block;margin-top:6px;font-size:12.5px;font-weight:400;opacity:.8}
.tile .n{top:auto;bottom:18px;right:18px}
/* 手機首頁：錢包式卡片堆（上下滑動；後面的卡片縮小往上疊，前面的往下排） */
/* 進部門的翻面：.flw 給透視；.fl＝卡片分身（前半）、.fb＝畫面大小的底板（後半） */
.flw{position:absolute;inset:0;z-index:70;overflow:hidden;perspective:1500px;pointer-events:none}
.flw .fl,.flw .fb{position:absolute;will-change:transform}.flw .fb{inset:0;background:var(--bg)}
/* 新增即時回報的浮動圓鈕：浮在內容上面，所以跟疊放的卡片一樣帶柔和陰影 */
.fab{position:absolute;right:clamp(16px,4vw,56px);bottom:32px;z-index:1;display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--pri);color:var(--pri-ink);pointer-events:auto;box-shadow:0 12px 28px -8px var(--stack-sh,rgba(10,42,77,.4))}.fab svg{width:24px;height:24px}
#app.narrow .fab{right:18px;bottom:106px}
.wal{position:relative;height:540px;margin-top:6px;touch-action:none;user-select:none;-webkit-user-select:none}
/* 疊在一起的卡片之間用一層柔和的模糊陰影分出前後（DievE 2026-11-17 指定；全站只有「疊放」的東西用陰影，平鋪的色塊仍然不用） */
.wc,#app.narrow .dock{box-shadow:0 -14px 30px -6px var(--stack-sh,rgba(10,42,77,.13))}
#app[data-theme="dark"]{--stack-sh:rgba(0,0,0,.62)}
.wc{position:absolute;left:0;right:0;top:0;height:196px;border-radius:18px;background:var(--c);color:var(--ci);display:grid;align-content:start;gap:10px;padding:20px 22px;text-align:left;transform-origin:50% 0;will-change:transform}
.wc .nm{font-size:20px;font-weight:700;letter-spacing:.08em}
.wc .n{position:absolute;left:22px;top:104px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--late);color:#fff;font-size:12.500px;display:grid;place-items:center}

.lg{pointer-events:none}
.lg .lb{fill:var(--lg-b)}.lg .ly{fill:var(--lg-y)}.lg .lw{fill:var(--blk)}.lg .lo{fill:#d77022}

.lg.sm{width:40px;height:40px;flex:none}
/* ===== 標誌動作（第二版）=====

   需要一起動的零件在 logo() 裡包成群組（.ga、.gb），整個小人包成 .all 做跳、晃這類整體動作。選到時播一次。 */
.lg{overflow:visible}
.lg :is(path,rect,g){transform-box:fill-box;transform-origin:50% 100%}

:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="rig"] .p0{transform-origin:100% 100%;animation:lg-jolt .75s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="rig"] .p2{transform-origin:50% 50%;animation:lg-ink .75s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="fin"] .all{animation:lg-coin 1s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="fin"] .ga{animation:lg-bob 1s both}

:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="wor"] .p0{transform-origin:50% 0;animation:lg-duck .8s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="soc"] .all{transform-origin:50% 50%;animation:lg-turn .8s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="soc"] .p1{--x:0px;--y:-8px;animation:lg-peek .7s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="soc"] .gb{--x:-8px;--y:0px;animation:lg-peek .7s .06s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="soc"] .p8{--x:8px;--y:0px;animation:lg-peek .7s .12s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="soc"] .p11{--x:0px;--y:8px;animation:lg-peek .7s .18s both}

:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="mkt"] .p1{transform-origin:100% 50%;animation:lg-fold .8s .1s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="mkt"] .p2{transform-origin:0 50%;animation:lg-fold .8s .1s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="pr"] .ga{animation:lg-shake .8s .08s both}
:is(.tile.on,.wc[aria-current="true"]) .lg[data-d="pr"] :is(.p1,.p2){animation:lg-lift .8s .08s both}
