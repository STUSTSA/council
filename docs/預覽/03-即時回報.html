/* ===== 液態玻璃材質 ===== */
/* .glass：毛玻璃（對話框、底部工具列、搜尋欄、分段切換；util.js 的 glassify）。背景模糊＋內緣高光，不用 SVG 折射；
   2026-11-16（03）拿掉跟著指標移動的光點（使用者：對話框上的光點）
   底色用變數：--glass-bg（半透明，配背景模糊）、--glass-solid（純色，手機用，見本段最後）；別的規則要換底色時改這兩個變數，不直接寫 background */
.glass{--glass-bg:rgba(28,28,30,.34);--glass-solid:#1c1c1e;--glass-sh:inset 0 0 0 .5px rgba(255,255,255,.2),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.6),inset -1.5px -1.5px 1px -1px rgba(255,255,255,.2),inset 0 0 24px rgba(255,255,255,.045),0 14px 34px rgba(0,0,0,.45);position:relative;isolation:isolate;background:var(--glass-bg);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);box-shadow:var(--glass-sh)}   /* 光影放在 --glass-sh，別的規則要保留它時直接引用 */
:root:not([data-theme="dark"]) .glass{--glass-sh:inset 0 0 0 .5px rgba(0,0,0,.1),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.95),inset -1.5px -1.5px 1px -1px rgba(255,255,255,.6),inset 0 0 22px rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.14);--glass-bg:rgba(255,255,255,.42);--glass-solid:#f2f2f5}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .glass{--glass-sh:inset 0 0 0 .5px rgba(255,255,255,.2),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.6),inset -1.5px -1.5px 1px -1px rgba(255,255,255,.2),inset 0 0 24px rgba(255,255,255,.045),0 14px 34px rgba(0,0,0,.45);--glass-bg:rgba(28,28,30,.34);--glass-solid:#1c1c1e}
}
/* 手機（觸控）：不用背景模糊，玻璃一律純色（2026-11-06 使用者：動畫順暢最重要，玻璃會加重手機負擔就換純色；Pixel 10）。
   背景模糊在後面的內容一動（捲動、展開、換頁）就要每格重算。內緣高光、陰影、反光照舊，動畫與層級不變 */
@media (pointer:coarse){
  .glass{background:var(--glass-solid)}
  .glass,dialog#dlg.glass,.csel-list,dialog#dlg[open]::backdrop{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--surface)!important}
}

/* ===== 底部工具列（手機）／左側細欄（桌面 900px 以上） =====
   材質是毛玻璃 .glass；鏡片是實心膠囊，鏡片底下那一格（.lit，nav.js 每格判斷）的圖示反白。
   按鈕機制照 Convx（見 nav.js 開頭），手機與桌面同一套。JS 每一格寫入：--ts 分頁內容放大、--hp／--hx／--hy 按下白光；
   整條列的放大與偏移、鏡片與設定鍵的形變用 inline 的 scale／transform（這兩個屬性在這段不設 transition，避免跟彈簧打架） */
.tabbar{--tb-ink:var(--ink);--tb-surface:var(--surface);--tb-muted:var(--muted);position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:10px;transform:translateX(-50%);transition:opacity .35s}
.tb-main{display:flex;padding:6px;border-radius:999px;touch-action:none;--hr:92px}
/* 按下白光（Convx InteractiveHighlight：中心半徑內 .15、外圈淡出；整片再亮 .08；--hp＝按下程度）。在毛玻璃底色之上、內容之下 */
#tabbar .tb-main::before,#tabbar .tb-gear::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle var(--hr,60px) at var(--hx,50%) var(--hy,50%),rgba(255,255,255,calc(.15 * var(--hp,0))) 50%,rgba(255,255,255,0)),linear-gradient(rgba(255,255,255,calc(.08 * var(--hp,0))),rgba(255,255,255,calc(.08 * var(--hp,0))))}
.tb-tabs{position:relative;z-index:1;display:flex;gap:2px}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:76px;min-height:0;padding:5px 2px 4px;border:0;border-radius:24px;background:transparent;color:var(--tb-muted);font-size:11.5px;letter-spacing:.08em;line-height:1.2;scale:var(--ts,1);-webkit-tap-highlight-color:transparent}
#tabbar .tab:hover,#tabbar .tab:active{transform:none;box-shadow:none}   /* 取消一般按鈕的 hover 浮起與光暈；不用 !important，按下的形變（inline）才不會被擋掉 */
#tabbar .tb-gear:hover,#tabbar .tb-gear:active{transform:none;box-shadow:var(--glass-sh)}   /* 設定鍵：同上，但保留毛玻璃的光影 */
.tab-ind{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;font-size:19px;color:var(--tb-ink);transition:color .25s}
.tab .tab-l{transition:color .2s}
.tab.on .tab-l,.tab.hov .tab-l{color:var(--tb-ink);font-weight:500}
.tab .ico{stroke-width:1.7}
.tab.on .ico{stroke-width:2}
/* 選取鏡片：實心膠囊（文字色），永遠在圖示底下；鏡片底下那一格的圖示反白 */
.tb-lens{position:absolute;left:0;top:6px;z-index:0;width:56px;height:30px;border-radius:999px;background:var(--tb-ink);pointer-events:none;will-change:transform;transition:opacity .25s,background-color .35s}
#tabbar .tb-lens.off{opacity:0}
#tabbar .tab.lit .tab-ind{color:var(--tb-surface)}
.tb-gear{width:62px;height:62px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;min-height:0;color:var(--tb-ink);font-size:21px;--hr:92px;-webkit-tap-highlight-color:transparent;transition:color .35s,background-color .35s}
/* 本週週報還沒產出（週五起，weekly.js 的 weekDotSync）：設定鍵右上角一顆紅點（以前在頁首「每週概述」鈕上） */
.tb-due{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg);opacity:0;transform:scale(0);pointer-events:none;transition:opacity var(--mo-base) var(--mo-out),transform var(--mo-slow) var(--mo-spring)}
#setBtn.due .tb-due{opacity:1;transform:none}
/* 依背後亮度反轉（nav.js 的 tbContrast，標在分頁列與設定鍵上）：文字色與玻璃底色一起換 */
.tabbar .on-light{--tb-ink:#111114;--tb-surface:#fff;--tb-muted:#4a4a53}
#tabbar .glass.on-light{--glass-bg:rgba(255,255,255,.42);--glass-solid:#f2f2f5}
.tabbar .on-dark{--tb-ink:#f4f4f6;--tb-surface:#111114;--tb-muted:#b9b9c2}
#tabbar .glass.on-dark{--glass-bg:rgba(28,28,30,.34);--glass-solid:#1c1c1e}
/* 設定鍵選取＝跟鏡片一樣的實心（放在反轉色之後，選取時蓋過玻璃底色） */
#tabbar .tb-gear.on{background:var(--tb-ink);color:var(--tb-surface)}
#tabbar .tb-gear.on .ico{stroke-width:2}
.tabbar .tab-l,.tabbar .tab-ind{transition:color .35s,background-color .35s,opacity .25s var(--mo-out),transform .42s var(--mo-spring)}
/* 底部工具列（900px 以下）：只有鏡片底下那一格（.lit，跟著鏡片走，拖曳時也是）顯示文字；其他格文字淡掉、圖示往下移到置中
   （2026-11-06 使用者：沒被選到的不用顯示文字）。只動 transform／opacity，分頁寬高不變，鏡片位置照舊（用版面位置算）；設定打開時（鏡片關掉）全部只剩圖示 */
@media (max-width:899px){
  .tabbar .tab:not(.lit) .tab-l{opacity:0;transform:translateY(-3px) scale(.92)}
  .tabbar .tab:not(.lit) .tab-ind{transform:translateY(8px)}
}
#tabbar .tab:focus-visible,#tabbar .tb-gear:focus-visible{outline:none}
#tabbar .tab:focus-visible .tab-l{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
#tabbar .tb-gear:focus-visible .ico{transform:scale(1.15)}
#tabbar .tab:focus-visible .tab-ind .ico{transform:scale(1.15)}
.tab-ind .ico{transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
@media (max-width:640px){
  .tabbar{width:calc(100% - 24px);max-width:480px}
  .tb-main{flex:1}
  .tb-tabs{flex:1;justify-content:space-around}
  .tabbar .tab{flex:1;width:auto}
  .tb-gear{width:58px;height:58px;flex:none}
}
/* 桌面：左側直立的分頁列（只有圖示，照手機分頁列的比例：外框 6px、按鈕 50×48、跟設定鍵同寬 62），設定鍵一樣分開放在下面，整組垂直置中。
   文字標籤只留給讀屏；鏡片 50×44，互動跟手機一樣（按下放大、按住鏡片可上下拖，見 nav.js）。
   內容讓出的寬度是基礎段的 --rail-in */
@media (min-width:900px){
  .tabbar{left:calc(14px + env(safe-area-inset-left));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:10px}
  .tb-main{flex-direction:column}
  .tb-tabs{flex-direction:column;gap:0}
  .tabbar .tab{width:50px;height:48px;padding:0;border-radius:999px;color:var(--tb-muted)}
  .tab-ind{width:auto;height:auto;font-size:20px;color:var(--tb-muted)}
  .tabbar .tab-l{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .tb-lens{left:6px;top:0;width:50px;height:44px}
}

/* ===== 設定頁 ===== */
.set-ov{position:fixed;inset:0;z-index:38;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:10px;padding:calc(14px + env(safe-area-inset-top)) max(clamp(14px,3vw,40px),env(safe-area-inset-right)) 0 calc(var(--rail-in) + max(clamp(14px,3vw,40px),env(safe-area-inset-left)))}
.set-ov[hidden]{display:none}
.set-ov .anim-top{padding-bottom:18px}
/* 標題列（2026-11-06）：不寫「SETTINGS 設定」，左邊放學生會 logo（頁首同一個 .logo，深淺色規則在「頁首」段），右邊關閉／返回 */
.set-top{flex-wrap:nowrap}
.set-logo{display:flex;align-items:center;height:44px;min-width:0}
.set-logo .logo{height:36px}
.set-sub .set-logo .logo{height:32px}
/* 清單（.set-scroll）與右側面板（.set-pane）：平常清單佔滿、內容置中；
   桌面版選了有下一層的項目時加 .split，清單縮成左欄（寬度變化由 nav.js 用 Web Animations 做），面板從右邊滑入 */
.set-body{flex:1;min-height:0;display:flex;gap:clamp(20px,3vw,48px)}
.set-scroll{flex:1 1 100%;min-width:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.set-body.split .set-scroll{flex:0 0 min(440px,40%)}
.set-pane{flex:1 1 0;min-width:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:14px 4px calc(32px + var(--bar-in) + env(safe-area-inset-bottom))}
.set-pane[hidden]{display:none}
/* 手機版的下一層（nav.js 的 subRun）：設定清單點了有下一層的項目，進到這個全畫面子頁，表單畫在 .set-sub-body 裡（樣式跟桌面右側面板同一套）；
   左上「返回」回到設定清單。進出用換頁動畫（pagefx.js） */
.set-sub{z-index:39}
.set-sub .anim-top{padding-bottom:8px}
.set-sub-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:10px 2px calc(32px + var(--bar-in) + env(safe-area-inset-bottom))}
.set-row[aria-current="true"]{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.set-row[aria-current="true"] .sr-chev{color:var(--ink)}
/* 合併頁（nav.js 的 hubRun）：畫在右側面板／手機子頁裡，標題跟面板裡的表單同一種（20px＋細分隔線），下面一個圓角框一列一個功能；
   從功能回來時整頁從右邊滑入淡入（跟面板表單同一個 paneFormIn） */
.set-hub{display:grid;gap:16px;max-width:640px;animation:paneFormIn var(--mo-slow) var(--mo-out) both}
.set-hub[hidden]{display:none}
.set-hub-t{font-size:20px;font-weight:500;letter-spacing:.08em;padding-bottom:12px;border-bottom:1px solid var(--hair)}
/* 「這台裝置」：iPhone／iPad Safari 加入主畫面的步驟（03 F4，唯一的操作說明例外）。外框同 .set-list，一步一列、前面等寬步驟號 */
.dev-steps{list-style:none;counter-reset:dev;margin:0;padding:0;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.dev-steps li{counter-increment:dev;display:flex;gap:14px;align-items:baseline;padding:13px 20px;font-size:15px}
.dev-steps li+li{border-top:1px solid var(--hair)}
.dev-steps li::before{content:counter(dev);flex:0 0 auto;color:var(--muted);font-family:"Jost",sans-serif;font-variant-numeric:tabular-nums}
/* 「報告」那一列、合併頁裡「每週概述」那一列（登入前是清單上的「每週概述」）：本週週報還沒產出時，圖示右上角紅點 */
.set-row:is([data-set="week"],[data-set="report"],[data-hub="week"]) .sr-ico{position:relative}
.set-row:is([data-set="week"],[data-set="report"],[data-hub="week"]).due .sr-ico::after{content:"";position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
/* 登入前：整頁只有鎖頭（鎖扣循環開合，nav.js 的 gateAnim） */
.set-gate{display:grid;justify-items:center;gap:10px;text-align:center;padding:12vh 0 0}
.set-gate>b{font-size:18px;font-weight:500;letter-spacing:.08em}
.set-gate .sub{margin:0}
.set-gate .primary{margin-top:10px;padding-left:28px;padding-right:28px}
.set-gate-ico{display:grid;place-items:center;width:168px;height:168px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);margin-bottom:8px}
.set-gate-ico svg{overflow:visible}
.set-gate-ico:hover{transform:none;box-shadow:0 0 28px 2px color-mix(in srgb,var(--ink) 22%,transparent)}
.set-inner{max-width:720px;margin:0 auto;grid-template-columns:minmax(0,1fr);padding:14px 0 calc(32px + var(--bar-in) + env(safe-area-inset-bottom));display:grid;gap:20px}   /* 沒有小標題，塊與塊之間只靠間距分開 */
.set-row:hover{transform:none;box-shadow:none;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.set-row:active{transform:none;background:color-mix(in srgb,var(--ink) 11%,transparent)}
.set-list{display:grid;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.set-row{width:100%;display:flex;justify-content:flex-start;align-items:center;gap:14px;padding:15px 20px;border-radius:0;border:0;text-align:left;background:transparent;color:var(--ink);min-height:0;transition:background-color .2s;white-space:normal}  /* 按鈕預設不換行；這裡要讓長說明換行，否則整頁被撐寬 */
.set-row+.set-row{border-top:1px solid var(--hair)}
.set-row[aria-disabled="true"]{cursor:default;opacity:.5}
.set-row[aria-disabled="true"]:hover,.set-row[aria-disabled="true"]:active{background:transparent}
.sr-ico{font-size:22px;line-height:1;display:grid}
.sr-t{flex:1;min-width:0;display:grid;gap:2px}
.sr-t b{font-weight:500;letter-spacing:.06em}
.sr-t small{color:var(--muted);font-size:12.5px}
.sr-chev{color:var(--muted);display:grid}
.set-p{margin:0;color:var(--muted);font-size:14px;line-height:1.85;padding:0}

/* ===== 帳號與會長室管理（02B，account.js）=====
   新資料庫的部門：設定頁的 Google 登入、帳號、會長室管理（人員、QR 邀請、申請、紀錄）。面板畫在設定頁右側面板／手機子頁，
   外框沿用 .set-hub、.set-list、.set-row；這裡只有面板裡新增的列、膠囊、QR 卡片與紀錄清單。不放說明文字（2026-11-13 使用者） */
.acct-err{margin:4px 0 0;color:var(--red);font-size:13.5px}
.acct-empty{padding:16px 20px}
.acct-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.acct-chip{font-size:12px;line-height:1;padding:5px 10px;border-radius:999px;border:1px solid var(--hair);color:var(--ink)}
.acct-chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acct-person{display:grid;gap:2px}
.acct-person b{font-size:17px;font-weight:500;letter-spacing:.06em}
.acct-person small,.acct-line small{color:var(--muted);font-size:12.5px}
/* 面板裡的一列（不是按鈕）：左邊文字、右邊小按鈕 */
.acct-line{display:flex;align-items:center;gap:10px;padding:13px 20px;min-width:0}
.acct-line+.acct-line{border-top:1px solid var(--hair)}
.acct-line>span{flex:1;min-width:0;display:grid;gap:2px}
.acct-line>span b{font-weight:500;letter-spacing:.04em}
.acct-line button.icon{flex:0 0 auto}
.acct-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.acct-acts .add-row{margin-top:0}
.acct-new{justify-self:start}
/* QR 卡片：QR 一律白底黑點（深色模式也是，掃描比較穩），到期後變淡、只剩「重新產生」 */
.acct-qr{display:grid;justify-items:center;gap:8px;padding:22px 20px;border:1px solid var(--line);border-radius:24px;text-align:center}
.acct-qr-img{width:min(240px,70vw);aspect-ratio:1;padding:14px;border-radius:18px;background:#fff;transition:opacity var(--mo-slow) var(--mo-out),filter var(--mo-slow) var(--mo-out)}
.acct-qr-img svg{display:block;width:100%;height:100%}
.acct-qr.off .acct-qr-img{opacity:.25;filter:grayscale(1)}
.acct-qr>b{font-size:17px;font-weight:500;letter-spacing:.08em}
.acct-qr-t{font-family:"Jost",sans-serif;font-weight:300;font-size:34px;letter-spacing:.04em;line-height:1}
.acct-qr .acct-acts{justify-content:center;margin-top:6px}
.acct-filter .fld{margin:0}
.acct-filter .fld-l{display:none}
/* 紀錄：時間欄等寬、內容兩行（動作＋對象；差異；操作者・第幾號） */
.acct-log{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.acct-log:empty{display:none}
.acct-log li{display:flex;gap:14px;padding:12px 20px;min-width:0}
.acct-log li+li{border-top:1px solid var(--hair)}
.acct-log-t{flex:0 0 auto;color:var(--muted);font-size:12.5px;padding-top:2px;font-variant-numeric:tabular-nums}
.acct-log-b{flex:1;min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}
.acct-log-b b{font-weight:500}
.acct-log-b small{color:var(--muted);font-size:12.5px}
.acct-chain{font-size:13px;color:var(--ok)}
.acct-chain.bad{color:var(--red)}
/* 匯入（02D D-a）：筆數報告表（項目、資料檔、Firestore、結果），外框同 .acct-log；不同的列與「不通過」用紅字。數字欄等寬靠右 */
.imp-tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;font-size:13.5px}
.imp-tbl th,.imp-tbl td{padding:10px 14px;text-align:left;font-weight:400}
.imp-tbl th{color:var(--muted);font-size:12.5px}
.imp-tbl tbody td{border-top:1px solid var(--hair)}
.imp-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.imp-tbl tr.bad td,.imp-res.bad{color:var(--red)}
.imp-res{color:var(--ok)}
.imp-hash{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.imp-sum{padding-inline:0}
.imp-step{padding:6px 0}
.imp-big .acct-log-b small{color:var(--red)}
@media (max-width:520px){.imp-tbl th,.imp-tbl td{padding:9px 10px}}

/* ===== 通知層（notify.js）：搜尋＋今日／明日＋近期（智慧堆疊）＋海報月曆（2026-11-05，交接說明四十二） =====
   版面沿用設定頁的 .set-ov；內容寬度上限 920px 置中。顏色：本部門＝即時回報狀態色、全會＝部門色（--c，由 JS 給） */
.noti-ov{z-index:37}
.noti-inner{max-width:920px;margin:0 auto;padding:18px 0 calc(32px + var(--bar-in) + env(safe-area-inset-bottom));display:grid;gap:30px}
.noti-ov .set-scroll{padding-inline:10px;margin-inline:-10px}   /* 本部門／全會貼著內容左邊：捲動區左右多留 10px，按下放大時玻璃的外陰影不會被切掉（內容位置不變） */
.noti-note{margin:-14px 0 -8px}
/* 小標題：粗體名稱＋次要色說明 */
.noti-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:.08em}
.noti-h b{color:var(--ink);font-size:17px;font-weight:700;letter-spacing:.12em}

/* --- 範圍切換＋常駐搜尋欄：捲動時貼在最上面（內容從玻璃底下滑過去） --- */
.noti-bar{position:sticky;top:0;z-index:5;max-width:920px;margin:0 auto;padding:14px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent))}
.noti-find{position:relative;flex:1 1 240px;min-width:0}
/* 搜尋膠囊：跟底部工具列同一種毛玻璃（.glass，glassify 加上去）；輸入框本身沒有外觀 */
.noti-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;border-radius:999px;cursor:text;transition:transform var(--mo-slow) var(--mo-spring),box-shadow var(--mo-base) var(--mo-out)}
/* 點下去的動畫：跟頁首搜尋欄同一套（按下微縮、聚焦彈開、放大鏡轉一下、提示字淡開） */
.noti-search:active{transform:scale(.97);transition-duration:var(--mo-fast)}
.noti-search:focus-within{transform:scale(1.02)}
.noti-search .ns-ico{transition:transform var(--mo-slow) var(--mo-spring),opacity var(--mo-base) var(--mo-out)}
.noti-search:focus-within .ns-ico{transform:rotate(-14deg) scale(1.15);opacity:.9}
.noti-search input::placeholder{transition:opacity var(--mo-base) var(--mo-out)}
.noti-search input:focus::placeholder{opacity:.4}
.noti-search .ns-ico{flex:none;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;opacity:.7}
.noti-search input{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;color:var(--ink);font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.noti-search input::placeholder{color:var(--muted);opacity:1}
.noti-search input:focus,.noti-search input:focus-visible{outline:none}
.noti-search:focus-within{box-shadow:var(--glass-sh),inset 0 0 0 1.5px var(--ink)}
.nq-clear{flex:none;width:34px;height:34px;min-height:0;padding:0;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity var(--mo-fast) var(--mo-out),transform var(--mo-base) var(--mo-spring)}
.noti-search.has-q .nq-clear{opacity:.75;pointer-events:auto;transform:none}
.nq-clear .ico{width:16px;height:16px}
@media (hover:hover){.nq-clear:hover{transform:none;box-shadow:none;opacity:1}}
/* 搜尋結果：搜尋欄下面浮出的毛玻璃清單 */
/* 要比 .glass（position:relative，在後面的「液態玻璃材質」段）權重高，才會浮在內容上面而不是把搜尋欄下面撐開 */
.noti-find .noti-res{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:min(56vh,380px);overflow:auto;overscroll-behavior:contain;border-radius:22px;padding:6px;display:grid;align-content:start}
.noti-find .noti-res[hidden]{display:none}
.nr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;width:100%;min-height:0;padding:10px 12px;border:0;border-radius:16px;background:transparent;text-align:left;white-space:normal}
.nr+.nr{box-shadow:0 -1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.nr:hover,.nr:focus-visible{transform:none;box-shadow:none;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.nr-when{min-width:5.2em;font-size:13px;color:var(--muted);position:relative;padding-left:12px}
.nr-when::before{content:"";position:absolute;left:0;top:.45em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.nr-main{display:grid;gap:1px;min-width:0}
.nr-main b{font-weight:500}
.nr-main small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr mark{background:color-mix(in srgb,var(--su-yellow) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.nr-none{margin:0;padding:12px;color:var(--muted);font-size:13.5px}

/* --- 今日／明日：左右兩張卡片（手機也並排）；今日反白、明日一般卡片底 --- */
.noti-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nd-card{--nd-bg:color-mix(in srgb,var(--ink) 5%,var(--bg));--nd-ink:var(--ink);--nd-mut:var(--muted);--nd-rule:color-mix(in srgb,var(--ink) 12%,transparent);
  display:flex;flex-direction:column;align-items:stretch;gap:14px;min-height:196px;padding:18px 18px 16px;border:0;border-radius:26px;background:var(--nd-bg);color:var(--nd-ink);text-align:left;white-space:normal;font-weight:400;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.nd-card.today{--nd-bg:var(--ink);--nd-ink:var(--bg);--nd-mut:color-mix(in srgb,var(--bg) 62%,var(--ink));--nd-rule:color-mix(in srgb,var(--bg) 18%,transparent)}
/* 按壓回饋由 notify.js 的 ndPress（Web Animations）做，這裡關掉共用按鈕的 hover／active 縮放 */
.nd-card:hover,.nd-card:active{transform:none;box-shadow:none}
@media (hover:hover){.nd-card:hover{background:color-mix(in srgb,var(--nd-ink) 4%,var(--nd-bg))}}
.nd-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--nd-rule)}
.nd-num{font-family:"Jost",sans-serif;font-weight:200;font-size:54px;line-height:.8;letter-spacing:-.02em}
.nd-lab{display:grid;justify-items:end;gap:3px;text-align:right}
.nd-lab b{font-size:14px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.nd-lab b i{font-style:normal;font-weight:400;color:var(--nd-mut)}
.nd-lab small{font-size:12px;color:var(--nd-mut);letter-spacing:.06em}
.nd-list{display:grid;gap:11px}
.nd-row{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:baseline}
.nd-t{position:relative;padding-left:11px;font-size:12.5px;color:var(--nd-mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.nd-t::before{content:"";position:absolute;left:0;top:.48em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.nd-card.today .nd-t::before{box-shadow:0 0 0 1.5px var(--nd-bg)}
.nd-x{display:grid;gap:1px;min-width:0}
.nd-x b{font-size:14px;font-weight:500;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nd-x small{font-size:11.5px;line-height:1.4;color:var(--nd-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-more{font-size:12px;color:var(--nd-mut);padding-left:calc(3.4em + 8px)}
/* 今日卡片下方「● 今天處理 N 件」：只寫件數，點今日卡片看全螢幕的「今日」層；出現時由下往上淡入（2026-11-06 使用者：浮現的字要有動畫） */
.nd-pick{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:11px;border-top:1px dashed var(--nd-rule);white-space:nowrap;animation:ndRise .5s var(--mo-out) both}
.nd-pick>i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.nd-pick>small{font-size:11.5px;letter-spacing:.08em;color:var(--nd-mut)}
.nd-pick>b{font-size:20px;font-weight:300;line-height:1}
@keyframes ndRise{from{opacity:0;transform:translateY(8px)}}
/* 沒有事件：一條短細線＋淡字，放在卡片下方 */
.nd-empty{margin-top:auto;display:grid;gap:10px;font-size:13px;color:var(--nd-mut);letter-spacing:.1em}
.nd-empty i{display:block;width:28px;height:1px;background:currentColor;opacity:.6}
@media (max-width:640px){
  .noti-days{gap:10px}
  .nd-card{min-height:176px;padding:15px 14px 14px;border-radius:22px;gap:12px}
  .nd-num{font-size:44px}
  .nd-lab b{font-size:13px;letter-spacing:.06em}
  .nd-row{grid-template-columns:minmax(0,1fr);gap:1px}
  .nd-x b{font-size:13.5px}
  .nd-more{padding-left:11px}
}

/* --- 今日（獨立一層，notify.js 的 openToday） ---
   點今日卡片：整層用 clip-path 從卡片的位置與圓角揭開成全螢幕、內容從卡片位置彈到定位（彈簧，略帶回彈）；各列逐一由下往上；關閉時彈回卡片 */
.td-ov{position:fixed;inset:0;z-index:39;color:var(--bg)}
.td-ov[hidden]{display:none}
.td-bg{position:absolute;inset:0;background:var(--ink)}
.td-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(40px + var(--bar-in) + env(safe-area-inset-bottom)) calc(var(--rail-in) + max(18px,env(safe-area-inset-left)))}   /* 讓出底部工具列／左側細欄 */
.td-in{max-width:720px;margin:0 auto;display:grid;gap:28px}   /* 展開／收合的位移、縮放、透明度由 notify.js 的 todayMorph 依彈簧曲線做 */
.td-top{display:flex;align-items:flex-end;gap:14px;padding-bottom:16px;border-bottom:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.td-num{font-family:"Jost",sans-serif;font-weight:200;font-size:88px;line-height:.78;letter-spacing:-.03em}
.td-lab{display:grid;gap:4px}
.td-lab b{font-size:20px;font-weight:700;letter-spacing:.14em}
.td-lab small{font-size:13px;opacity:.65;letter-spacing:.08em}
.td-x-btn{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;border-color:color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg)}
.td-x-btn .ico{width:15px;height:15px}
.td-sec h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:.14em}
.td-sec h3 small{font-size:11.5px;font-weight:400;opacity:.6;letter-spacing:.06em}
.td-sec h3 .num{margin-left:auto;font-size:13px;font-weight:400;padding:0 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);line-height:20px}
.td-sec.is-pick h3{color:var(--ok)}
.td-sec.is-pick h3 .num{border-color:var(--ok)}
.td-list{list-style:none;margin:0;padding:0;display:grid}
.td-row{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid color-mix(in srgb,var(--bg) 12%,transparent);opacity:0;transform:translateY(10px)}
.td-ov.on .td-row{opacity:1;transform:none;transition:opacity .35s,transform .5s var(--mo-out);transition-delay:calc(.26s + var(--s,0) * .1s + var(--i) * .04s)}
.td-sec{--s:0}.td-sec.is-pick{--s:1}
.td-t{position:relative;padding-left:13px;font-size:13px;opacity:.75;white-space:nowrap}

/* --- 整理：交友軟體式左滑右滑（notify.js 的 deckHTML／dkBind） ---
   卡片堆最多露出三張（後面的往下 10px、縮 5%）；最上面那張跟手指走並傾斜，右滑浮出綠色「今天處理」、左滑浮出「還不要」；
   下面一排：✕（還不要）、復原、✓（今天處理）；全部滑完整區收起來（notify.js 的 triFold），不畫空狀態 */
.noti-deck{display:grid;gap:12px;scroll-margin-top:150px}   /* scroll-margin：捲過來時留出上面 sticky 的範圍切換＋搜尋欄 */
.dk-stack{position:relative;height:196px;touch-action:pan-y;-webkit-user-select:none;user-select:none}

.dk-card[data-i="0"]{background:color-mix(in srgb,var(--ink) 4%,var(--bg));box-shadow:inset 0 0 0 1px var(--hair),0 14px 32px rgba(0,0,0,.16)}
.dk-card[data-i="0"]:active{cursor:grabbing}
.dk-card:not([data-i="0"]){pointer-events:none}
.dk-date{display:grid;justify-items:center;min-width:3.6em;padding-right:18px;border-right:1px solid color-mix(in srgb,var(--ink) 12%,transparent);line-height:1}

.dk-date small{margin-top:8px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-align:center;line-height:1.4}

.dk-main b{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:.02em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dk-dot{display:inline-block;width:9px;height:9px;margin:0 8px 2px 0;border-radius:50%;background:var(--c);vertical-align:middle}

/* 拖曳時浮出的印章（--yes／--no＝0～1，由拖曳距離決定） */
.dk-yes,.dk-no{position:absolute;top:16px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.12em;pointer-events:none;opacity:var(--o,0)}

/* --- 行事曆：月份列＋「這一天」＋海報月曆 --- */
.noti-cal{display:grid;gap:14px}
.cal-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-top .noti-h{margin:0 auto 0 0}
.cal-top :is([data-nmon="-1"],[data-nmon="1"]){width:36px;height:36px;min-height:0;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}   /* 上一月、下一月：正圓（「回到本月」是一般膠囊鈕，不能套到） */

/* 「這一天」：點了月曆上某一天才出現（在月曆上方），一列事件標籤：顏色點＋時刻＋名稱＋小字出處；右上 ✕ 收起 */
.noti-dayview{scroll-margin-top:150px;display:grid;gap:10px;padding:14px 16px 16px;border-radius:22px;background:color-mix(in srgb,var(--ink) 5%,var(--bg))}

/* 這一天的事件（2026-11-06 使用者：膠囊遇到長標題會折行、太醜 → 改成清單列）：左邊一條部門／狀態色的細直條，右邊標題（可以折行）、下一行次要色小字「時間・所屬」；列與列之間細線 */
.dv-tags{display:grid}
.dv-tag{animation:ndRise .45s var(--mo-out) both}.dv-tag:nth-child(2){animation-delay:.04s}.dv-tag:nth-child(3){animation-delay:.08s}.dv-tag:nth-child(4){animation-delay:.12s}.dv-tag:nth-child(n+5){animation-delay:.16s}
.dv-tag{display:grid;grid-template-columns:7px minmax(0,1fr);gap:12px;padding:11px 2px;font-size:14px}
.dv-tag+.dv-tag{border-top:1px solid var(--hair)}
/* 狀態色用燈號（7px 圓點，對齊名稱第一行的中間），跟今日卡片、今日層同一種（2026-11-06 使用者：原本的直條跟現在的視覺語言不合） */
.dv-tag i{width:7px;height:7px;margin-top:calc((1.45em - 7px) / 2);border-radius:50%;background:var(--c)}
.dv-tx{display:grid;gap:3px;min-width:0}
.dv-tx b{font-weight:500;line-height:1.45}
.dv-tx small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-tx .num{letter-spacing:.02em}
.pc{--pc-lane:9px;padding-top:4px}   /* 每一層事件線 9px（不寫字，只看幾條線） */
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.pc-mon{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(68px,13vw,120px);line-height:.82;letter-spacing:-.02em}
/* 月份數字（2026-11-06 使用者：只有英文縮寫不直觀）：放在縮寫前面，同樣大小、Jost 細體，跟粗體縮寫一細一粗 */
.pc-mn{font-weight:200;margin-right:.14em;letter-spacing:-.04em}
.pc-yr{font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:.95;text-align:right}
.pc-wk,.pc-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.pc-wk{padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--ink);font-family:"Jost",sans-serif;font-weight:500;font-size:12px;letter-spacing:.08em;text-align:center;color:var(--muted)}
.pc-week{position:relative;align-content:start;min-height:calc(46px + var(--lanes) * var(--pc-lane));padding-bottom:6px}
.pc-d{position:relative;isolation:isolate;justify-self:center;display:grid;place-items:center;width:38px;height:38px;min-height:0;margin-top:4px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink)}
.pc-d::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:var(--ink);opacity:0;transform:scale(.7);transition:opacity var(--mo-base) var(--mo-out),transform var(--mo-base) var(--mo-spring)}
.pc-d:hover{transform:none;box-shadow:none}
@media (hover:hover){.pc-d:hover::before{opacity:.07;transform:none}}
.pc-pad{visibility:hidden}
.pc-n{font-size:19px;line-height:1}

.pc-d.sel::before{opacity:1;transform:none}
.pc-d.sel .pc-n{color:var(--bg)}
.pc-d.flash::before{animation:pcFlash .7s ease-in-out 2}
@keyframes pcFlash{50%{opacity:.22;transform:none}}
/* 事件（不寫字）：時段＝細線（兩端小圓點）橫跨開始到結束那幾天的中心；單天＝那天下面一顆小點。--ln＝第幾層（每層 9px），看幾條線就知道幾件事；點日期才在上方「這一天」區塊看文字 */
.pc-e{position:absolute;top:calc(46px + var(--ln) * var(--pc-lane));left:calc(var(--i0) / 7 * 100%);width:calc((var(--i1) - var(--i0) + 1) / 7 * 100%);height:5px;color:var(--c);pointer-events:none}
.pc-e.span::before{content:"";position:absolute;top:0;height:5px;left:calc(50% / (var(--i1) - var(--i0) + 1) - 2.5px);right:calc(50% / (var(--i1) - var(--i0) + 1) - 2.5px);background:radial-gradient(circle 2.5px at 2.5px 50%,currentColor 96%,transparent),radial-gradient(circle 2.5px at calc(100% - 2.5px) 50%,currentColor 96%,transparent),linear-gradient(currentColor,currentColor) center/100% 1px no-repeat}
.pc-e:not(.span)::after{content:"";position:absolute;top:0;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}

}

/* ===== 液態分段切換（anim.js 的 LiquidSeg；目前用在通知層的本部門／全會） =====
   跟底部工具列同一個樣子：毛玻璃 .glass 膠囊、實心鏡片（文字色）、鏡片底下那一格（.lit）文字反白；
   按下白光（--hp／--hx）、整列放大與偏移、鏡片形變都由 JS 寫 inline（這裡不對 transform／scale 設 transition，避免跟彈簧打架） */
.lseg{display:inline-flex;padding:4px;border-radius:999px;transform-origin:0 50%;   /* 按下時往右放大，貼著內容左邊也不會被切到 */
  touch-action:none;-webkit-user-select:none;user-select:none}
.lseg::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle 70px at var(--hx,50%) 50%,rgba(255,255,255,calc(.15 * var(--hp,0))) 50%,rgba(255,255,255,0)),linear-gradient(rgba(255,255,255,calc(.08 * var(--hp,0))),rgba(255,255,255,calc(.08 * var(--hp,0))))}
.lseg-lens{position:absolute;left:0;top:4px;bottom:4px;z-index:0;border-radius:999px;background:var(--ink);pointer-events:none;will-change:transform}
.lseg>[data-k]{position:relative;z-index:1;min-height:32px;padding:4px 18px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13.5px;letter-spacing:.06em;scale:var(--ts,1);transition:color .35s;-webkit-tap-highlight-color:transparent}
.lseg>[data-k][aria-selected="true"]{font-weight:500}
.lseg>[data-k].lit{color:var(--surface)}
.lseg>[data-k]:hover,.lseg>[data-k]:active{transform:none;box-shadow:none}
.lseg>[data-k]:focus-visible{outline:none;text-decoration:underline;text-underline-offset:4px}

/* 紙張：不管深淺色模式都是白紙黑字，列印也一樣。2026-11-06 改版：封面、目錄、每一章各一張紙（A4 比例），
   版面參考使用者給的極簡白紙範例：大標題靠左、上下小字、細線分隔、細體大數字（Jost 200）當章節號、右上角章節索引 */
.rpt-paper{--ink:#111114;--muted:#5d5d66;--line:#111114;--hair:#dcdce2;--rest:#c9c9d0;--prog-lo:var(--accent-light);--prog-lo-ink:var(--accent-light);--today:var(--ink);--pad:6.667%;width:min(100%,210mm);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;color:var(--ink);font-size:14px;line-height:1.75}
.rpt-page{position:relative;aspect-ratio:210/297;padding:var(--pad) var(--pad) calc(var(--pad) + 8px);border-radius:4px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.rpt-paper .num{font-family:"Jost",sans-serif}
/* 紙張就是 A4 寬（210mm），左右留白 6.667%＝14mm、內文 182mm，跟列印的 @page 一樣，桌面預覽的換行就是 PDF 的換行（2026-11-06） */
/* --- 一張一張的紙（report.js 的 rptPaginate）：桌面上每一章依實際斷頁排成幾張 A4，紙與紙之間一條底色空隙（.rpt-gap），
   斷點那一塊前面一個看不見的墊塊（.rpt-sp）把它推到下一張紙的開頭；每張紙右外側標「第 N 頁」（.rpt-pg，2026-11-06 使用者：標籤放側邊，不要壓到章節按鈕）。
   手機紙張窄：頁碼放在紙裡右上角，斷點畫紅色虛線＋紅色小膠囊（.rpt-pb）。這些列印與量測時都不出現 --- */
.rpt-sp{display:block;pointer-events:none}
.rpt-gap{position:absolute;left:-2px;right:-2px;height:28px;background:color-mix(in srgb,var(--ink) 12%,var(--bg));box-shadow:inset 0 9px 12px -10px rgba(0,0,0,.45),inset 0 -9px 12px -10px rgba(0,0,0,.45);pointer-events:none;z-index:2}
.rpt-pg{position:absolute;left:calc(100% + 14px);padding:2px 10px;border-radius:999px;border:1px solid var(--hair);background:var(--bg);color:var(--muted);font-size:11px;letter-spacing:.06em;white-space:nowrap;pointer-events:none;animation:fadeIn .3s both}
.rpt-pb{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--accent-light);pointer-events:none;z-index:1;animation:fadeIn .3s both}
.rpt-pb>span{position:absolute;right:10px;top:4px;padding:1px 8px;border-radius:999px;background:var(--accent-light);color:#fff;font-size:11px;letter-spacing:.06em;white-space:nowrap}
@media (max-width:999px){.rpt-pg{left:auto;right:10px;margin-top:8px;background:#fff;border-color:#dcdce2;color:#5d5d66}}   /* 紙張外面放不下：放在紙裡右上角 */
.rpt-pages{margin-left:10px;font-size:12px;color:var(--muted);letter-spacing:.06em}
/* 量測用（同一個 JS 工作裡加上又拿掉，畫面不會出現）：版面照列印 */
.rpt-paper.rpt-measure{display:block;width:182mm;font-size:14px}
.rpt-measure .rpt-page{aspect-ratio:auto;padding:0;box-shadow:none}   /* 每章的最小高度（排成幾張紙時程式設的）量之前就先清掉了 */
.rpt-measure :is(.rpt-ct,.rpt-bt,.rpt-ins,.rpt-img-h,.rpt-card-x,.rpt-card-add,.rpt-blk.is-blank,.rpt-ch.is-blank,[data-ph]:empty,.rpt-pb,.rpt-pg,.rpt-gap,.rpt-sp){display:none}
.rpt-measure .rpt-blocks{display:block}
.rpt-measure .rpt-blocks>.rpt-blk+.rpt-blk{margin-top:18px}
.rpt-measure .rpt-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.rpt-measure .rpt-cards[data-cols="3"]{--cols:3}
.rpt-measure .rpt-ch-h{grid-template-columns:auto minmax(0,1fr) auto}
.rpt-measure .rpt-tabs{grid-column:auto;grid-row:auto;justify-self:auto}
.rpt-paper [contenteditable="true"]{outline:none;border-radius:4px;transition:background-color .2s,box-shadow .2s}
.rpt-paper [contenteditable="true"]:hover{background:rgba(0,0,0,.035)}
.rpt-paper [contenteditable="true"]:focus{background:rgba(0,0,0,.05);box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.rpt-paper [data-ph]:empty::before{content:attr(data-ph);color:#9a9aa3}
/* --- 封面：上（logo＋部門｜日期）、中（英文小字＋大標題＋期間）、下（製作人｜看板網址）三段撐滿一頁 --- */
.rpt-cover{display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.cv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cv-org{display:flex;align-items:center;gap:14px}
.cv-org b{font-size:15px;font-weight:700;letter-spacing:.14em}
.cv-logo .su-logo-c{display:block;height:34px;width:auto}   /* 封面一律原檔彩色 logo（shell.js 的 suLogoColor，不跟深淺色） */
.cv-date{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.cv-mid{margin-top:12%}
.cv-k{margin:0 0 10px;font-size:12px;letter-spacing:.32em;color:var(--muted)}
.cv-mid h1{margin:0;font-size:clamp(40px,8.6vw,72px);font-weight:700;line-height:1.1;letter-spacing:.06em}
.cv-sub{margin:14px 0 0;font-size:clamp(14px,2.2vw,17px);font-weight:500;letter-spacing:.06em}
.cv-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;font-size:11.5px;line-height:1.7;color:var(--muted)}
.cv-col{display:grid;align-content:start}
.cv-col>span:empty:not(:focus){min-height:1.7em}
.rpt-live{color:#111114;text-decoration:none;word-break:break-all}   /* 回到線上看板的連結（PDF 裡仍可點；網址照印，紙本也能照打） */
/* --- 目錄：英文小字＋「目錄」，下面每章一列：細體大數字、章名、羅馬數字，列與列之間細線（參考樓層導覽卡） --- */
.toc-h{display:grid;gap:4px;margin-bottom:28px}
.toc-h span{font-size:12px;letter-spacing:.32em;color:var(--muted)}
.toc-h h2{margin:0;font-size:28px;font-weight:700;letter-spacing:.14em}
.toc-list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.toc-list li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--hair)}
.toc-n{font-size:clamp(40px,7vw,64px);font-weight:200;line-height:.9;letter-spacing:-.02em;min-width:1.25em}
.toc-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.toc-t b{font-size:17px;font-weight:700;letter-spacing:.08em}
.toc-t small{font-size:12px;letter-spacing:.1em;color:var(--muted)}
/* --- 章首：細體大數字＋章名，右上角章節索引（I II III…，這一章實心）；編輯工具（上移、下移、移除這章）滑過去才出現，不印 --- */
.rpt-sec{position:relative}
.rpt-ch-h{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:6px 18px;margin-bottom:22px;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.rpt-ch-n{font-size:clamp(48px,9vw,80px);font-weight:200;line-height:.82;letter-spacing:-.03em}
.rpt-paper h2::after{content:none}   /* 報告裡的標題不接全站標題列的細線箭頭 */
.rpt-ch-h h2{min-width:0;margin:0;font-size:22px;font-weight:700;letter-spacing:.1em;line-height:1.3}
.rpt-tabs{display:flex;gap:3px;align-self:start}
.rpt-tabs i{display:grid;place-items:center;min-width:24px;height:20px;padding:0 4px;font:400 10px/1 "Jost",sans-serif;font-style:normal;letter-spacing:.04em;background:#ececf0;color:#9a9aa3}
.rpt-tabs i.on{background:#2b2b30;color:#fff}
.rpt-ct,.rpt-bt{display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .2s}
.rpt-ct{position:absolute;right:0;bottom:calc(100% + 6px)}
.rpt-ch:hover .rpt-ct,.rpt-ch-h:focus-within .rpt-ct,.rpt-blk:hover>.rpt-bt,.rpt-blk:focus-within>.rpt-bt,.rpt-blk:focus>.rpt-bt{opacity:1;pointer-events:auto}
.rpt-ct button,.rpt-bt button{min-height:0;height:26px;padding:0 9px;border:1px solid var(--hair);border-radius:999px;background:#fff;color:var(--muted);font-size:11.5px;transition:color .18s,border-color .18s,background-color .18s}
.rpt-ct button:hover,.rpt-bt button:hover{color:var(--ink);border-color:var(--ink)}
.rpt-ct .ico,.rpt-bt .ico{width:12px;height:12px}
.rpt-bt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rpt-bt-sep{width:1px;margin:3px 2px;background:var(--hair)}
/* --- 圖塊：一章裡一個個排下來；工具列浮在圖塊右上（滑過去、點進去才出現） --- */
.rpt-blocks{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.rpt-blk{position:relative;border-radius:6px;outline:none}
.rpt-blk:focus-within,.rpt-blk:focus{box-shadow:0 0 0 6px #fff,0 0 0 7px var(--hair)}
.rpt-bt{position:absolute;right:0;bottom:calc(100% + 4px);z-index:2;flex-wrap:wrap;justify-content:flex-end;padding:3px;border-radius:999px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.rpt-ins{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--hair);font-size:12px;color:var(--muted)}
.rpt-ins button{min-height:0;height:30px;padding:0 13px;border:1px solid var(--hair);border-radius:999px;background:#fff;color:var(--ink);font-size:12.5px}
.rpt-ins button:hover{border-color:var(--ink)}
/* 圖片：寬度＝內文寬的 --w（25～100％），靠左／置中／靠右；高度最多 150mm（一頁放得下），不變形；右下角拖曳調大小 */
.rpt-img{margin:0;width:var(--w,66%);max-width:100%;min-width:25%;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.rpt-img[data-al="c"]{margin-inline:auto}
.rpt-img[data-al="r"]{margin-left:auto}
.rpt-img-box{position:relative}
.rpt-img img{display:block;width:100%;height:auto;max-height:150mm;object-fit:contain;object-position:left top;border-radius:2px}
.rpt-img[data-al="c"] img{object-position:center top}.rpt-img[data-al="r"] img{object-position:right top}
.rpt-img figcaption{font-size:12px;color:var(--muted);letter-spacing:.04em}
.rpt-img-h{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px #fff;cursor:nwse-resize;touch-action:none;opacity:0;transition:opacity .2s,transform .2s}
.rpt-blk:hover .rpt-img-h,.rpt-blk:focus-within .rpt-img-h,.rpt-blk:focus .rpt-img-h,.rpt-img.sizing .rpt-img-h{opacity:1}
.rpt-img.sizing .rpt-img-h{transform:scale(1.25)}
.rpt-img.sizing{transition:none}
.rpt-img:not(.sizing){transition:width .28s var(--mo-out)}
/* 卡片圖塊（分項說明）：兩欄或三欄，淡灰底、上面一條粗線，項目名稱粗體、說明內文 */
.rpt-cards{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
.rpt-cards[data-cols="3"]{--cols:3}
.rpt-card{position:relative;display:grid;align-content:start;gap:6px;padding:14px 16px 16px;border-top:2px solid var(--ink);background:#f4f4f6}
.rpt-card b{display:block;font-size:15px;font-weight:700;letter-spacing:.04em;line-height:1.45}
.rpt-card-t{font-size:13px;line-height:1.7;white-space:pre-wrap}
.rpt-card-x{position:absolute;top:6px;right:6px;min-height:0;width:22px;height:22px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted);opacity:0;transition:opacity .2s}
.rpt-card-x .ico{width:11px;height:11px}
.rpt-blk:hover .rpt-card-x,.rpt-blk:focus-within .rpt-card-x{opacity:1}
.rpt-card-add{margin-top:10px;min-height:0;height:28px;padding:0 12px;border:1px dashed var(--hair);border-radius:999px;background:transparent;color:var(--muted);font-size:12px}
.rpt-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rpt-stats>div{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--hair);border-radius:12px}
.rpt-stats b{font-family:"Jost",sans-serif;font-size:28px;font-weight:400;line-height:1.1}
.rpt-stats span{font-size:13px;font-weight:600}
.rpt-stats small{color:var(--muted);font-size:11.5px}
/* 期間甘特圖（report.js 的 rptGantt）：跟看板甘特圖同一種細刻度（.tk） */
.rpt-gantt{margin:0;display:grid;gap:4px}
.rg-row{display:grid;grid-template-columns:minmax(0,150px) 40px minmax(0,1fr);align-items:center;gap:12px}
.rg-t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-p{font-size:11.5px;color:var(--muted);text-align:right}
.rg-bar{height:20px}
.rg-axis{position:relative;height:22px}
.rg-axis span{position:absolute;top:3px;font-size:11px;color:var(--muted);transform:translateX(3px);white-space:nowrap}
.rg-axis .rg-now{top:1px;transform:translateX(-50%);padding:1px 7px;border-radius:999px;background:var(--ok);color:#06210f;font-size:10.5px;line-height:14px}
.rpt-issue{padding:12px 0 14px;border-bottom:1px dashed var(--hair)}
.rpt-issue:last-child{border-bottom:0}
.rpt-issue h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin:0;font-size:16px;font-weight:600}
.rpt-st{color:var(--acc-ink);font-size:12.5px;font-weight:500}
.rpt-meta2{margin:2px 0 6px;color:var(--muted);font-size:12.5px}
.rpt-prog{position:relative;width:min(100%,360px);height:12px;margin:4px 0 8px}
.rpt-prog::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);background:var(--rest)}
.rpt-prog i{position:absolute;left:0;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;background:var(--acc)}
.rpt-issue h4{margin:8px 0 2px;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.06em}
.rpt-issue p{margin:0}
.rpt-tl{margin:0;padding-left:1.2em}
.rpt-tl li{margin:1px 0}
.rpt-d{display:inline-block;min-width:4.6em;color:var(--muted);font-family:"Jost",sans-serif}
.rpt-none{margin:0;color:var(--muted)}
.rpt-text{--rw1:45px;--rw2:24px;min-height:5.25em;white-space:pre-wrap;counter-reset:rh1}   /* --rw1 大段編號「（一）」的寬、--rw2 小段編號「1. 」的寬 */
.rpt-text:empty::before{content:attr(data-ph);color:#9a9aa3}
/* 自訂區塊裡的段落層級：大段（（一）（二））、小段（1. 2.，每個大段重新算）、內文；編號自動排 */
.rpt-text>p{margin:0 0 .35em}
.rpt-text>.rpt-h1{margin:.9em 0 .3em;padding-left:var(--rw1);font-size:15px;font-weight:600;letter-spacing:.04em;counter-increment:rh1;counter-reset:rh2}
.rpt-text>.rpt-h1::before{content:"（" counter(rh1,trad-chinese-informal) "）";display:inline-block;min-width:var(--rw1);margin-left:calc(-1 * var(--rw1));letter-spacing:0}
.rpt-text>.rpt-h2{margin:.6em 0 .2em;font-size:14px;font-weight:600;counter-increment:rh2}
.rpt-text>.rpt-h2::before{content:counter(rh2) ". ";display:inline-block;min-width:var(--rw2);margin-left:calc(-1 * var(--rw2))}
/* 縮排：對齊所屬標題的文字起點（report.js 的 indent 標 data-in；標題的編號用負邊距凸出在左邊，換行也對齊文字） */
.rpt-text>[data-in="a"]{padding-left:var(--rw1)}
.rpt-text>[data-in="b"]{padding-left:var(--rw2)}
.rpt-text>[data-in="ab"]{padding-left:calc(var(--rw1) + var(--rw2))}
.rpt-text>.rpt-h1:first-child,.rpt-text>.rpt-h2:first-child{margin-top:0}
/* 段落小工具：桌面放在紙張左邊界、對齊游標那一段；手機放在區塊下方。不印出來 */
.rpt-pt{position:absolute;left:max(4px,calc(var(--pad) - 46px));top:var(--y,0);z-index:1;display:grid;gap:4px;animation:rptPtIn .2s cubic-bezier(.2,.9,.25,1)}
.rpt-pt[hidden]{display:none}
.rpt-pt button{min-height:0;width:38px;padding:3px 0;border:1px solid var(--hair);border-radius:8px;background:#fff;color:var(--muted);font-size:11px;letter-spacing:.04em;line-height:1.4;transition:background-color .18s,color .18s,border-color .18s}
.rpt-pt button:hover{border-color:var(--ink);color:var(--ink)}
.rpt-pt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
@keyframes rptPtIn{from{opacity:0;transform:translateX(4px)}}
@media (max-width:640px){
  .rpt-pt{position:static;display:flex;justify-content:flex-start;margin-top:8px}
  .rpt-pt button{width:auto;padding:3px 12px}
}
@media (prefers-reduced-motion:reduce){.rpt-pt{animation:none}}
@media (max-width:640px){
  .rpt-paper{font-size:13.5px;gap:18px}
  .rpt-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rpt-hint{display:none}
  .rpt-cards[data-cols="3"]{--cols:2}
  .rpt-ch-h{grid-template-columns:auto minmax(0,1fr)}
  .rpt-tabs{grid-column:1/-1;grid-row:1;justify-self:end}
  .rpt-ct,.rpt-bt{opacity:1;pointer-events:auto}   /* 觸控沒有滑過去：工具一直顯示（只在點進去的圖塊） */
  .rpt-blk:not(:focus-within):not(:focus)>.rpt-bt{display:none}
  .rpt-bt{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;justify-content:center;padding:6px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:ndRise .28s var(--mo-out)}   /* 手機：點進去的圖塊，工具列固定在畫面底部（不插進版面、不蓋住上一段） */
  .rpt-ct{position:static;grid-column:1/-1;justify-content:flex-end}
}
/* 列印：只印報告，A4、頁尾頁碼；空白的自訂區塊不印 */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm;@bottom-center{content:"第 " counter(page) " 頁／共 " counter(pages) " 頁";color:#666;font-size:9pt}}
  :root:has(#rptOv){color-scheme:light}
  html,body{height:auto;overflow:visible;background:#fff}
  body.rpt-open>:not(#rptOv){display:none}
  body.rpt-open #rptOv{position:static;display:block;padding:0;background:#fff}
  @page:first{@bottom-center{content:none}}   /* 封面不印頁碼 */
  .rpt-bar,.rpt-pt,.rpt-ct,.rpt-bt,.rpt-ins,.rpt-pb,.rpt-pg,.rpt-gap,.rpt-sp,.rpt-img-h,.rpt-card-x,.rpt-card-add,.rpt-blk.is-blank,.rpt-ch.is-blank,.rpt-paper [data-ph]:empty{display:none}
  .rpt-scroll{overflow:visible;padding:0}
  .rpt-paper{display:block;width:auto;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rpt-page{aspect-ratio:auto;padding:0;border-radius:0;box-shadow:none;break-before:page}
  .rpt-page:first-child{break-before:auto}
  .rpt-cover{height:266mm}   /* A4 高 297mm 扣掉上下邊界：封面三段撐滿一頁 */
  .rpt-blocks{display:block}.rpt-blocks>.rpt-blk+.rpt-blk{margin-top:18px}
  .rpt-paper [contenteditable="true"],.rpt-paper [contenteditable="true"]:is(:hover,:focus),.rpt-blk:is(:focus,:focus-within){background:none;box-shadow:none}
  .rpt-stats,.rpt-gantt,.rpt-issue,.rpt-img,.rpt-card,.rpt-cards,.toc-list li,.rpt-paper :is(p,li,h3,h4){break-inside:avoid}   /* 每一段文字也不切開：預覽的分頁（rptPaginate）就是照這個排的 */
  .rpt-ch-h{break-after:avoid}
}

/* ===== 展開與收合的內容動畫（議題卡片、週報、編輯紀錄；即時回報與完成紀錄的在「即時回報」段） ===== */
.card.open>*:nth-child(3){animation-delay:.03s}
.card.open>*:nth-child(4){animation-delay:.06s}
.card.open>*:nth-child(5){animation-delay:.09s}
.card.open>*:nth-child(6){animation-delay:.12s}
.card.open>*:not(.card-top){animation:none}
.card.opening>*:not(.card-top){animation:dropIn .6s var(--ease) both}
.card.opening>*:nth-child(2){animation-delay:0.07s}
.card.opening>*:nth-child(3){animation-delay:0.14s}
.card.opening>*:nth-child(4){animation-delay:0.21s}
.card.opening>*:nth-child(5){animation-delay:0.28s}
.card.opening>*:nth-child(6){animation-delay:0.35s}
.card.opening>*:nth-child(7){animation-delay:0.42s}
.card.opening>*:nth-child(8){animation-delay:0.49s}
.card.opening>*:nth-child(9){animation-delay:0.56s}
.card.opening>*:nth-child(10){animation-delay:0.63s}
.card.opening>*:nth-child(11){animation-delay:0.70s}
.week.opening>.week-tools{animation:dropIn .55s var(--ease) both;animation-delay:.06s}
.week.opening>.week-text{animation:dropIn .55s var(--ease) both;animation-delay:.14s}
.log.opening ol>li{animation:dropIn .55s var(--ease) both}
.log.opening ol>li:nth-child(2){animation-delay:0.09s}
.log.opening ol>li:nth-child(3){animation-delay:0.14s}
.log.opening ol>li:nth-child(4){animation-delay:0.19s}
.log.opening ol>li:nth-child(5){animation-delay:0.24s}
.log.opening ol>li:nth-child(6){animation-delay:0.29s}
.log.opening ol>li:nth-child(7){animation-delay:0.34s}

     返回：目前這頁整頁往下滑 80px 並淡掉（0.3 秒，越來越快）；上一頁的區塊在原位淡入、從上方 24px 略微往下歸位（0.56 秒，錯開 0.11 秒）。
     元素本身（整頁或疊層）：前進離開＝整頁淡掉；返回離開＝整頁往下滑並淡掉；進來＝一開始淡入（fadeIn＝0：本來就看得到，不動） */
  /* 2026-11-06 使用者：整頁動畫慢一點，效果比較明顯——時間全部拉長約 1.5 倍（位移距離、曲線不變） */
  const OUT=220,BOUT=300,IN=680,BIN=560,SPREAD_IN=200,SPREAD_BIN=110,OVER=.7,BACK_OVER=.55,FADE_IN=.12,COVER_IN=.06;
  const EASE_OUT="cubic-bezier(.4,0,1,1)",EASE_IN="cubic-bezier(.1,.9,.2,1)",MAXP=14;
  let tok=0;const owner=new WeakMap();const live=new Set();   /* live：目前還在換頁動畫裡的元素；owner：每個元素目前歸哪一次換頁管：被新的換頁接手，舊的那段就停下 */
  const keep=new WeakMap(),anims=new WeakMap();
  function save(el){if(!keep.has(el))keep.set(el,{o:el.style.opacity,p:el.style.pointerEvents})}
  function reset(el){(anims.get(el)||[]).forEach(a=>a.cancel());anims.delete(el);const k=keep.get(el);if(!k)return;keep.delete(el);el.style.opacity=k.o;el.style.pointerEvents=k.p}
  /* 先藏起來（新頁還沒輪到它浮上來時）：只動透明度 */
  function hold(el){save(el);el.style.opacity="0"}
  /* 找出要翻的區塊：從元素往下找，比畫面高四成多的容器繼續往裡面拆，其他的（卡片、膠囊、標題列、工具列…）當成一塊；只算畫面上看得到的，最多 MAXP 塊 */
  function pieces(el){
    const H=innerHeight,W=innerWidth,out=[];
    const walk=(n,depth)=>{for(const c of n.children){
      if(out.length>=MAXP)return;
      if(c.matches("script,style,template,link,[hidden]"))continue;
      const cs=getComputedStyle(c);if(cs.display==="none"||cs.visibility==="hidden")continue;
      if(cs.display==="contents"){walk(c,depth);continue}
      const r=c.getBoundingClientRect();if(!(r.bottom>0&&r.top<H&&r.right>0&&r.left<W&&r.width>1&&r.height>1))continue;
      if(r.height>H*.42&&c.children.length&&depth<7)walk(c,depth+1);else out.push({el:c,r,base:cs.transform&&cs.transform!=="none"?cs.transform:""});
    }};
    walk(el,0);return out;
  }
  /* 一段動畫：dir＝"out"（離開）或 "in"（進來）；back＝返回；fadeIn＝新頁在前幾成變成不透明；lag＝整段晚多久開始（期間區塊停在起始狀態） */
  function run(el,dir,my,fadeIn=FADE_IN,back=false,lag=0){
    if(!el)return Promise.resolve();
    save(el);el.style.pointerEvents="none";(anims.get(el)||[]).forEach(a=>a.cancel());
    const o=dir==="out",H=innerHeight||1,list=[];
    if(o){
      /* 離開：整個元素一起動（前進＝淡掉；返回＝往下滑並淡掉），不用拆塊 */
      const base=getComputedStyle(el).transform,B=base&&base!=="none"?" "+base:"";
      list.push(el.animate(back?[{transform:"translateY(0)"+B,opacity:1},{transform:"translateY(80px)"+B,opacity:0}]:[{opacity:1},{opacity:0}],
        {duration:(back?BOUT:OUT)+lag,easing:EASE_OUT,fill:"both",delay:0}));
    }else{
      const ps=pieces(el),dur=back?BIN:IN,spread=back?SPREAD_BIN:SPREAD_IN,dy=back?-24:Math.min(120,Math.round(H*.14)),total=dur+spread+lag;
      ps.forEach(({el:p,r,base})=>{
        const delay=lag+Math.round(Math.max(0,Math.min(1,r.top/H))*spread),B=base?" "+base:"";   /* 區塊原本的變形（例如工具列置中的 translateX）接在後面保留 */
        list.push(p.animate([{transform:`translateY(${dy}px)${B}`,opacity:0},{opacity:1,offset:.4},{transform:`translateY(0)${B}`,opacity:1}],{duration:dur,delay,easing:EASE_IN,fill:"both"}));
      });
      if(fadeIn>0)list.push(el.animate([{opacity:0},{opacity:1,offset:Math.max(.02,fadeIn*dur/total)},{opacity:1}],{duration:total,easing:"linear",fill:"both"}));
    }
    anims.set(el,list);
    return Promise.all(list.map(a=>a.finished.catch(()=>{}))).then(()=>{});
  }
  /* 疊層的高低（z-index；一般頁面＝0）：用來判斷是「疊層蓋上來」還是「疊層退開」 */
  const zOf=el=>{const z=parseInt(getComputedStyle(el).zIndex,10);return isNaN(z)?0:z};
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  /* 換頁：from 往後退；退到 OVER 時呼叫 mid()（把新頁顯示出來、換捲動位置等），to 從後面浮上來；全部播完呼叫 done()（藏起舊頁等），再把兩頁的樣式還原。
     from 和 to 是同一個元素（例如每週概述：整個看板退後、換到每週概述、再浮上來）就等它退完才換、再浮上來 */
  async function swap(from,to,{mid,done}={}){
    const my=++tok;let m=false;const M=()=>{if(!m){m=true;mid&&mid()}};
    if(RM()||!from||!to){M();done&&done();return}
    /* 上一次換頁還沒播完、這次又不用的層（例如快速開關設定）：直接藏起來，畫面上只留這次的前後兩層 */
    const stale=[...live].filter(el=>el!==from&&el!==to);stale.forEach(el=>{owner.set(el,my);reset(el);hold(el)});   /* 先停掉它還在跑的翻頁動畫，再藏起來 */
    owner.set(from,my);owner.set(to,my);live.add(from);live.add(to);
    const zf=from===to?0:zOf(from),zt=from===to?0:zOf(to);
    if(from===to){await run(from,"out",my);M();reset(from);save(from);from.style.opacity="0";await run(to,"in",my)}
    else if(zt>zf){
      /* 疊層蓋上來（打開設定、通知、編輯紀錄、工作報告、設定子頁）：底下那頁不動，疊層從後面浮上來、一開始就變不透明蓋住它（2026-11-05 使用者：不要閃現主頁） */
      owner.delete(from);live.delete(from);hold(to);M();await run(to,"in",my,COVER_IN);
    }else if(zf>zt){
      /* 疊層退開（關閉，返回）：疊層的區塊朝你翻走、疊層淡掉；播到 BACK_OVER 時底下那頁的區塊從被翻開的位置轉回來（底下那頁本身一直是不透明的） */
      reset(to);M();await Promise.all([run(from,"out",my,FADE_IN,true),run(to,"in",my,0,true,Math.round(BOUT*BACK_OVER))]);
    }else{hold(to);const pOut=run(from,"out",my);await wait(OUT*OVER);M();await Promise.all([pOut,run(to,"in",my)])}
    /* 中途被打斷也一樣把該做的做完（顯示新頁、藏起舊頁），只是還在別次換頁手上的元素不還原樣式 */
    M();done&&done();
    for(const el of new Set([from,to,...stale]))if(owner.get(el)===my){owner.delete(el);live.delete(el);reset(el)}
  }
  /* 立刻停掉這些元素的換頁動畫並還原樣式（例如關閉動畫還沒播完又打開） */
  function settle(...els){els.forEach(el=>{if(!el)return;owner.delete(el);live.delete(el);reset(el)})}

  /* ---------- 跨頁（總覽 ↔ 看板） ----------
     離開：攔下站內的連結（同網站的 .html 或資料夾），整頁往後退完再換頁。
     到達：從站內換頁過來的（head 裡的小程式先加上 html.pfx-arrive，CSS 讓 body 先透明，不會閃一下），整頁從後面浮上來；
     從上一頁快取回來（bfcache）也一樣。重新整理、從外面進來不放（看板有開場動畫）。
     瀏覽器的返回鍵沒辦法在離開前先播動畫，只有新頁浮上來那一半。 */
  function leave(href){
    if(RM()){location.href=href;return}
    const my=++tok;owner.set(document.body,my);run(document.body,"out",my).then(()=>{if(owner.get(document.body)===my)location.href=href});
  }
  /* 到達：等整頁載入完、再等兩格（看板第一次畫完、字型就位）才開始浮上來，動畫期間主執行緒比較閒，不會一頓一頓；
     區塊由下往上滑入（2026-11-06 第四版） */
  function arrive(){
    const h=document.documentElement;if(!h.classList.contains("pfx-arrive"))return;
    if(RM()){h.classList.remove("pfx-arrive");return}
    /* 2026-11-06 使用者：進部門後整個介面卡一下。看板剛載入時要畫第一次畫面、讀雲端、套秘書處的學年（又重畫一次），
       翻進來的動畫跟這些搶主執行緒就會頓。所以等「畫面穩定」：連續 5 格都在 22ms 內畫完才開始，最多等 1.6 秒；
       等的這段時間整頁還是透明（底色），看不到半成品 */
    const calm=f=>{let n=0,last=performance.now();const t0=last,tick=now=>{n=now-last<22?n+1:0;last=now;if(n>=5||now-t0>1600)f();else requestAnimationFrame(tick)};requestAnimationFrame(tick)};
    const start=()=>calm(()=>{
      const my=++tok;owner.set(document.body,my);hold(document.body);h.classList.remove("pfx-arrive");
      run(document.body,"in",my).then(()=>{if(owner.get(document.body)===my){owner.delete(document.body);reset(document.body)}});
    });
    let go=false;const once=()=>{if(!go){go=true;start()}};
    if(document.readyState==="complete")once();else{addEventListener("load",once,{once:true});setTimeout(once,900)}   /* 最多等 0.9 秒（字型、圖片很慢時不要一直空白） */
  }
  const inSite=a=>{try{const u=new URL(a.href,location.href);return u.origin===location.origin&&(/\.html?$/.test(u.pathname)||u.pathname.endsWith("/"))&&!a.target&&!a.hasAttribute("download")}catch(_){return false}};
  document.addEventListener("click",e=>{
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    const a=e.target.closest&&e.target.closest("a[href]");if(!a||!inSite(a))return;
    const u=new URL(a.href,location.href);if(u.pathname===location.pathname&&u.search===location.search)return;
    e.preventDefault();leave(u.href);
  });
  addEventListener("pageshow",e=>{if(e.persisted){reset(document.body);document.documentElement.classList.add("pfx-arrive");arrive()}});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",arrive);else arrive();
  return {swap,settle,leave,hold,reset};
})();

</script>

   ext:"名稱"＝多一個分頁放這個部門專用的功能（2026-11-06：會長室「會長室」＝文件、會議開關、追蹤、編輯量；秘書處「會議」＝逐部門編輯報告事項、會議紀錄、各部門週報）；
