function evFieldHTML(ev,k,label,view,editor){return fldRowHTML({open:evFldOpen(ev,k),k,label,view,editor,del:/^[tl]:(?!\+)/.test(k),key:"evfk",pen:"evpen",fx:"evfx"})}
/* 時間的文字：「日期 時刻 名稱 期間 · 地點」（顯示與編輯中共用） */
function evTimeView(t,par){const x=evTimeText(t);
  return `<span class="num ev-t-when">${esc(x.when)}</span><span class="ev-t-label">${esc(t.label)}</span>${x.span?`<span class="sub num">${esc(x.span)}</span>`:""}${t.place?`<span class="ev-t-place">· ${esc(t.place)}</span>`:""}${t.toIssue&&par?`<span class="sub">（母議題）</span>`:""}`}
/* 時間標記的輸入框（名稱、日期、時刻、結束、地點、寫進母議題） */
function evTimeEditor(ev,tm){
  const par=parentOf(ev),sp=x=>[(x||"").slice(0,10),(x||"").slice(11,16)],[sd,st]=tm?sp(tm.start):[today(),""],[ed,et]=tm?sp(tm.end):["",""];
  const inp=(k,v,ph,type)=>`<input ${type?`type="${type}"`:""} data-e="${k}" value="${esc(v||"")}" ${ph?`placeholder="${esc(ph)}"`:""}>`;
  return `${inp("label",tm&&tm.label,"名稱")}
          <span class="evf-when">${inp("sd",sd,"","date")}${inp("st",st,"時刻")}<span class="sub">～</span>${inp("ed",ed,"","date")}${inp("et",et,"時刻")}</span>
          <span class="sub evf-hint">只填日期＝一個日子；加時刻＝具體時間；填結束＝一段期間</span>
          <span class="evf-place">${inp("place",tm&&tm.place,"地點")}${placeQuickHTML()}</span>
          ${par?`<label class="fld-check"><input type="checkbox" data-e="toIssue" ${tm&&tm.toIssue?"checked":""}><span>也寫進母議題的處理紀錄</span></label>`:""}`;
}
/* 連結的輸入框（顏色、名稱、網址；即時回報、議題共用）：n＝目前幾個連結（新增時輪流選顏色），fx＝按鈕的 data 屬性名 */
function linkEditorHTML(l,n,fx){
  const c=cssColor(l?l.color:COLORS[n%COLORS.length]);
  return `<span class="evf-row"><button type="button" class="evf-sw" style="background:${c}" data-${fx}="color" data-c="${c}" aria-label="換顏色"></button><input data-e="name" value="${esc(l?l.name:"")}" placeholder="按鈕名稱"><input data-e="url" value="${esc(l?l.url:"")}" placeholder="https://" inputmode="url"></span>`;
}
/* 秘書處會議卡（編輯中）的欄位：名稱、說明、母議題、專員、標籤、時間標記、超連結，每一欄各自可以點 */
function evFieldsHTML(ev){
  const par=parentOf(ev),ts=evTimesSorted(ev),so=staffOptsFor(ev);
  const opts=[["","（不連結）"],...state.issues.map(i=>[i.id,i.title+(i.doneAt?"（已結案）":"")])];
  const staffChips=staffNames(ev.staff).map(n=>`<span class="staff-chip">${esc(n)}</span>`).join("");
  const lblChips=labelChipsHTML(ev.labels);
  return `<div class="evfs">
      ${evFieldHTML(ev,"name","名稱",`<b>${esc(ev.name)}</b>`,()=>`<input data-e="name" value="${esc(ev.name)}">`)}
      ${evFieldHTML(ev,"desc","說明",ev.desc?`<span class="evf-desc">${esc(ev.desc)}</span>`:noneTxt("沒有說明，點一下填寫"),()=>`<textarea data-e="desc" rows="4">${esc(ev.desc||"")}</textarea>`)}
      ${evFieldHTML(ev,"issue","母議題",par?esc(par.title):noneTxt("不連結"),()=>fieldHTML({name:"evIssue",label:"結案或完成一段時，會自動寫進這個議題的處理紀錄",type:"select",value:ev.issueId||"",options:opts}))}
      ${so.length||(ev.staff||[]).length?evFieldHTML(ev,"staff","專員",staffChips||noneTxt("沒有標專員"),()=>fieldHTML({name:"staff",label:fsMode()?"可複選":"從本看板的身分挑選，可複選",type:"multi",value:ev.staff||[],options:so.map(o=>[o[0],o[1]])})):""}
      ${evFieldHTML(ev,"labels","標籤",lblChips||noneTxt("沒有標籤"),()=>labelPickerHTML("labels",ev.labels))}
      <div class="evf-group"><span class="evf-l">時間標記</span>
        ${ts.map(t=>evFieldHTML(ev,"t:"+t.id,"",evTimeView(t,par),()=>evTimeEditor(ev,t))).join("")}
        ${evFldOpen(ev,"t:+")?evFieldHTML(ev,"t:+","",'',()=>evTimeEditor(ev,null)):`<button type="button" class="ghost evd-add" data-evpen="t:+">${ico("calendar")}+ 時間</button>`}</div>
      <div class="evf-group"><span class="evf-l">超連結</span>
        ${ev.links.map(l=>evFieldHTML(ev,"l:"+l.id,"",`<span class="link" style="--c:${cssColor(l.color)}">${esc(l.name)}</span><span class="sub evf-url">${esc(l.url)}</span>`,()=>linkEditorHTML(l,ev.links.length,"evfx"))).join("")}
        ${evFldOpen(ev,"l:+")?evFieldHTML(ev,"l:+","",'',()=>linkEditorHTML(null,ev.links.length,"evfx")):ev.links.length<StoreMap.LNK_MAX?`<button type="button" class="ghost evd-add" data-evpen="l:+">+ 超連結</button>`:""}</div>
    </div>`;
}
/* 展開膠囊裡的動作列（編輯中）：欄位在上面逐欄改，這裡只剩整筆的動作 */
function evToolsHTML(ev){
  return `<span class="ev-tools"><button type="button" class="icon" data-evrep aria-pressed="${ev.report}">${ev.report?"取消報告":"會議要報告"}</button><button type="button" class="icon" data-evround>${ico("progress")}完成這一段</button><button type="button" class="icon" data-evdone>${ico("check")}結案</button></span>`;
}
/* ---------- 原位編輯器（03，Keep 式；events.js 的「原位編輯器」段） ----------
   有編輯權限的人點卡片的一行（或名稱、核取框、「沒有說明」）就在原位改：名稱、逐行內容（純文字／核取／時間＋核取，可以切換、新增、刪除）、
   時間（自製的時間選取器 tpHTML）、母議題、專員、標籤、超連結（kpFieldsHTML）。點卡片外面＝全部一起儲存並收合，沒有「取消」；
   存好後提供「復原這次修改」。kp＝{id,before}：正在編輯的那張與開始前的內容 */
let kp=null,kpSt=null,kpTp=null;   /* kpSt＝{id,st:"saving"|"ok"|"fail"|"bad",msg,before,after}：儲存回饋；kpTp＝打開時間選取器的時間標記 id */
const KP_TYPES=[["text","文字"],["check","核取"],["time","時間"]];
const kpType=b=>b.timeId?"time":b.check===null?"text":"check";
/* 沒有連到任何一行的時間標記（03 以前的舊資料）：照舊列在逐行內容下面 */
const evFreeTimes=ev=>{const on=new Set((ev.blocks||[]).map(b=>b.timeId).filter(Boolean));return evTimesSorted(ev).filter(t=>!on.has(t.id))};
/* 檢視時的逐行內容：核取框（沒有權限的人不能按）、時間、文字；有權限的人點一行＝從那一行開始編輯 */
function evLinesHTML(ev){
  const can=canEdit(),tm=new Map((ev.times||[]).map(t=>[t.id,t]));
  if(!(ev.blocks||[]).length)return can?`<button type="button" class="kp-empty sub" data-kpgo="">沒有說明</button>`:`<p class="sub">沒有說明</p>`;
  return `<ul class="kp-view">${ev.blocks.map(b=>{const t=b.timeId&&tm.get(b.timeId);
    return `<li class="kp-vl" data-k="${kpType(b)}">${b.check===null?"":`<label class="fld-check kp-ck"><input type="checkbox" data-kpck="${esc(b.id)}"${b.check?" checked":""}${can?"":" disabled"} aria-label="完成"></label>`}${t?`<span class="kp-tm num">${esc(evTimeText(t).when)}</span>`:""}<span class="kp-tx${b.check?" done":""}"${can?` data-kpgo="${esc(b.id)}" tabindex="0" role="button"`:""}>${esc(b.text)}</span></li>`}).join("")}</ul>`;
}
/* 編輯中：名稱、每一行（種類、核取框、時間、文字、刪除）、沒有連到行的舊時間標記、「+ 一行」 */
function kpEditorHTML(ev){
  const tm=new Map(ev.times.map(t=>[t.id,t])),max=StoreMap.TXT_MAX;
  const tp=t=>kpTp===t.id?tpHTML(ev,t):"";
  const row=b=>{const k=kpType(b),t=b.timeId&&tm.get(b.timeId);
    return `<div class="kp-line" data-blk="${esc(b.id)}" data-fk="${esc(b.id)}" data-k="${k}">${cselHTML({name:"kpType",value:k,options:KP_TYPES,cls:"kp-type",aria:"這一行的種類"})}${k==="text"?"":`<label class="fld-check kp-ck"><input type="checkbox" data-kpck="${esc(b.id)}"${b.check?" checked":""} aria-label="完成"></label>`}${t?`<button type="button" class="kp-tm num" data-kptm="${esc(t.id)}" aria-expanded="${kpTp===t.id}">${esc(evTimeText(t).when)}</button>`:""}<input class="kp-tx" data-kptx="${esc(b.id)}" value="${esc(b.text)}" maxlength="${max}" aria-label="內容"><button type="button" class="icon kp-del" data-kpdel="${esc(b.id)}" aria-label="刪除這一行">${ico("close","solo")}</button></div>${t?tp(t):""}`};
  const free=t=>`<div class="kp-line kp-free" data-k="time"><button type="button" class="kp-tm num" data-kptm="${esc(t.id)}" aria-expanded="${kpTp===t.id}">${esc(evTimeText(t).when)}</button><input class="kp-tx" data-kplb="${esc(t.id)}" value="${esc(t.label)}" maxlength="${max}" aria-label="時間標記名稱"><button type="button" class="icon kp-del" data-kptdel="${esc(t.id)}" aria-label="刪除這個時間標記">${ico("close","solo")}</button></div>${tp(t)}`;
  const fr=evFreeTimes(ev);
  return `<div class="kp" data-kp="${esc(ev.id)}"><input class="kp-title" data-kptitle value="${esc(ev.name)}" maxlength="500" aria-label="名稱">
      <div class="kp-lines" data-flip="kp">${ev.blocks.map(row).join("")}</div>${fr.length?`<div class="kp-lines kp-frees">${fr.map(free).join("")}</div>`:""}
      ${ev.blocks.length<StoreMap.BLK_MAX?`<button type="button" class="ghost evd-add kp-add" data-kpadd>+ 一行</button>`:""}
      ${kpFieldsHTML(ev)}</div>`;
}
/* 名稱與逐行內容下面：母議題（自製下拉）、專員（勾選膠囊）、標籤（人事時地物的挑選區）、超連結（色點、名稱、網址、刪除；「+ 超連結」）。
   跟逐行內容一樣直接改、改了就寫進 state（events.js 的 input／change／kpClick），點外面跟其他修改一起儲存；沒有各自的「取消／完成」。
   專員只在有選項時出現、標籤只在這個看板有標籤時出現（不放「到設定建立」這類說明） */
function kpFieldsHTML(ev){
  const so=staffOptsFor(ev),on=new Set(ev.staff||[]);
  const opts=[["","（不連結）"],...state.issues.map(i=>[i.id,i.title+(i.doneAt?"（已結案）":"")])];
  const row=(k,l,body)=>`<div class="kp-f" data-kpf="${k}"><span class="kp-fl">${l}</span><div class="kp-fv">${body}</div></div>`;
  return `<div class="kp-flds">${row("issue","母議題",cselHTML({name:"kpIssue",value:ev.issueId||"",options:opts,cls:"kp-issue",aria:"母議題"}))}
      ${so.length?row("staff","專員",`<div class="chips">${so.map(([v,t])=>`<label class="chip"><input type="checkbox" name="kpStaff" value="${esc(v)}"${on.has(v)?" checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`):""}
      ${state.labels.length?row("labels","標籤",labelPickerHTML("kpLabels",ev.labels)):""}
      ${row("links","超連結",`${ev.links.map(l=>`<div class="kp-lk" data-lk="${esc(l.id)}">${linkEditorHTML(l,0,"kplk")}<button type="button" class="icon kp-del" data-kplkdel aria-label="刪除這個超連結">${ico("close","solo")}</button></div>`).join("")}${ev.links.length<StoreMap.LNK_MAX?`<button type="button" class="ghost evd-add kp-add" data-kplkadd>+ 超連結</button>`:""}`)}</div>`;
}
/* 儲存回饋：編輯中＝狀態＋「儲存」（失敗時保留草稿、可以再按）；存好後（檢視）＝已儲存＋「復原這次修改」 */
function kpBarHTML(ev){const s=kpSt&&kpSt.id===ev.id?kpSt:null;
  return `<div class="card-edbar kp-bar"><span class="kp-st" role="status"${s?` data-st="${s.st}"`:""}>${s?esc(s.msg||KP_MSG[s.st]||""):""}</span><button type="button" class="primary" data-kpsave>儲存</button></div>`}
const KP_MSG={saving:"儲存中…",ok:"已儲存",fail:"儲存失敗",bad:""};
function kpStatusHTML(ev){const s=kpSt&&kpSt.id===ev.id&&!editing?kpSt:null;if(!s)return "";
  return `<div class="kp-bar kp-done"><span class="kp-st" role="status" data-st="${s.st}">${esc(s.msg||KP_MSG[s.st]||"")}</span>${s.st==="ok"&&s.before?`<button type="button" class="icon" data-kpundo>復原這次修改</button>`:""}</div>`}
/* 自製時間選取器（逐欄編輯段的 .tp）：月曆選開始日（切到「結束」選結束日）、開始／結束時刻、地點、寫進母議題。按「完成」或點卡片外面時寫回 */
const TP_WD=["日","一","二","三","四","五","六"];
function tpHTML(ev,t,st){
  const sp=x=>[(x||"").slice(0,10),(x||"").slice(11,16)],[sd,sh]=sp(t.start),[ed,eh]=sp(t.end);
  st=st||{sd:sd||today(),ed,sh,eh,place:t.place||"",toIssue:!!t.toIssue,m:(sd||today()).slice(0,7),pick:"s"};
  const [y,mo]=st.m.split("-").map(Number),first=new Date(y,mo-1,1),n=new Date(y,mo,0).getDate(),lead=first.getDay();
  const day=d=>{const v=`${st.m}-${pad(d)}`,on=v===st.sd||v===st.ed,mid=st.ed&&v>st.sd&&v<st.ed;
    return `<button type="button" class="tp-d${v===today()?" now":""}${mid?" mid":""}" data-tpd="${esc(v)}" aria-pressed="${on}">${d}</button>`};
  const par=parentOf(ev),md=v=>v?esc(fmt(v).slice(5)):"—";
  return `<div class="tp" data-tp="${esc(t.id)}" data-st="${esc(JSON.stringify(st))}">
    <div class="tp-ends"><button type="button" class="tp-end" data-tpend="s" aria-pressed="${st.pick==="s"}">開始 <span class="num">${md(st.sd)}</span></button><button type="button" class="tp-end" data-tpend="e" aria-pressed="${st.pick==="e"}">結束 <span class="num">${md(st.ed)}</span></button>${st.ed?`<button type="button" class="icon tp-clr" data-tpclr aria-label="清除結束日">${ico("close","solo")}</button>`:""}</div>
    <div class="tp-mon"><button type="button" class="icon" data-tpm="-1" aria-label="上個月">${ico("prev")}</button><b class="num">${esc(y)} 年 ${esc(mo)} 月</b><button type="button" class="icon" data-tpm="1" aria-label="下個月">${ico("next")}</button></div>
    <div class="tp-grid">${TP_WD.map(w=>`<span class="tp-w">${w}</span>`).join("")}${"<span></span>".repeat(lead)}${Array.from({length:n},(_,i)=>day(i+1)).join("")}</div>
    <div class="tp-row"><label>開始時刻<input data-tpf="sh" value="${esc(st.sh)}" inputmode="numeric" autocomplete="off"></label><label>結束時刻<input data-tpf="eh" value="${esc(st.eh)}" inputmode="numeric" autocomplete="off"></label></div>
    <label class="tp-place">地點<input data-tpf="place" value="${esc(st.place)}">${placeQuickHTML()}</label>
    ${par?`<label class="fld-check"><input type="checkbox" data-tpf="toIssue"${st.toIssue?" checked":""}><span>也寫進母議題的處理紀錄</span></label>`:""}
    <p class="tp-err" role="alert" hidden></p>
    <div class="evf-btns"><button type="button" class="primary" data-tpok>完成</button></div></div>`;
}
/* 一顆膠囊。o：md＝左右兩欄中、sel＝被選到、next＝「下一個」記號。
   編輯中換成原位編輯器（含母議題、專員、標籤、超連結）＋整筆動作＋儲存回饋 */
function evCapHTML(ev,o){
  const st=evStatus(ev),par=parentOf(ev),sel=o.md&&ev.id===o.sel,ed=cardEd("e",ev.id);
  /* 左右兩欄時被選到的那顆只是清單裡的空位，內容在右側詳情，不重複畫編輯欄位 */
  const body=ed&&!sel?`${evMetaHTML(ev,st)}${kpEditorHTML(ev)}${evToolsHTML(ev)}${kpBarHTML(ev)}`
    :`${par?`<p class="ev-parent-full">母議題：${esc(par.title)}</p>`:""}${evMetaHTML(ev,st)}${evLinesHTML(ev)}
        ${evTimesHTML(ev,true)}${staffHTML(ev.staff)}${labelChipsHTML(ev.labels)}
        ${evLinksHTML(ev)}${sel?"":kpStatusHTML(ev)}`;
  return `<details class="ev ${sel?"sel":""} ${ev.id===o.next?"next":""} ${ed?"sec-edit":""}" data-ev="${esc(ev.id)}" data-edbox="e:${esc(ev.id)}" data-st="${st}" ${!o.md&&(openEv.has(ev.id)||ed)?"open":""}${sel?' aria-current="true"':""}>
      <summary><span class="live-dot" aria-hidden="true"></span><b>${esc(ev.name)}</b>${par?`<span class="ev-parent">→ ${esc(par.title)}</span>`:""}${ev.report?'<span class="ev-rep">報告</span>':""}<button type="button" class="ev-del edit-only" data-evdel aria-label="刪除「${esc(ev.name)}」">${ico("close","solo")}</button><span class="ev-chev" aria-hidden="true">▾</span></summary>
      <div class="ev-body">${body}</div>
    </details>`;
}
/* 右側詳情（桌面、即時回報被選到時）：檢視時只看內容（有權限的人點名稱或一行就開始編輯）；編輯中＝原位編輯器＋整筆動作＋儲存回饋 */
function evDetailHTML(ev){
  const st=evStatus(ev),par=parentOf(ev),ed=cardEd("e",ev.id);
  const head=`<div class="evd-head"><span class="live-dot" aria-hidden="true"></span><b${!ed&&canEdit()?` data-kpgo="title" tabindex="0" role="button"`:""}>${esc(ev.name)}</b>${ev.report?'<span class="ev-rep">報告</span>':""}${mdStepHTML("live",liveOrder().map(e=>e.id),ev.id)}<button type="button" class="icon md-close" data-mdclose="live" aria-label="收起右側">${ico("close")}收起</button></div>
    ${evMetaHTML(ev,st)}`;
  if(!ed)return `<div class="evd" data-ev="${esc(ev.id)}" data-st="${st}">${head}
    ${par?`<p class="sub evd-par">母議題：${esc(par.title)}</p>`:""}
    <div class="evd-desc">${evLinesHTML(ev)}</div>
    ${evTimesHTML(ev,true)}${staffHTML(ev.staff)}${labelChipsHTML(ev.labels)}
    ${evLinksHTML(ev)}${kpStatusHTML(ev)}</div>`;
  return `<div class="evd editing sec-edit" data-ev="${esc(ev.id)}" data-edbox="e:${esc(ev.id)}" data-st="${st}">${head}
    ${kpEditorHTML(ev)}
    <section class="evd-sec evd-acts">
      <div class="evd-round" hidden><label class="evd-f">這一段完成了什麼（存進完成紀錄）<textarea data-rf="done" rows="3">${esc(ev.desc||"")}</textarea></label>
        <label class="evd-f">下一段要追蹤什麼（取代說明；留空就沿用）<textarea data-rf="next" rows="2"></textarea></label>
        <div class="evd-btns"><button type="button" class="ghost" data-evd="roundcancel">取消</button><button type="button" class="primary" data-evd="roundok">完成第 ${esc(ev.round)} 段</button></div></div>
      <div class="evd-btns evd-main"><button type="button" class="icon danger" data-evdel>刪除</button><span class="evd-gap"></span><button type="button" class="icon" data-evrep aria-pressed="${!!ev.report}">${ev.report?"取消報告":"會議要報告"}</button><button type="button" class="icon" data-evd="round">${ico("progress")}完成這一段</button><button type="button" class="icon" data-evdone>${ico("check")}結案</button></div>
    </section>${kpBarHTML(ev)}</div>`;
}
/* 左右兩欄詳情卡上的「上一個／下一個」（開會時照清單順序一路講下去；鍵盤左右鍵同功能，見 motion.js） */
function mdStepHTML(k,ids,id){const i=ids.indexOf(id);
  return `<span class="md-step"><button type="button" class="icon" data-mdstep="${k}" data-dir="-1" ${i<=0?"disabled":""} aria-label="上一個">${ico("prev")}上一個</button><button type="button" class="icon" data-mdstep="${k}" data-dir="1" ${i<0||i>=ids.length-1?"disabled":""} aria-label="下一個">下一個${ico("next")}</button></span>`}
/* 會議要報告：ev.report 為真的排在上方「會議報告事項」區，其他在下方；生成週報後標記自動清掉。
   上一個／下一個、「下一個」記號都照畫面順序（上區再下區） */
const liveOrder=()=>{const a=state.events.filter(ev=>!ev.doneAt);return[...a.filter(e=>e.report),...a.filter(e=>!e.report)]};
function renderEvents(){
  const live=liveOrder(),rep=live.filter(e=>e.report),rest=live.filter(e=>!e.report);if(selEv&&!live.some(e=>e.id===selEv))selEv=null;
  /* 左右兩欄只在點選一筆之後才出現；沒選的時候照常排成膠囊格 */
  const md=mdOn("live")&&!!selEv,pane=$("#evDetail");mdLast.live=mdOn("live");
  $("#liveMD").classList.toggle("split",md);
  if(!editing){evFld=null;kp=null;kpTp=null;if(kpSt&&kpSt.st!=="saving"&&(md?selEv!==kpSt.id:!openEv.has(kpSt.id)))kpSt=null}   /* 收合（或右側換成別張）＝儲存回饋與「復原這次修改」消失 */
  const o={md,sel:selEv,next:md?(live[live.findIndex(e=>e.id===selEv)+1]||{}).id:null};   /* next：畫面順序裡的下一顆，加「下一個」記號 */
  const cap=ev=>evCapHTML(ev,o);
  const addBtn=`<button type="button" class="ghost auth-only add-row" id="addEvent">+ 新增即時回報</button>`;   /* 新增鈕在清單最後自己一行（不佔一顆膠囊的格子；登入、沒有卡片在編輯時顯示） */
  const empty=`<p class="empty">目前沒有即時回報。</p>`;   /* 不放教學說明文字（03 暫定決策 f） */
  /* 2026-11-06 使用者從預覽選 D：報告區不寫區名（每顆膠囊右邊自己標「報告」），其他回報上面一條細線、中間小字區名 */
  const zone=(k,h,list,tail)=>`<div class="ev-zone" data-zone="${k}">${h?`<div class="ev-zone-h"><span>${h}</span></div>`:""}<div class="events">${list.length?list.map(cap).join(""):h?"":empty}${tail}</div></div>`;
  $("#events").innerHTML=rep.length?zone("rep","",rep,"")+"\n      "+zone("rest","其他回報",rest,addBtn):zone("rest","",live,addBtn);

/* 完成紀錄：一般是可展開的清單；桌面放大成全寬時（mdOn）改成左側清單、右側詳情 */
function renderDone(){
  const ds=doneIssues();
  const de=state.events.filter(ev=>ev.doneAt);
  const ids=new Set([...ds.map(i=>i.id),...de.map(e=>e.id)]);
  const dnew=id=>prevDone&&!prevDone.has(id)?"new":"";
  const link=l=>`<a class="link" style="--c:${cssColor(l.color)}" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.name)}</a>`;
  /* 每一筆拆成：屬性、標題、副標、內容，膠囊與右側詳情共用。內容最下面「編輯」（登入才看得到）；
     編輯中（cardEd）名稱、完成日期、說明（即時回報多母議題）換成逐欄編輯（doneFieldsHTML），最下面「取消｜儲存」 */
  const tail=(key,ed)=>ed?editBarHTML():`<div class="ev-edrow">${editBtnHTML(key)}</div>`;
  const items=ds.map(it=>{const ed=cardEd("i",it.id);return {id:it.id,ed,key:"i:"+it.id,d:it.doneAt||"",attr:`data-issue="${esc(it.id)}"`,title:esc(it.title),sub:`${esc(fmt(it.doneAt))||"—"} · 議題`,del:fsDelOk()?`data-deldone aria-label="刪除「${esc(it.title)}」"`:"",
    body:`${ed?doneFieldsHTML(it,false):""}${hasDates(it)?`<div class="sub">期間 ${fmt(it.start)} – ${fmt(it.end)}</div>`:""}
        ${!ed&&it.note?`<p style="margin:0;white-space:pre-wrap">${esc(it.note)}</p>`:""}
        ${it.tags.length?`<div class="tags">${it.tags.map((g,k)=>`<span class="tag ${k===it.cur?"cur":k<it.cur?"past":""}">${esc(g)}</span>`).join("")}</div>`:""}
        ${it.markers.length?`<ul>${sortedMarkers(it).map(m=>`<li>${m.date?`<span class="num">${fmt(m.date)}</span> `:""}${m.stage?`【${esc(m.stage)}】`:""}${esc(m.text)}</li>`).join("")}</ul>`:""}
        ${it.links.length?`<div class="links">${it.links.map(link).join("")}</div>`:""}
        <span class="edit-only" style="gap:6px"><button type="button" class="icon" data-restore>取消結案</button></span>${tail("i:"+it.id,ed)}`}})
  .concat(de.map(ev=>{const ed=cardEd("e",ev.id);return {id:ev.id,ed,key:"e:"+ev.id,d:ev.doneAt,attr:`data-ev="${esc(ev.id)}"`,title:esc(evName(ev)),sub:`${esc(fmt(ev.doneAt))||"—"} · 即時回報${parentOf(ev)?` → ${esc(parentOf(ev).title)}`:""}`,del:`data-evdel aria-label="刪除「${esc(ev.name)}」"`,
    body:`${ed?doneFieldsHTML(ev,true):ev.desc?`<p style="margin:0;white-space:pre-wrap">${esc(ev.desc)}</p>`:""}${(ev.links||[]).length?`<div class="links">${ev.links.map(link).join("")}</div>`:""}
        ${evTimesHTML(ev)}
        ${ev.fromEv?"":`<span class="edit-only" style="gap:6px"><button type="button" class="icon" data-evundo>移回即時回報</button></span>`}${tail("e:"+ev.id,ed)}`}}))
  .sort((a,b)=>b.d.localeCompare(a.d));
  /* 跟即時回報同一套膠囊與左右兩欄（class ev＋done-ev、data-st="done"）：外觀跟即時回報一樣，只有燈號是綠色；data-done＝這一筆的 id */
  if(!items.some(x=>x.id===selDone))selDone=null;
  const md=mdOn("done")&&!!selDone,pane=$("#doneDetail");mdLast.done=mdOn("done");

  const nextDone=md?(items[items.findIndex(y=>y.id===selDone)+1]||{}).id:null;
  const cap=x=>`<details class="ev done-ev ${dnew(x.id)} ${md&&x.id===selDone?"sel":""} ${x.id===nextDone?"next":""} ${x.ed?"sec-edit":""}" data-done="${esc(x.id)}" data-edbox="${esc(x.key)}" ${x.attr} data-st="done" ${!md&&(openDone.has(x.id)||x.ed)?"open":""}${md&&x.id===selDone?' aria-current="true"':""}>
      <summary><span class="live-dot" aria-hidden="true"></span><b>${x.title}</b>${x.del?`<button type="button" class="ev-del edit-only" ${x.del}>${ico("close","solo")}</button>`:""}<span class="ev-chev" aria-hidden="true">▾</span></summary>
      <div class="ev-body"><p class="ev-meta">${x.sub}</p><div class="done-body">${md&&x.id===selDone?"":x.body}</div></div></details>`;   /* 左右兩欄時被選到的那顆只是空位，內容（含編輯欄位）只畫在右側詳情 */
  $("#doneList").innerHTML=items.map(cap).join("")||`<p class="empty">結案的議題和完成的即時回報會收進這裡。</p>`;
  if(md){const x=items.find(y=>y.id===selDone);
    pane.innerHTML=`<div class="evd ${x.ed?"sec-edit":""}" data-st="done" data-done="${esc(x.id)}" data-edbox="${esc(x.key)}" ${x.attr}><div class="evd-head"><span class="live-dot" aria-hidden="true"></span><b>${x.title}</b>${mdStepHTML("done",items.map(y=>y.id),x.id)}<button type="button" class="icon md-close" data-mdclose="done" aria-label="收起右側">${ico("close")}收起</button></div>
      <p class="ev-meta">${x.sub}</p><div class="done-body">${x.body}</div></div>`;pane.hidden=false;
  }else{pane.innerHTML="";pane.hidden=true}
  prevDone=ids;Anim.syncPings();

/* 左右兩欄時換選一筆：右側內容淡入（完成紀錄與個別進度共用） */

<script>
/* 核心｜對話框 */
/* ---------- dialog ---------- */
function fieldHTML(x){
  if(x.type==="labels")return `<fieldset class="multi"><legend>${esc(x.label)}</legend>${labelPickerHTML(x.name,x.value)}</fieldset>`;
  if(x.type==="multi")return `<fieldset class="multi"><legend>${esc(x.label)}</legend><div class="chips">${x.options.map(([v,t])=>`<label class="chip"><input type="checkbox" name="${x.name}" value="${esc(v)}" ${(x.value||[]).includes(v)?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div></fieldset>`;
  if(x.type==="stepper")return `<div class="fld"><span class="fld-l">${esc(x.label)}</span><div class="stepper" data-min="${x.min??-1e9}" data-max="${x.max??1e9}"><button type="button" data-step="-1" aria-label="減一">−</button><span class="stepper-v"><span class="stepper-n num" aria-live="polite">${+x.value||0}</span>${x.suffix?`<span class="stepper-s">${esc(x.suffix)}</span>`:""}</span><button type="button" data-step="1" aria-label="加一">＋</button><input type="hidden" name="${x.name}" value="${+x.value||0}"></div></div>`;
  if(x.type==="check")return `<label class="fld-check"><input type="checkbox" name="${x.name}" ${x.value?"checked":""}><span>${esc(x.label)}</span></label>`;
  if(x.type==="textarea")return `<label>${esc(x.label)}<textarea name="${x.name}" rows="${x.rows||16}" placeholder="${esc(x.ph||"")}">${esc(x.value||"")}</textarea></label>`;
  if(x.type==="select")return `<div class="fld"><span class="fld-l">${esc(x.label)}</span>${cselHTML(x)}</div>`;
  if(x.type==="color")return `<label>${esc(x.label)}<span class="swatches">${(x.palette||COLORS).map(c=>`<button type="button" style="background:${c}" data-sw="${c}" aria-pressed="${c===x.value}" aria-label="顏色 ${c}"></button>`).join("")}<input type="color" name="${x.name}" value="${esc(x.value)}" style="width:46px;height:32px;padding:2px" aria-label="自訂顏色"></span></label>`;
  const t=x.type==="url"||x.type==="time"?"text":(x.type||"text");
  return `<label>${esc(x.label)}<input name="${x.name}" type="${t}" value="${esc(x.value??"")}" ${x.ph?`placeholder="${esc(x.ph)}"`:""} ${x.type==="url"?'inputmode="url"':x.type==="time"?'inputmode="numeric" autocomplete="off"':""} ${t==="number"?'min="0" max="100"':""}></label>`;
}
/* 對話框開在哪裡：設定頁桌面版有右側面板時，一般表單畫在面板裡（非強制回應）；
   modal＝確認、輸入密碼這類要打斷操作的（沒有欄位，或只有密碼欄），一律跳出 */
function dlgOpen(modal){
  if($("#dlg")._fadeEnd)$("#dlg")._fadeEnd();   /* 上一個面板表單還在淡出：先關完 */
  const d=$("#dlg"),host=!modal&&typeof setPaneHost==="function"&&setPaneHost();
  if(host){d.classList.add("in-pane");if(d.parentNode!==host)host.append(d);d.show()}
  else{d.classList.remove("in-pane");if(d.parentNode!==document.body)document.body.append(d);d.showModal()}
}
/* ask(標題, 欄位, 選項)：
   note＝標題下面的使用提示（一般文字，可以多行）；
   validate(值)＝按「確定」時先檢查，回傳錯誤文字就在視窗裡用紅字顯示、視窗不關（可以是 async）；回傳空值才關掉並回傳結果 */
function ask(title,fields,{danger,wide,alt,note,validate}={}){
  return new Promise(res=>{
    const d=$("#dlg"),f=$("#dlgForm");
    d.classList.toggle("wide",!!wide);
    f.innerHTML=`<b>${esc(title)}</b>`+(note?`<p class="dlg-note">${esc(note).replace(/\n/g,"<br>")}</p>`:"")+`<p class="dlg-err" role="alert" hidden></p>`+fields.map(fieldHTML).join("")
      +(!fields.length&&danger
        ?`<div class="dlg-actions"><button type="button" data-act="delete" class="danger-solid">${esc(danger)}</button><button type="button" data-act="cancel">取消</button></div>`
        :`<div class="dlg-actions"><button type="button" data-act="ok" class="primary">確定</button><button type="button" data-act="cancel">取消</button>${danger?`<button type="button" data-act="delete" class="danger-btn">${esc(danger)}</button>`:""}${alt?`<button type="button" data-act="alt" class="ghost alt-btn">${esc(alt)}</button>`:""}</div>`);
    /* 數字上下按鈕：按一下加減 1，數字往按的方向滾一下 */
    f.querySelectorAll(".stepper").forEach(st=>st.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
      const inp=st.querySelector("input"),n=st.querySelector(".stepper-n"),d=+b.dataset.step,v=Math.min(+st.dataset.max,Math.max(+st.dataset.min,(+inp.value||0)+d));
      if(v===+inp.value)return;inp.value=v;n.textContent=v;
      if(!reduceMotion())n.animate([{transform:`translateY(${d>0?60:-60}%)`,opacity:0},{transform:"none",opacity:1}],{duration:220,easing:"cubic-bezier(.2,.9,.25,1)"})}));
    f.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{f.querySelectorAll("[data-sw]").forEach(x=>x.setAttribute("aria-pressed",x===b));f.querySelector("input[type=color]").value=b.dataset.sw});
    /* no form submission: works inside sandboxed previews too */
    const collect=()=>{const o={},fd=new FormData(f);fd.forEach((val,k)=>o[k]=f.querySelector(`textarea[name="${k}"]`)?String(val).replace(/\s+$/,""):String(val).trim());fields.filter(x=>x.type==="multi"||x.type==="labels").forEach(x=>o[x.name]=fd.getAll(x.name).map(String));return o};
    /* 按「確定」：有 validate 就先檢查，錯了在視窗裡顯示紅字（每次重新顯示時輕輕晃一下），游標回到第一個輸入框 */
    let busy=false;
    const ok=async()=>{if(busy)return;
      if(validate){busy=true;let m;try{m=await validate(collect())}finally{busy=false}
        if(m){const e=f.querySelector(".dlg-err");e.textContent=m;e.hidden=false;if(!reduceMotion())e.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:240,easing:"ease-out"});
          f.querySelector("input:not([type=hidden]):not([type=checkbox])")?.focus();return}}
      d.close("ok")};
    f.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>b.dataset.act==="ok"?ok():d.close(b.dataset.act));
    f.onsubmit=ev=>{ev.preventDefault();if(!fields.length&&danger)d.close("delete");else ok()};
    f.onkeydown=ev=>{if(ev.key==="Enter"&&!ev.isComposing&&ev.target.tagName==="INPUT"&&ev.target.type!=="color"&&ev.target.type!=="checkbox"){ev.preventDefault();ok()}};
    d.onclose=()=>{const v=d.returnValue;if(v==="ok")res(collect());else res(v==="delete"?"delete":v==="alt"?"alt":null)};
    d.returnValue="";dlgOpen(!fields.length||fields.every(x=>x.type==="password"||x.type==="check"));(f.querySelector("textarea")||f.querySelector("input"))?.focus();
  });
}
const markerFields=(m,it)=>[
  {name:"text",label:"註記文字",value:m.text||""},
  {name:"stage",label:"對應階段（選填）",type:"select",value:m.stage||"",options:[["","（不指定）"],...[...new Set([...it.tags,...(m.stage?[m.stage]:[])])].map(t=>[t,t])]},
  {name:"date",label:hasDates(it)?"日期（決定在時程條與甘特圖上的位置）":"日期（選填，填了也會顯示在甘特圖）",type:"date",value:m.date||today()},
  ...(hasDates(it)?[]:[{name:"at",label:"位置（時程條上的 %；議題填了開始／結束日後改照日期放）",type:"number",value:m.at}]),
  {name:"pos",label:"文字放在",type:"select",value:m.pos||"up",options:[["up","時程條上方"],["down","時程條下方"]]}];
/* 有期間的議題：位置跟著日期走；沒有日期就照 % */
const applyMarker=(m,v,it)=>{Object.assign(m,{text:v.text||m.text,stage:v.stage||"",date:v.date||"",pos:v.pos,color:v.color||m.color});
  m.at=hasDates(it)&&m.date?schedPct(it,m.date):clamp(Math.round(+(v.at??m.at)||0));return m};
async function editMarker(it,mk){
  const v=await ask("編輯註記",markerFields(mk,it),{danger:"刪除註記"});
  if(v==="delete")it.markers=it.markers.filter(x=>x!==mk);else if(v)applyMarker(mk,v,it);if(v)changed();
}

/* 即時回報的時間標記：只填日期＝一個日子；加時刻＝具體時間；填了結束＝一段期間 */
const parseHM=s=>{s=String(s||"").trim().replace(/[：.．]/g,":");if(!s)return "";const m=s.match(/^(\d{1,2})(?::?(\d{2}))?$/);if(!m||+m[1]>23||+(m[2]||0)>59)return null;return pad(+m[1])+":"+pad(+(m[2]||0))};
/* 時間標記的欄位（名稱、日期、時刻、結束日期、結束時刻）→ start／end；有錯回傳 msg（即時回報的逐欄編輯用） */
function evTimeParts({label,sd,st,ed,et}){
  const hs=parseHM(st),he=parseHM(et);
  if(!label)return {msg:"請填這個時間是什麼"};
  if(!sd)return {msg:"請選日期"};
  if(hs===null||he===null)return {msg:"時刻請用 14:00 這種格式"};
  const e2=ed||(he?sd:"");
  const start=sd+(hs?"T"+hs:""),end=e2?e2+(he?"T"+he:""):"";
  if(end&&(end.slice(0,10)<start.slice(0,10)||(hs&&he&&end<start)))return {msg:"結束要晚於開始"};
  return {start,end:!end||end===start||(e2===sd&&!he)?"":end};
}

/* ---------- 自製下拉選單：外觀在每個瀏覽器都一樣 ---------- */
/* x＝{name,value,options:[[值,文字]],cls（外框多帶的 class）,label（沒有欄位標題時給按鈕的 aria-label）}；選了會在隱藏的 input 觸發 change */
function cselHTML(x){const cur=x.options.find(o=>o[0]===x.value)||x.options[0]||["",""];
  return `<div class="csel${x.cls?" "+x.cls:""}"><input type="hidden" name="${esc(x.name)}" value="${esc(cur[0])}"><button type="button" class="csel-btn" aria-haspopup="listbox" aria-expanded="false"${x.aria?` aria-label="${esc(x.aria)}"`:""}><span class="csel-v">${esc(cur[1])}</span><svg class="csel-chev" viewBox="0 0 12 8" width="11" height="7" aria-hidden="true"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="csel-list" role="listbox" hidden>${x.options.map(([v,t])=>`<button type="button" role="option" class="csel-opt" data-v="${esc(v)}" aria-selected="${v===cur[0]}">${esc(t)}</button>`).join("")}</div></div>`}
function cselClose(c,focus){
  const l=c.querySelector(".csel-list"),b=c.querySelector(".csel-btn");if(!c.classList.contains("open"))return;
  c.classList.remove("open");b.setAttribute("aria-expanded","false");
  const done=()=>{if(!c.classList.contains("open")){l.hidden=true;c.classList.remove("up")}};
  if(reduceMotion())done();else l.animate([{opacity:1,transform:"none"},{opacity:0,transform:`translateY(${c.classList.contains("up")?6:-6}px) scale(.98)`}],{duration:140,easing:"cubic-bezier(.4,0,1,1)"}).onfinish=done;
  if(focus)b.focus();
}
function cselOpen(c){
  document.querySelectorAll(".csel.open").forEach(o=>o!==c&&cselClose(o));
  const l=c.querySelector(".csel-list"),b=c.querySelector(".csel-btn");
  l.hidden=false;c.classList.add("open");c.classList.remove("up");b.setAttribute("aria-expanded","true");
  const r=l.getBoundingClientRect();if(r.bottom>innerHeight-12&&b.getBoundingClientRect().top>r.height+20)c.classList.add("up");
  if(!reduceMotion())l.animate([{opacity:0,transform:`translateY(${c.classList.contains("up")?8:-8}px) scale(.97)`},{opacity:1,transform:"none"}],{duration:240,easing:"cubic-bezier(.2,.9,.25,1.1)"});
  (l.querySelector('[aria-selected="true"]')||l.querySelector(".csel-opt")).focus({preventScroll:true});
}
document.addEventListener("click",e=>{
  const t=e.target;if(!t.closest)return;
  const b=t.closest(".csel-btn");if(b){const c=b.closest(".csel");c.classList.contains("open")?cselClose(c):cselOpen(c);return}
  const o=t.closest(".csel-opt");if(o){const c=o.closest(".csel");const inp=c.querySelector("input"),chg=inp.value!==o.dataset.v;inp.value=o.dataset.v;c.querySelector(".csel-v").textContent=o.textContent;if(chg)inp.dispatchEvent(new Event("change",{bubbles:true}));c.querySelectorAll(".csel-opt").forEach(x=>x.setAttribute("aria-selected",x===o));cselClose(c,true);return}
  document.querySelectorAll(".csel.open").forEach(c=>{if(!c.contains(t))cselClose(c)});
});
document.addEventListener("keydown",e=>{
  const c=document.querySelector(".csel.open");
  if(!c){const b=e.target.closest&&e.target.closest(".csel-btn");if(b&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();cselOpen(b.closest(".csel"))}return}
  const os=[...c.querySelectorAll(".csel-opt")],i=os.indexOf(document.activeElement);
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();cselClose(c,true)}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();os[(i+(e.key==="ArrowDown"?1:os.length-1)+os.length)%os.length].focus()}
  else if(e.key==="Tab")cselClose(c);
},true);

/* ---------- 對話框：玻璃質地＋開關都有過渡 ---------- */
(function(){

{const l=$("#weekSecLink");if(l)l.hidden=!!CFG.meeting||CFG.deptId==="secretariat"}   /* 秘書處自己就不顯示「秘書處調閱」 */

const evName=ev=>ev.fromEv?`${ev.name}（第 ${ev.round} 段）`:ev.doneAt&&ev.round>1?`${ev.name}（第 ${ev.round} 段・結案）`:ev.name;

function syncLink(ev){
  const keepTm=new Set((ev.times||[]).filter(t=>t.toIssue&&t.start).map(t=>t.id));
  state.issues.forEach(i=>{i.markers=i.markers.filter(m=>m.evId!==ev.id||(i.id===ev.issueId&&(m.tmId?keepTm.has(m.tmId):!!ev.doneAt)))});

  if(ev.doneAt)put(x=>x.evId===ev.id&&!x.tmId,{},evName(ev),ev.doneAt);

/* 刪除即時回報時：母議題裡由它寫入的處理紀錄保留下來，只拿掉連結 */
function unlinkEv(ev){state.issues.forEach(i=>i.markers.forEach(m=>{if(m.evId===ev.id){delete m.evId;delete m.tmId}}))}

function evTouch(ev){

/* 狀態：以每週回報期限（CFG.week.cutoff，預設週二）為界
   ok 綠＝期限前有更新、這週沒完成一段；go 黃＝這週完成過一段，或期限過後才補更新；stall 紅＝期限前後都沒更新 */
const EV_ST={ok:"按時更新",go:"持續進行",stall:"沒有進度"};
function evStatus(ev){
  const ref=today(),back=(pd(ref).getDay()-(+CFG.week.cutoff||0)+7)%7;

/* ---------- weekly report generator ---------- */
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
/* 週報基準（下一份週報從哪天算起）存在部門設定；firestore 模式只有部門管理員以上能寫部門設定（規則），編輯者產出週報時不改基準，
   免得畫面上看起來更新了、存檔時卻沒寫進去（02D 審查） */
function snapshotBase(date){
  if(fsMode()&&!fsAdmin())return;
  const issues={};state.issues.forEach(i=>issues[i.id]={stage:i.tags[i.cur]||"",note:i.note||""});
  state.reportBase={date,issues};
}
/* 每週概述的紅點（設定鍵右上角、設定頁「每週概述」那一列）：每週五起亮，直到這一週（週一到週日）有一份週報產出為止；
   沒產出就一直亮到產出（下週一到週四仍以上週為準），下個週五再開始新的一輪 */
const WEEK_DUE_DAY=5;
function weekDue(t=today()){
  const d=pd(t),back=(d.getDay()-WEEK_DUE_DAY+7)%7,fri=addDays(t,-back),mon=addDays(fri,-4);
  return !state.weeks.some(w=>w.date&&w.date>=mon);
}
function weekDotSync(){
  const due=weekDue()&&!readOnly();
  document.querySelectorAll("#setBtn,#setOv [data-set=week],#setOv [data-set=report],[data-hub=week]").forEach(el=>el.classList.toggle("due",due));
  const g=$("#setBtn");if(g)g.setAttribute("aria-label",due?"設定（本週週報還沒產出）":"設定");   /* 紅點對讀屏器的說法（03 F1 拿掉 title 後改用名稱，不是提示框） */
}
/* 網頁一直開著跨過週五也要冒出來：每 10 分鐘、回到這個分頁時再檢查一次 */
setInterval(weekDotSync,6e5);document.addEventListener("visibilitychange",()=>{if(!document.hidden)weekDotSync()});
/* 「本週」＝上一份週報之後到今天（生成週報、動畫模式共用） */
function weekRange(){
  const end=today();
  const lastWeek=[...state.weeks].map(w=>w.date).filter(d=>d<end).sort().pop();
  const start=state.reportBase?.date&&state.reportBase.date<end?state.reportBase.date:(lastWeek||addDays(end,-7));
  return {start,end};
}
/* 生成週報（2026-11-05 改）：只列兩區、只寫標題，不寫說明與議題進度
   一、會議報告事項：還沒完成、標了「會議要報告」（ev.report）的即時回報標題（照畫面順序）；一筆都沒標時改成「一、即時回報」，列全部進行中的即時回報標題
   二、本週完成：完成紀錄裡這一整週（今天往前 7 天）完成的項目標題（議題結案、即時回報結案、完成一段都算），由新到舊 */
function buildWeekly(){
  const end=today(),start=addDays(end,-7);   /* 一整週：start 之後到今天（含），共 7 天 */
  const inP=d=>!!d&&d>start&&d<=end;
  const dept=CFG.dept.name||(state.title||"").replace(/(工作)?(看板|進度|進度看板)$/,"").trim()||state.title;
  const L=[`${dept} 本週例行回報`,`日期：【${end.replaceAll("-",".")}】`,""];
  /* 有人標「會議要報告」就只列那些；一筆都沒有標時，改列全部進行中的即時回報標題（區名也改成「即時回報」） */
  const live=liveOrder(),rep=live.filter(e=>e.report);
  if(rep.length)L.push("一、會議報告事項",...rep.map(e=>`❏ ${e.name}`),"");
  else L.push("一、即時回報",...(live.length?live.map(e=>`❏ ${e.name}`):["❏ 本週沒有即時回報"]),"");
  const done=[...state.issues.filter(i=>inP(i.doneAt)).map(i=>({d:i.doneAt,t:i.title})),...state.events.filter(e=>inP(e.doneAt)).map(e=>({d:e.doneAt,t:evName(e)}))].sort((a,b)=>b.d.localeCompare(a.d));
  L.push("二、本週完成",...(done.length?done.map(x=>`❏ ${x.t}`):["❏ 本週沒有完成項目"]));
  return {start,end,text:L.join("\n")};
}


</script>
<script>
/* 核心｜工作報告：選期間 → 預覽（文字可直接修改；可加章節、文字／圖片／卡片圖塊）→ 列印成 PDF
   結構：封面、目錄、各章（預設：本期摘要〔數字＋期間甘特圖〕、議題處理情形〔逐案〕、工作檢討、下期規劃）
   預覽裡的字、上傳的圖片只用在這一份報告，不會存進看板、不會上傳。 */
let rptOpen=false,rptRange=null,rptDoc=null;   /* rptDoc：預覽的不是工作報告時（秘書處的會議紀錄，meeting.js）＝{label,k,file,html} */

/* ---------- 資料：期間內處理過的議題、即時回報、週報 ---------- */
function rptData(from,to){
  const inP=d=>!!d&&d>=from&&d<=to;
  const act=state.issues.filter(i=>(!i.doneAt||i.doneAt>to)&&(!i.start||i.start<=to));
  const done=state.issues.filter(i=>i.doneAt&&inP(i.doneAt)).sort((a,b)=>a.doneAt.localeCompare(b.doneAt));
  const extra=state.issues.filter(i=>!act.includes(i)&&!done.includes(i)&&i.markers.some(m=>inP(m.date)));
  const issues=[...act,...done,...extra];
  const evNew=state.events.filter(e=>!e.fromEv&&inP(e.createdAt)),evDone=state.events.filter(e=>inP(e.doneAt));
  return {from,to,inP,issues,nDone:issues.filter(i=>i.doneAt&&inP(i.doneAt)).length,nAct:issues.filter(i=>!(i.doneAt&&inP(i.doneAt))).length,evNew,evDone,evLinked:evDone.filter(e=>e.issueId).length,
    marks:issues.reduce((n,i)=>n+i.markers.filter(m=>inP(m.date)).length,0),weeks:state.weeks.filter(w=>inP(w.date))};
}

/* ---------- 期間甘特圖（只畫這段期間，超出的部分切掉） ---------- */
/* 報告裡的期間甘特圖（2026-11-06 使用者：套看板最新的樣子）：跟看板甘特圖同一種細刻度（views.js 的 ticksHTML、board.css 的 .tk），
   每列＝議題名稱、時程 %、一排刻度（期間外淡色短、期間內已過深色長、還沒到灰色中、今天綠色最高）；上面月份，今天在期間內就加綠色小膠囊 */
function rptGantt(d){
  const rows=d.issues.filter(i=>hasDates(i)&&(i.start<i.end?i.start:i.end)<=d.to&&(i.start<i.end?i.end:i.start)>=d.from);
  if(!rows.length)return "";
  const t0=pd(d.from).getTime(),t1=pd(d.to).getTime()+864e5,P=s=>Math.max(0,Math.min(100,(pd(s).getTime()-t0)/(t1-t0)*100));
  const ms=[],m=pd(d.from);m.setDate(1);if(m.getTime()<t0)m.setMonth(m.getMonth()+1);
  while(m.getTime()<t1){ms.push(ymd(m));m.setMonth(m.getMonth()+1)}
  const td=today(),tn=td>=d.from&&td<=d.to?P(td):td>d.to?101:-1;
  const axis=`<div class="rg-row rg-head"><span></span><span></span><div class="rg-axis">${ms.map(s=>`<span style="left:${P(s).toFixed(2)}%">${pd(s).getMonth()+1}月</span>`).join("")}${tn>=0&&tn<=100?`<span class="rg-now" style="left:${tn.toFixed(2)}%">今天 ${fmt(td).slice(5)}</span>`:""}</div></div>`;
  const body=rows.map(it=>{const s=it.start<it.end?it.start:it.end,e=it.start<it.end?it.end:it.start;
    return `<div class="rg-row"><span class="rg-t">${esc(it.title)}</span><span class="rg-p num">${schedPct(it,d.to)}%</span><div class="rg-bar">${ticksHTML(84,P(s),P(e),tn)}</div></div>`}).join("");
  return `<figure class="rpt-gantt" contenteditable="false">${axis}${body}</figure>`;
}

/* ---------- 報告內容（2026-11-06 改版：封面 → 目錄 → 各章） ----------
   版面參考使用者給的極簡白紙範例：大標題靠左、上下小字資訊、細線分隔、細體大數字當章節號。
   每一章是一張紙（列印時從新的一頁開始）：章首＝細體大數字＋章名＋右上角章節索引（I II III…，目前這章實心）。
   章裡是一個個「圖塊」：文字（段落小工具）、圖片（上傳、調大小與位置）、卡片（分項說明）、看板自動產生的內容（摘要數字、甘特圖、議題逐案）。
   編輯（加章節、加圖塊、上傳圖片、改字）都只用在這一份報告，不存進看板、不上傳（使用者決定）。 */
const RPT_IMG_W=[33,50,66,100];   /* 圖片寬度的快速選項（％，以內文寬為準）；拖曳右下角可在 25～100％ 之間調，每 5％ 一格 */
const rptBlk=(kind,inner,tools="")=>`<div class="rpt-blk" data-blk="${kind}" tabindex="-1"><div class="rpt-bt" contenteditable="false">${tools}<button type="button" data-bmv="-1" aria-label="上移">${ico("prev","solo")}</button><button type="button" data-bmv="1" aria-label="下移">${ico("next","solo")}</button><button type="button" data-bx aria-label="移除這個圖塊">移除</button></div>${inner}</div>`;
const rptTextBlk=(ph="在這裡輸入內容…",html="")=>rptBlk("text",`<div class="rpt-text" contenteditable="true" data-ph="${ph}">${html}</div>`);
const rptCardHTML=()=>`<div class="rpt-card"><button type="button" class="rpt-card-x" contenteditable="false" data-cx aria-label="移除這張卡片">${ico("close","solo")}</button><b contenteditable="true" data-ph="項目名稱"></b><div class="rpt-card-t" contenteditable="true" data-ph="說明"></div></div>`;
const rptCardsBlk=()=>rptBlk("cards",`<div class="rpt-cards" data-cols="2">${rptCardHTML()}${rptCardHTML()}</div><button type="button" class="rpt-card-add" contenteditable="false" data-cadd>＋ 卡片</button>`,
  `<button type="button" data-cols="2" class="on">兩欄</button><button type="button" data-cols="3">三欄</button>`);
const rptImgBlk=src=>rptBlk("img",`<figure class="rpt-img" data-al="c" style="--w:66%"><div class="rpt-img-box"><img src="${src}" alt=""><span class="rpt-img-h" contenteditable="false" aria-hidden="true"></span></div><figcaption contenteditable="true" data-ph="圖說（可留白）"></figcaption></figure>`,
  RPT_IMG_W.map(w=>`<button type="button" data-iw="${w}"${w===66?' class="on"':""}>${w===100?"滿版":w+"%"}</button>`).join("")+`<i class="rpt-bt-sep"></i>`+[["l","靠左"],["c","置中"],["r","靠右"]].map(([k,n])=>`<button type="button" data-ia="${k}"${k==="c"?' class="on"':""}>${n}</button>`).join(""));
const rptAuto=html=>rptBlk("auto",html);   /* 看板自動產生的內容：可以移除、排順序，字可以直接改 */
const rptCh=(k,title,blocks)=>`<section class="rpt-page rpt-sec rpt-ch" data-k="${k}">
    <header class="rpt-ch-h"><span class="rpt-ch-n num" contenteditable="false"></span><h2 contenteditable="true" data-ph="章節名稱">${esc(title)}</h2><span class="rpt-tabs" contenteditable="false" aria-hidden="true"></span>
      <span class="rpt-ct" contenteditable="false"><button type="button" data-cmv="-1" aria-label="章節上移">${ico("prev","solo")}</button><button type="button" data-cmv="1" aria-label="章節下移">${ico("next","solo")}</button><button type="button" data-chx aria-label="移除這一章">移除這章</button></span></header>
    <div class="rpt-blocks">${blocks}</div>
    <div class="rpt-ins" contenteditable="false"><span>在這章加入</span><button type="button" data-ins="text">＋ 文字</button><button type="button" data-ins="img">＋ 圖片</button><button type="button" data-ins="cards">＋ 卡片</button></div></section>`;
function rptHTML(d){
  const dept=CFG.dept.name||state.title;
  const staffJoin=ids=>staffNames(ids).join("、");
  const dot=s=>fmt(s).replaceAll("/",".");
  const cover=`<section class="rpt-page rpt-cover">
    <div class="cv-top"><div class="cv-org"><span class="cv-logo">${suLogoColor("南臺科大學生會")}</span><b contenteditable="true">${esc(dept)}</b></div><span class="cv-date num" contenteditable="true">${dot(today())}</span></div>
    <div class="cv-mid"><p class="cv-k num">WORK REPORT</p><h1 contenteditable="true">工作報告</h1><p class="cv-sub" contenteditable="true">${termCfg().yearLabel?esc(termCfg().yearLabel)+"・":""}${dot(d.from)} – ${dot(d.to)}</p></div>
    <div class="cv-foot"><div class="cv-col"><span contenteditable="true">${esc(meName())}</span><span contenteditable="true" data-ph="職稱（可留白）"></span><span contenteditable="true">南臺科技大學學生會　${esc(dept)}</span></div>
      <div class="cv-col"><span>看板即時動態</span><a class="rpt-live num" href="${esc(boardURL())}" target="_blank" rel="noopener">${esc(boardURL().replace(/^https?:\/\//,""))}</a><span class="num">製表 ${dot(today())}</span></div></div></section>`;
  const toc=`<section class="rpt-page rpt-toc"><header class="toc-h"><span class="num">CONTENTS</span><h2>目錄</h2></header><ol class="toc-list"></ol></section>`;
  const stat=(n,t,s)=>`<div><b class="num">${n}</b><span>${t}</span><small>${s}</small></div>`;
  const sum=rptCh("sum","本期摘要",rptAuto(`<div class="rpt-stats" contenteditable="true">${stat(d.issues.length,"處理議題",`完成 ${d.nDone}・進行中 ${d.nAct}`)}${stat(d.marks,"處理紀錄","期間內的議題註記")}${stat(d.evNew.length,"新增即時回報",`完成 ${d.evDone.length}・併入議題 ${d.evLinked}`)}${stat(d.weeks.length,"每週概述","期間內的週報")}</div>`)+(rptGantt(d)?rptAuto(rptGantt(d)):""));
  const issue=it=>{
    const meta=[hasDates(it)?`期間 ${fmt(it.start)} – ${fmt(it.end)}`:"",it.tags[it.cur]?`目前階段：${it.tags[it.cur]}`:"",staffJoin(it.staff)?`專員：${staffJoin(it.staff)}`:""].filter(Boolean).join("　｜　");
    const mk=sortedMarkers(it).filter(m=>!m.date||d.inP(m.date));
    const evs=state.events.filter(e=>e.issueId===it.id&&(!e.doneAt||d.inP(e.doneAt)||d.inP(e.createdAt)));
    return `<article class="rpt-issue" data-tone="hi"><h3>${esc(it.title)}<span class="rpt-st">${it.doneAt&&it.doneAt<=d.to?`已結案 ${fmt(it.doneAt)}`:`進行中・${hasDates(it)?`時程 ${schedPct(it,d.to)}%`:"未排程"}`}</span></h3>
      ${meta?`<p class="rpt-meta2">${esc(meta)}</p>`:""}<div class="rpt-prog" contenteditable="false"><i style="width:${schedPct(it,d.to)||0}%"></i></div>
      <h4>處理經過</h4>${mk.length?`<ul class="rpt-tl">${mk.map(m=>`<li><span class="rpt-d">${m.date?fmt(m.date).slice(5):"未標日期"}</span>${m.stage?`【${esc(m.stage)}】`:""}${esc(m.text||"")}</li>`).join("")}</ul>`:`<p class="rpt-none">這段期間沒有處理紀錄</p>`}
      ${it.note?`<h4>目前進度</h4><p>${esc(it.note)}</p>`:""}
      ${evs.length?`<h4>相關即時回報</h4><p>${evs.map(e=>`${esc(evName(e))}（${e.doneAt?fmt(e.doneAt).slice(5)+" 完成":"處理中"}）`).join("、")}</p>`:""}
      ${it.links.length?`<h4>相關連結</h4><p>${it.links.map(l=>`<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join("、")}</p>`:""}</article>`};
  const iss=rptCh("issues","議題處理情形",rptAuto(`<div class="rpt-body" contenteditable="true">${d.issues.map(issue).join("")||'<p class="rpt-none">這段期間沒有處理中的議題</p>'}</div>`));
  return cover+toc+sum+iss+rptCh("free","工作檢討",rptTextBlk("在這裡輸入這段期間的工作檢討…"))+rptCh("free","下期規劃",rptTextBlk("在這裡輸入下一期的規劃…"));
}
/* 空白判斷：列印時空白的圖塊、整章都空白的章不印，目錄與章節號跟著跳過 */
const rptBlank=el=>{
  const k=el.dataset.blk;if(k==="img"||k==="auto")return false;
  if(k==="cards")return ![...el.querySelectorAll(".rpt-card [contenteditable]")].some(c=>c.textContent.trim());
  return ![...el.querySelectorAll('[contenteditable="true"]')].some(c=>c.textContent.trim());   /* 只看能打字的地方，不算工具鈕上的字 */
};
/* 標出空白的圖塊與整章都空白的章（列印時不印；斷頁計算也要先標，打字之後才準） */
function rptMarkBlank(ov){
  const chs=[...ov.querySelectorAll(".rpt-ch")];
  chs.forEach(c=>{c.querySelectorAll(".rpt-blk").forEach(b=>b.classList.toggle("is-blank",rptBlank(b)));c.classList.toggle("is-blank",![...c.querySelectorAll(".rpt-blk")].some(b=>!b.classList.contains("is-blank")))});
  return chs;
}
/* 章節號、目錄、右上角的章節索引一起重算（加章、刪章、排順序、改章名、列印前） */
function rptSync(print){
  const ov=$("#rptOv");if(!ov)return;
  const chs=rptMarkBlank(ov);
  const vis=chs.filter(c=>!print||!c.classList.contains("is-blank")),R=n=>["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][n]||String(n+1);
  vis.forEach((c,i)=>{c.querySelector(".rpt-ch-n").textContent=String(i+1).padStart(2,"0");
    c.querySelector(".rpt-tabs").innerHTML=vis.map((_,j)=>`<i class="${j===i?"on":""}">${R(j)}</i>`).join("")});
  const tl=ov.querySelector(".toc-list");if(tl)tl.innerHTML=vis.map((c,i)=>`<li><span class="toc-n num">${String(i+1).padStart(2,"0")}</span><span class="toc-t"><b>${esc(c.querySelector("h2").textContent.trim()||"（未命名）")}</b><small class="num">${R(i)}</small></span></li>`).join("");
  if(!print)rptPaginateSoon();
}
/* ---------- 實際斷頁、一張一張的紙（2026-11-06 使用者：照真正的斷點分頁編輯，才知道怎麼排版） ----------
   存成 PDF 時瀏覽器照 A4 切頁（內文 182×267mm，board.css 的 @page）。這裡用同一套規則先算出每一頁從哪一塊開始，再把預覽排成一張一張的 A4：
   1. 量：紙張加 .rpt-measure（board.css，版面照列印；同一個 JS 工作裡加上又拿掉，畫面不會閃），每一章拆成「不能切開的塊」
      （統計、甘特圖、議題、圖片、整組卡片、目錄項目，以及每一段文字、清單項目、小標——列印時也設成不切開），從上往下排，放不下的那塊換到下一頁；
      章名不單獨留在頁底；比整頁還高的塊只能從頁底硬切（那種情況只畫紅色虛線）。
   2. 排：桌面上紙張就是 A4 寬，換行跟 PDF 一樣。在每個斷點的那一塊前面插一個看不見的墊塊（.rpt-sp），把它推到下一張紙的開頭；
      紙與紙之間畫一條底色的空隙（.rpt-gap），每張紙的右外側標「第 N 頁」（.rpt-pg），每章最後一張紙補到滿一張 A4 高。
      手機紙張比較窄、換行不同，只在斷點畫紅色虛線＋「第 N 頁從這裡開始」。
   3. 重算的時機：打字、加減圖塊、圖片載入、視窗大小改變、字型載入後（停 0.22 秒再算）；重算時捲動位置不動。 */
const RPT_AVOID=".rpt-stats,.rpt-gantt,.rpt-issue,.rpt-img,.rpt-cards,.toc-list li,.rpt-ch-h,.toc-h";
let rptPageH=0,rptPgT=0;
function rptPaginateSoon(){clearTimeout(rptPgT);rptPgT=setTimeout(rptPaginate,220)}
addEventListener("resize",()=>{if(rptOpen)rptPaginateSoon()});
const rptShown=el=>getComputedStyle(el).display!=="none";
const rptBlockish=el=>{const d=getComputedStyle(el).display;return d!=="none"&&d!=="contents"&&!d.startsWith("inline")};
/* 一章拆成要排的塊：{el,keep（章名：跟下一塊同頁）,top,bottom}（top／bottom 相對這張紙） */
function rptAtoms(sec,t0,k=1){
  const out=[];
  const walk=el=>{for(const c of el.children){
    if(!rptShown(c)||c.matches(".rpt-sp,.rpt-gap,.rpt-pg,.rpt-pb"))continue;

const rptMM=mm=>{const t=document.createElement("div");t.style.cssText=`position:absolute;visibility:hidden;height:${mm}mm`;document.body.append(t);const h=t.getBoundingClientRect().height;t.remove();return h};

function rptPaginate(){
  const ov=$("#rptOv"),paper=ov&&ov.querySelector(".rpt-paper");if(!paper)return;
  const sc=ov.querySelector(".rpt-scroll"),keepY=sc?sc.scrollTop:0;
  rptUnpage();const secs=[...paper.querySelectorAll(":scope>.rpt-page")];
  rptMarkBlank(ov);

        let j=i;if(j>0&&A[j-1].keep&&A[j-1].top>ps+1)j--;   /* 章名不單獨留在頁底：跟著下一塊換頁 */
        if(A[j].top<=ps+1){brs.push({el:A[j].el,hard:lim-A[j].top});ps=lim;lim+=H;i=j-1;continue}   /* 比一整頁還高：從頁底硬切 */

    brs.forEach((b,i)=>{

      sec.append(mk("rpt-gap","",sheetTop-GAP),mk("rpt-pg num",`第 ${start+i+1} 頁`,sheetTop));
      if(b.hard){sec.append(mk("rpt-pb",`<span class="num">比一整頁還長，從這裡硬切</span>`,(b.el.getBoundingClientRect().top-t0)/k+b.hard));return}
      const sp=document.createElement("div");sp.className="rpt-sp";sp.contentEditable="false";sp.setAttribute("aria-hidden","true");sp.style.height="1px";b.el.before(sp);   /* 先給 1px：高度 0 時上下段落的邊界會疊在一起，設了高度又不疊，位置會差一截 */
      const now=(b.el.getBoundingClientRect().top-sec.getBoundingClientRect().top)/k,want=sheetTop+PT,d=want-now;
      if(d>=-1)sp.style.height=(1+d).toFixed(1)+"px";else sp.style.marginTop=(d+1).toFixed(1)+"px";   /* 墊塊把這一塊推到下一張紙的開頭（格線的間距算在裡面，多出來就用負的上邊界抵掉） */
    });
    sec.style.aspectRatio="auto";sec.style.minHeight=((brs.length+1)*(A4+GAP)-GAP).toFixed(1)+"px";   /* 最後一張紙補到滿一張 A4。aspect-ratio 要先關掉：不然最小高度會照 A4 比例把寬度一起撐大 */
  });

  if(sc)sc.scrollTop=keepY;
}

function openReport(from,to,doc){

  document.body.insertAdjacentHTML("beforeend",`<div class="rpt-ov" id="rptOv" role="dialog" aria-modal="true" aria-label="${L}預覽">
    <div class="anim-top rpt-bar"><div class="anim-title"><span class="anim-k">${doc?doc.k:"REPORT"}</span><b>${L}預覽</b><span class="sub rpt-hint">文字都可以直接點開修改・每一張紙就是 PDF 的一頁・空白的圖塊與章節不會印出來・不會存進看板</span><span class="rpt-pages num" id="rptPages" aria-live="polite"></span></div>
      <div class="anim-ctl"><button type="button" id="rptAdd">＋ 章節</button><button type="button" class="primary" id="rptPrint">${ico("download")}存成 PDF</button><button type="button" id="rptClose" aria-label="關閉${L}">${ico("close")}關閉</button></div></div>
    <div class="rpt-scroll"><article class="rpt-paper" spellcheck="false">${doc?doc.html:rptHTML(rptData(from,to))}</article></div></div>`);

  ov.addEventListener("input",rptPaginateSoon);ov.addEventListener("load",rptPaginateSoon,true);
  document.fonts&&document.fonts.ready.then(rptPaginateSoon);

  ov.addEventListener("paste",e=>{const t=e.clipboardData&&e.clipboardData.getData("text/plain");if(t==null||!e.target.closest('[contenteditable="true"]'))return;e.preventDefault();document.execCommand("insertText",false,t)});

function closeReport(instant){

/* 新加的東西淡入、移除的淡出（只動 transform／opacity） */
const rptIn=el=>{if(!reduceMotion())el.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:MO.base,easing:MO.out})};
const rptOut=(el,then)=>{if(reduceMotion()){el.remove();then&&then();return}el.animate([{opacity:1},{opacity:0,transform:"translateY(-6px) scale(.98)"}],{duration:MO.fast,easing:MO.in}).onfinish=()=>{el.remove();then&&then()}};
/* 位置互換時用 FLIP 滑過去 */
function rptSwap(el,dir){
  const sib=dir<0?el.previousElementSibling:el.nextElementSibling;if(!sib||!sib.matches(el.classList.contains("rpt-ch")?".rpt-ch":".rpt-blk"))return;
  const a=el.getBoundingClientRect().top,b=sib.getBoundingClientRect().top;

  [[el,a],[sib,b]].forEach(([x,t])=>{const d=t-x.getBoundingClientRect().top;if(d)x.animate([{transform:`translateY(${d}px)`},{transform:"none"}],{duration:MO.slow,easing:MO.out})});

/* 上傳圖片：讀成 data URL（只在這份報告裡，不上傳）；太大的先縮到長邊 2000px，列印不會太重 */
function rptPickImg(ch){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.hidden=true;document.body.append(inp);
  inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
    const url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      const src=c.toDataURL(/png|gif|webp/.test(f.type)?"image/png":"image/jpeg",.88);
      ch.querySelector(".rpt-blocks").insertAdjacentHTML("beforeend",rptImgBlk(src));const b=ch.querySelector(".rpt-blocks").lastElementChild;rptIn(b);rptSync();b.focus({preventScroll:true})};
    im.onerror=()=>{URL.revokeObjectURL(url);toast("這個檔案讀不出圖片")};im.src=url};
  inp.click();
}
/* 圖片寬度：拖曳右下角（25～100％，每 5％ 一格，不會超出內文寬；高度另有上限，見 CSS 的 .rpt-img img） */
function rptImgDrag(h,e){
  const fig=h.closest(".rpt-img"),col=fig.parentElement.getBoundingClientRect().width,box=h.parentElement.getBoundingClientRect(),x0=e.clientX,w0=box.width,al=fig.dataset.al;

  const mv=ev=>{const w=Math.max(25,Math.min(100,Math.round((w0+(ev.clientX-x0)*k)/col*20)*5));fig.style.setProperty("--w",w+"%");fig.closest(".rpt-blk").querySelectorAll("[data-iw]").forEach(b=>b.classList.toggle("on",+b.dataset.iw===w))};

function rptBind(ov){
  ov.addEventListener("click",e=>{
    const t=e.target,ch=t.closest(".rpt-ch"),blk=t.closest(".rpt-blk");
    const ins=t.closest("[data-ins]");if(ins&&ch){const k=ins.dataset.ins;if(k==="img"){rptPickImg(ch);return}
      ch.querySelector(".rpt-blocks").insertAdjacentHTML("beforeend",k==="cards"?rptCardsBlk():rptTextBlk());const b=ch.querySelector(".rpt-blocks").lastElementChild;rptIn(b);rptSync();

    const iw=t.closest("[data-iw]");if(iw&&blk){blk.querySelector(".rpt-img").style.setProperty("--w",iw.dataset.iw+"%");blk.querySelectorAll("[data-iw]").forEach(b=>b.classList.toggle("on",b===iw));return}
    const ia=t.closest("[data-ia]");if(ia&&blk){blk.querySelector(".rpt-img").dataset.al=ia.dataset.ia;blk.querySelectorAll("[data-ia]").forEach(b=>b.classList.toggle("on",b===ia));return}
    const co=t.closest("[data-cols]");if(co&&blk&&co.tagName==="BUTTON"){blk.querySelector(".rpt-cards").dataset.cols=co.dataset.cols;blk.querySelectorAll("button[data-cols]").forEach(b=>b.classList.toggle("on",b===co));return}

/* ---------- 段落小工具（自訂區塊：工作檢討、下期規劃、新區塊） ----------
   游標在自訂區塊裡時，那一段左邊（手機在區塊下方）浮出三個小鈕：大段（（一）自動編號）、小段（1. 自動編號）、內文。
   游標在這段最後面＝在下面換一個新段落；在段落中間或這段是空的＝把這段改成那一層。編號由 CSS counter 自動排。
   縮排：每一段的左邊對齊它所屬那一層標題的「文字起點」（編號凸出在左邊），不是整份文件的最左邊。
   由 indent() 依前面最近的標題標 data-in：a＝大段之下、b＝小段之下（前面沒有大段）、ab＝大段裡的小段之下；寬度在 CSS 的 --rw1／--rw2。 */
const RPT_LV={h1:{tag:"H3",cls:"rpt-h1",name:"大段"},h2:{tag:"H4",cls:"rpt-h2",name:"小段"},p:{tag:"P",cls:"",name:"內文"}};
function rptParaTool(ov){
  const pt=document.createElement("div");pt.className="rpt-pt";pt.contentEditable="false";pt.hidden=true;
  pt.innerHTML=Object.entries(RPT_LV).map(([k,v])=>`<button type="button" data-lv="${k}">${v.name}</button>`).join("");
  /* 把區塊裡的純文字、瀏覽器自己產生的 <div>／<br> 整理成一段一個 <p> */
  const tidy=box=>{
    if(!box.textContent.trim()&&!box.querySelector("h3,h4")){box.innerHTML="";return}
    [...box.childNodes].forEach(n=>{
      if(n.nodeType===3){if(!n.textContent.trim()){n.remove();return}const q=document.createElement("p");n.replaceWith(q);q.append(n)}
      else if(n.nodeName==="DIV"||n.nodeName==="BR"){const q=document.createElement("p");if(n.nodeName==="DIV")q.append(...n.childNodes);n.replaceWith(q);if(!q.firstChild)q.append(document.createElement("br"))}
    });
    indent(box);
  };
  const indent=box=>{let h1=false,h2=false;
    [...box.children].forEach(n=>{
      if(n.classList.contains("rpt-h1")){h1=true;h2=false;n.removeAttribute("data-in");return}
      if(n.classList.contains("rpt-h2"))h2=true;
      const v=(h1?"a":"")+(h2?"b":"");if(v)n.dataset.in=v;else n.removeAttribute("data-in");
    })};
  const blockOf=(box,node)=>{while(node&&node.parentNode!==box)node=node.parentNode;return node&&node.nodeType===1?node:null};
  const caretIn=()=>{const sel=getSelection();if(!sel.rangeCount)return null;const n=sel.anchorNode,box=n&&(n.nodeType===1?n:n.parentNode).closest(".rpt-text");return box&&ov.contains(box)?{box,sel}:null};
  const place=()=>{
    const c=caretIn();if(!c){pt.hidden=true;return}
    const sec=c.box.closest(".rpt-sec"),blk=blockOf(c.box,c.sel.anchorNode)||c.box;
    if(pt.parentNode!==sec)sec.append(pt);
    pt.hidden=false;pt.style.setProperty("--y",(blk.getBoundingClientRect().top-sec.getBoundingClientRect().top)+"px");
    const cur=blk===c.box?"p":(blk.classList.contains("rpt-h1")?"h1":blk.classList.contains("rpt-h2")?"h2":"p");
    pt.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.lv===cur));
  };
  const make=lv=>{const v=RPT_LV[lv],el=document.createElement(v.tag);if(v.cls)el.className=v.cls;return el};
  const caretTo=(el,atEnd)=>{const r=document.createRange();r.selectNodeContents(el);r.collapse(!atEnd);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)};
  /* 按鈕不搶走游標 */
  pt.addEventListener("pointerdown",e=>e.preventDefault());
  pt.addEventListener("click",e=>{
    const b=e.target.closest("[data-lv]");if(!b)return;const c=caretIn();if(!c)return;
    const {box,sel}=c;tidy(box);
    let blk=blockOf(box,sel.anchorNode);
    if(!blk){blk=document.createElement("p");blk.append(document.createElement("br"));box.append(blk)}
    const r=sel.getRangeAt(0),tail=document.createRange();tail.selectNodeContents(blk);tail.setStart(r.endContainer,r.endOffset);
    const atEnd=!tail.toString().length,empty=!blk.textContent.trim(),lv=b.dataset.lv,el=make(lv);
    if(empty||!atEnd){el.append(...blk.childNodes);if(!el.firstChild)el.append(document.createElement("br"));blk.replaceWith(el);caretTo(el,true)}   /* 改這段的層級 */
    else{el.append(document.createElement("br"));blk.after(el);caretTo(el,false)}                                          /* 換新段落 */
    indent(box);
    if(!reduceMotion())el.animate([{opacity:0,transform:"translateY(-3px)"},{opacity:1,transform:"none"}],{duration:220,easing:"cubic-bezier(.2,.9,.25,1)"});
    b.animate([{transform:"scale(.92)"},{transform:"none"}],{duration:200,easing:"cubic-bezier(.3,1.6,.5,1)"});
    place();
  });
  /* 區塊裡按 Enter 一律產生 <p>；整段刪光時清空，讓提示字回來、列印時跳過 */
  ov.addEventListener("focusin",e=>{if(e.target.closest(".rpt-text")){try{document.execCommand("defaultParagraphSeparator",false,"p")}catch(_){}tidy(e.target.closest(".rpt-text"))}});
  ov.addEventListener("input",e=>{const box=e.target.closest&&e.target.closest(".rpt-text");if(!box)return;if(!box.textContent.trim()&&!box.querySelector("h3,h4"))box.innerHTML="";else indent(box)});
  ov.addEventListener("focusout",e=>{const box=e.target.closest(".rpt-text");if(box)tidy(box);setTimeout(()=>{if(!caretIn())pt.hidden=true},0)});
  document.addEventListener("selectionchange",place);
  ov.querySelector(".rpt-scroll").addEventListener("scroll",place,{passive:true});
  ov._paraOff=()=>document.removeEventListener("selectionchange",place);
}
/* 列印：只印報告本身；PDF 的預設檔名用報告名稱 */
function rptPrint(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

<script>
/* 核心｜會長室的「追蹤」面板（設定檔 follow:true 的部門才有）
   follows[]：{id,dept,kind,ref}；kind＝live 即時回報／issue 議題進度／done 完成紀錄／week 週報（ref:"latest"＝永遠最新一份）
   其他部門的資料只讀：先用 GitHub 讀（有權杖時最新），不行再讀網站上的檔案；每 5 分鐘、回到分頁時重新整理。
   02D D-b：已切到新資料庫（source:"firestore"）的部門改讀 Firestore（store.js 的 storeDeptData；要登入），還沒切換的照舊讀資料檔。
   會長室追蹤、秘書處會議的授權、通知「全會」、讀秘書處學年設定都經過這裡 */
const FW_KIND={live:"即時回報",issue:"進度",done:"完成紀錄",week:"週報"};
const fwCache=new Map();   /* dept id → {at,data|null,err} */
const fwDept=id=>(window.BOARD_DEPTS||[]).find(d=>d.id===id);
async function fwLoad(id,force){
  const c=fwCache.get(id);if(c&&!force&&Date.now()-c.at<3e5)return c;
  const d=fwDept(id);if(!d)return {at:Date.now(),data:null,err:"沒有這個部門"};
  let data=null,err="";
  if(deptSourceOf(id)==="firestore"){try{data=await storeDeptData(id)}catch(e){err=STORE_XERR(e)}}
  else try{
    const cc=cloudCfg(),tok=ghToken();
    if(cc.owner&&cc.repo&&tok){const r=await fetch(apiURL({...cc,path:d.path})+`?ref=${encodeURIComponent(cc.branch)}`,{headers:{Accept:"application/vnd.github.raw+json",Authorization:"Bearer "+tok},cache:"no-store"});if(r.ok)data=await r.json();else if(r.status===404)err="這個部門還沒有資料"}
    if(!data&&!err&&location.protocol!=="file:"){const r=await fetch(d.path,{cache:"no-cache"});if(r.ok)data=await r.json();else err="這個部門還沒有資料"}
  }catch(_){err="讀不到這個部門的資料"}
  if(data)data=normalize(data);
  const v={at:data?Date.now():Date.now()-3e5+3e4,data,err:data?"":(err||"讀不到這個部門的資料")};fwCache.set(id,v);return v;   /* 讀不到的 30 秒後再試（不是 5 分鐘） */
}
/* 某部門某類別可以選的項目 → [[ref,顯示文字],…] */
function fwOptions(d,kind){
  if(kind==="live")return d.events.filter(e=>!e.doneAt).map(e=>[e.id,e.name]);
  if(kind==="issue")return d.issues.filter(i=>!i.doneAt).map(i=>[i.id,i.title]);
  if(kind==="done")return [...d.issues.filter(i=>i.doneAt).map(i=>[i.id,`${i.title}（議題 ${fmt(i.doneAt)}）`,i.doneAt]),...d.events.filter(e=>e.doneAt).map(e=>[e.id,`${evName(e)}（即時回報 ${fmt(e.doneAt)}）`,e.doneAt])].sort((a,b)=>b[2].localeCompare(a[2])).slice(0,60).map(([a,b])=>[a,b]);
  if(kind==="week")return [["latest","（永遠顯示最新一份）"],...[...d.weeks].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>[w.id,`${fmt(w.date)} 的週報`])];
  return [];
}
/* 一筆追蹤的內容（找不到時說明原因） */
function fwBody(f,d){
  const miss=t=>({title:t,html:`<p class="sub">原本追蹤的項目已經被刪除或搬走。</p>`,gone:true});
  if(f.kind==="live"||(f.kind==="done"&&d.events.some(e=>e.id===f.ref))){
    const e=d.events.find(x=>x.id===f.ref);if(!e)return miss("（找不到）");
    const st=e.doneAt?"":evStatus(e);
    return {title:evName(e),dot:st||"done",html:`<p class="fw-meta">${e.doneAt?`已完成 ${fmt(e.doneAt)}`:EV_ST[st]}${e.round>1&&!e.doneAt?` · 第 ${e.round} 段`:""}${e.touchedAt?` · 最後更新 ${fmt(e.touchedAt).slice(5)}`:""}</p>${e.desc?`<p class="fw-text">${esc(e.desc)}</p>`:""}`};
  }
  if(f.kind==="issue"||f.kind==="done"){
    const i=d.issues.find(x=>x.id===f.ref);if(!i)return miss("（找不到）");
    const mk=sortedMarkers(i)[0];
    return {title:i.title,dot:i.doneAt?"done":"issue",html:`<p class="fw-meta">${i.doneAt?`已結案 ${fmt(i.doneAt)}`:`${esc(i.tags[i.cur]||"")}${i.tags[i.cur]?" · ":""}${schedLabel(i)}`}</p>
      ${hasDates(i)?`<div class="fw-bar">${ticksHTML(48,0,100,(pd(today())-pd(i.start))/Math.max(1,pd(i.end)-pd(i.start))*100)}</div>`:""}${i.note?`<p class="fw-text">${esc(i.note)}</p>`:""}${mk?`<p class="sub fw-mk">${mk.date?fmt(mk.date).slice(5)+" ":""}${esc(mk.text)}</p>`:""}`};
  }
  if(f.kind==="week"){
    const ws=[...d.weeks].sort((a,b)=>b.date.localeCompare(a.date)),w=f.ref==="latest"?ws[0]:ws.find(x=>x.id===f.ref);
    if(!w)return f.ref==="latest"?{title:"最新週報",html:`<p class="sub">這個部門還沒有週報。</p>`}:miss("（找不到）");
    return {title:`${fmt(w.date)} 的週報${f.ref==="latest"?"（最新）":""}`,dot:"week",html:`<pre class="fw-week">${esc(w.text||"")}</pre>`};
  }
  return miss("（不支援的類別）");
}
function renderFollows(){
  const panel=$("#followPanel");if(!panel)return;
  panel.hidden=!CFG.follow;if(!CFG.follow)return;
  const fs=state.follows||[];
  $("#follows").innerHTML=fs.map(f=>{
    const dp=fwDept(f.dept),c=fwCache.get(f.dept);
    const b=!c?{title:"讀取中…",html:""}:c.data?fwBody(f,c.data):{title:"（讀不到）",html:`<p class="sub">${esc(c.err)}</p>`};
    return `<article class="fw${b.gone?" gone":""}" data-fw="${esc(f.id)}" data-dot="${esc(b.dot)}">
      <div class="fw-top"><span class="tag sm">${esc(dp?dp.name:f.dept)}</span><span class="fw-k">${FW_KIND[f.kind]||""}</span>${dp?`<a class="fw-open" href="?d=${encodeURIComponent(dp.id)}" target="_blank" rel="noopener">開啟看板 →</a>`:""}<button type="button" class="icon danger edit-only" data-fwdel aria-label="不再追蹤">移除</button></div>
      <h3 class="fw-t">${esc(b.title)}</h3>${b.html}</article>`}).join("")
    ||`<p class="empty">還沒有追蹤任何項目。登入後按這區的「編輯」→「+ 追蹤項目」，選部門和要看的即時回報、進度、完成紀錄或週報。</p>`;
  /* 需要的部門資料還沒讀過就去讀，讀完再畫一次 */
  const need=[...new Set(fs.map(f=>f.dept))].filter(id=>!fwCache.has(id));
  if(need.length)Promise.all(need.map(id=>fwLoad(id))).then(renderFollows);
}
async function addFollow(){
  const depts=(window.BOARD_DEPTS||[]).filter(d=>d.id!==CFG.deptId);
  const v=await ask("追蹤項目",[{name:"dept",label:"部門",type:"select",value:depts[0]&&depts[0].id,options:depts.map(d=>[d.id,d.name])},
    {name:"kind",label:"要追蹤的是",type:"select",value:"live",options:Object.entries(FW_KIND)}]);
  if(!v)return;
  const c=await fwLoad(v.dept,true);
  if(!c.data){toast(c.err);return}
  const opts=fwOptions(c.data,v.kind);
  if(!opts.length){toast(`${fwDept(v.dept).name}目前沒有可以追蹤的${FW_KIND[v.kind]}`);return}
  const w=await ask(`選擇${fwDept(v.dept).name}的${FW_KIND[v.kind]}`,[{name:"ref",label:"項目",type:"select",value:opts[0][0],options:opts}]);
  if(!w)return;
  if((state.follows||[]).some(f=>f.dept===v.dept&&f.kind===v.kind&&f.ref===w.ref)){toast("已經在追蹤了");return}
  state.follows.push({id:uid("f"),dept:v.dept,kind:v.kind,ref:w.ref});changed();
}
document.addEventListener("click",async e=>{
  const t=e.target;if(!t.closest)return;
  if(t.closest("#addFollow")){if(secEd("follow"))await addFollow();return}
  const del=t.closest("[data-fwdel]");
  if(del&&secEd("follow")){const id=del.closest("[data-fw]").dataset.fw;state.follows=state.follows.filter(f=>f.id!==id);changed();return}
});
if(CFG.follow){
  const refresh=()=>{fwCache.clear();renderFollows()};
  setInterval(refresh,3e5);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
}

/* ---------- 會長室：文件（2026-11-06 使用者：會長平常有些文件要放在這裡開啟比較方便看） ----------
   state.docs[]＝{id,name,url}。平常是一排膠囊按鈕（點了用新分頁打開）；按這區的「編輯」後每個按鈕旁邊有修改、上下移、刪除，下面「+ 新增文件」。
   新增、修改用對話框（名稱、網址；沒寫 http 的自動補 https://），按這張卡片的「儲存」才上傳。網址存在公開的資料檔，任何人都看得到 */
const docsEd=()=>editing&&cardEdit==="s:docs";
const docURL=u=>{u=String(u||"").trim();if(!u)return "";return /^[a-z][a-z0-9+.-]*:/i.test(u)?u:"https://"+u};
function renderDocs(){
  const p=$("#docsPanel");if(!p)return;p.hidden=!CFG.follow;if(!CFG.follow)return;
  const ds=state.docs||[],ed=docsEd();
  $("#docsList").innerHTML=ds.map((d,i)=>ed
    ?`<div class="doc-ed" data-doc="${esc(d.id)}"><span class="doc-pill">${ico("doc")}<b>${esc(d.name)}</b></span><small class="doc-u">${esc(d.url)}</small>
       <span class="doc-tools"><button type="button" class="icon" data-docedit>修改</button><button type="button" class="icon" data-docmove="-1" aria-label="往前移"${i?"":" disabled"}>↑</button><button type="button" class="icon" data-docmove="1" aria-label="往後移"${i<ds.length-1?"":" disabled"}>↓</button><button type="button" class="icon danger" data-docdel aria-label="刪除「${esc(d.name)}」">刪除</button></span></div>`
    :`<a class="doc-pill" data-doc="${esc(d.id)}" href="${esc(docURL(d.url))}" target="_blank" rel="noopener">${ico("doc")}<b>${esc(d.name)}</b><span class="doc-go" aria-hidden="true">↗</span></a>`).join("")
    ||`<p class="empty">還沒有文件。登入後按這區的「編輯」→「+ 新增文件」，貼上文件的網址（例如 Google 雲端硬碟的連結）。</p>`;
}
async function docAsk(d){
  const v=await ask(d?"修改文件":"新增文件",[{name:"name",label:"名稱（按鈕上的字）",value:d?d.name:""},{name:"url",label:"網址",value:d?d.url:""}],
    {note:"網址存在公開的資料檔，任何人都看得到；有權限設定的文件（例如 Google 雲端硬碟）照舊要有權限才打得開。",
     validate:o=>!(o.name||"").trim()?"請填名稱":!(o.url||"").trim()?"請填網址":""});
  return v&&v!=="alt"?{name:v.name.trim(),url:docURL(v.url)}:null;
}
document.addEventListener("click",async e=>{
  const t=e.target;if(!t.closest||!CFG.follow)return;
  if(t.closest("#addDoc")){if(!docsEd())return;const v=await docAsk(null);if(!v)return;state.docs.push({id:uid("d"),...v});dirty=true;render();return}
  const row=t.closest("#docsList [data-doc]");if(!row||!docsEd())return;
  const i=state.docs.findIndex(d=>d.id===row.dataset.doc);if(i<0)return;
  if(t.closest("[data-docedit]")){const v=await docAsk(state.docs[i]);if(!v)return;Object.assign(state.docs[i],v);dirty=true;render();return}
  const mv=t.closest("[data-docmove]");if(mv){const j=i+(+mv.dataset.docmove);if(j<0||j>=state.docs.length)return;const [x]=state.docs.splice(i,1);state.docs.splice(j,0,x);dirty=true;render();return}
  if(t.closest("[data-docdel]")){const ok=await ask(`刪除「${state.docs[i].name}」`,[],{danger:"刪除",note:"只會拿掉這個按鈕，文件本身不會被刪除。"});if(ok!=="delete")return;state.docs.splice(i,1);dirty=true;render()}
});

</script>
<script>
/* 核心｜通知層（頁首鈴鐺）：搜尋＋今日／明日＋近期（智慧堆疊）＋海報月曆（2026-11-05 重新設計，交接說明四十二）
   - 跟設定頁同一類的全畫面層（.set-ov），開關用換頁動畫，返回鍵／手勢、Esc、點下方分頁都會關。
   - 事件只有即時回報上記錄的時間標記（ev.times；未完成的即時回報）。時段（有結束日）算頭到尾的每一天。
     議題的開始／結束日、議題註記不再列進來。不推播，只在看板裡顯示。
   - 本部門／全會切換：全會＝讀各部門的資料檔（跟會長室追蹤同一種讀法 fwLoad，只讀不寫）。
     注意：各部門資料檔放在公開 repo 時，任何人本來就讀得到；這裡沒有多公開任何東西。
   - 版面（由上到下）：範圍切換＋搜尋欄（.noti-bar，sticky，不跟著重畫）→ 今日／明日兩張卡片 → 近期（智慧堆疊）→ 行事曆（事件清單＋海報月曆）。
   - 顏色：本部門＝即時回報的狀態色（綠／黃／紅）；全會＝部門色。 */
let notiOpen=false,notiSeg=null;
const NOTI={scope:"mine",month:null,day:null,all:null,loading:false,q:""};
const DEPT_COLORS=["#e0342a","#0a5baa","#f0bc23","#2f8f84","#a24fc0","#d84f92","#c26a12","#3d7fe0","#6b6b75"];
const deptColor=id=>DEPT_COLORS[Math.max(0,(window.BOARD_DEPTS||[]).findIndex(d=>d.id===id))%DEPT_COLORS.length];
const NOTI_ST={ok:"var(--st-ok)",go:"var(--st-go)",stall:"var(--st-stall)"};
const WD="日一二三四五六";
/* 一份看板資料 → 事件清單 {key,date,end,time,title,place,ev,st,dept}（只有未完成即時回報的時間標記） */
function notiItems(s,dept){
  const out=[];
  s.events.filter(e=>!e.doneAt).forEach(e=>{const st=evStatus(e);(e.times||[]).forEach(t=>{
    const d=t.start.slice(0,10),en=(t.end||"").slice(0,10);
    out.push({key:`${dept}:t:${t.id}`,date:d,end:en&&en>d?en:"",time:t.start.slice(11,16),title:t.label||"（未命名）",place:t.place||"",ev:e.name||"",st,dept})})});
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const notiMine=()=>notiItems(state,CFG.deptId||"rights");
const notiList=()=>NOTI.scope==="all"&&NOTI.all?NOTI.all:notiMine();
/* 某一天有這件事：單日＝那天；時段＝頭到尾每一天 */
const covers=(x,d)=>x.end?d>=x.date&&d<=x.end:x.date===d;
const itemColor=x=>NOTI.scope==="all"?deptColor(x.dept):NOTI_ST[x.st]||"var(--ink)";
const nmd=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`;
const deptName=id=>{const d=fwDept(id);return d?d.name:id};
/* 出處文字：地點・所屬即時回報（全會再加部門） */
const notiSub=x=>[NOTI.scope==="all"?deptName(x.dept):"",x.place,x.ev].filter(Boolean).join("・");
/* 頁首鈴鐺上的數字：今天＋明天本部門的時間標記（時段算每一天，同一件事只算一次） */
function notiBadge(){
  const b=$("#notiBtn");if(!b)return;
  const t=today(),m=addDays(t,1),n=notiMine().filter(x=>covers(x,t)||covers(x,m)).length;
  const el=b.querySelector(".noti-n");const txt=n?String(n>99?"99+":n):"";
  if(el.textContent!==txt){el.textContent=txt;el.hidden=!n;if(n)Anim.enter(el,"pop")}
  b.setAttribute("aria-label",n?`通知：今明兩天有 ${n} 件事`:"通知");
}

/* ---------- 今日／明日：左右兩張卡片（手機也並排） ---------- */
/* 卡片裡一列的時間欄：當天開始的寫時刻（沒有就「整天」），時段寫「第 k／N 天」 */
function dayWhen(x,d){
  if(!x.end)return x.time||"整天";
  const k=Math.round((pd(d)-pd(x.date))/864e5)+1,n=Math.round((pd(x.end)-pd(x.date))/864e5)+1;
  return k===1&&x.time?x.time:`${k}／${n} 天`;
}
function dayCardHTML(d,lab,cls,list){
  const xs=list.filter(x=>covers(x,d)),MAX=4;
  /* 今日卡片：在「整理」裡右滑（今天處理）的事件不在卡片上列，只寫件數；點今日卡片＝卡片放大成全螢幕的「今日」層（openToday）才列出來 */
  const pk=cls==="today"?triPicked(list):[];
  return `<button type="button" class="nd-card${cls?" "+cls:""}" data-nopen="${esc(d)}" aria-label="${esc(lab)} ${esc(fmt(d))}，${xs.length} 件事，${cls==="today"?"打開今日":"打開這一天"}">
    <span class="nd-head"><span class="nd-num num">${+d.slice(8)}</span><span class="nd-lab"><b>${lab}<i>・</i>週${WD[pd(d).getDay()]}</b><small class="num">${xs.length?`${xs.length} 件`:nmd(d)}</small></span></span>
    ${xs.length?`<span class="nd-list">${xs.slice(0,MAX).map(x=>`<span class="nd-row" style="--c:${itemColor(x)}"><span class="nd-t num">${dayWhen(x,d)}</span><span class="nd-x"><b>${esc(x.title)}</b>${notiSub(x)?`<small>${esc(notiSub(x))}</small>`:""}</span></span>`).join("")}${xs.length>MAX?`<span class="nd-more">還有 ${xs.length-MAX} 件</span>`:""}</span>`
      :(pk.length?"":`<span class="nd-empty"><i aria-hidden="true"></i>沒有安排</span>`)}
    ${pk.length?`<span class="nd-pick"><i aria-hidden="true"></i><small>今天處理</small><b class="num">${pk.length}</b><small>件</small></span>`:""}
  </button>`;
}

/* ---------- 行事曆：事件清單＋海報月曆 ---------- */
/* 海報月曆：超大月份縮寫＋右上兩行年份；週一開頭；日期是數字（沒有格線）；
   2026-11-05 使用者：月曆上不寫字，看幾條線就知道幾件事——時段＝細線橫跨期間（兩端小圓點）、單天＝日期下一顆小點；
   同一週會撞在一起的往下排一層（每層 9px）。點日期才在月曆上方的「這一天」區塊顯示事件的文字 */
const MON_EN=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function posterHTML(list){
  const m=NOTI.month,first=pd(m+"-01"),y=first.getFullYear(),mi=first.getMonth(),dim=new Date(y,mi+1,0).getDate(),off=(first.getDay()+6)%7;
  const t=today(),ds=n=>`${m}-${pad(n)}`,all=NOTI.scope==="all";
  const weeks=[];for(let n=1-off;n<=dim;n+=7)weeks.push(Array.from({length:7},(_,i)=>n+i));
  const body=weeks.map(w=>{
    const lo=Math.max(1,w[0]),hi=Math.min(dim,w[6]),a=ds(lo),b=ds(hi);
    const nums=w.map(n=>{if(n<1||n>dim)return `<span class="pc-d pc-pad" aria-hidden="true"></span>`;const d=ds(n),c=list.filter(x=>covers(x,d)).length;
      return `<button type="button" class="pc-d${d===t?" is-today":""}${d===NOTI.day?" sel":""}${c?" has":""}" data-cal="${d}" aria-label="${fmt(d)}${c?`，${c} 件事`:""}"${d===NOTI.day?' aria-pressed="true"':""}><span class="pc-n num">${n}</span></button>`}).join("");
    const lanes=[];
    const evs=list.filter(x=>x.date<=b&&(x.end||x.date)>=a).map(x=>{
      const s=x.date<a?lo:+x.date.slice(8),e=(x.end||x.date)>b?hi:+(x.end||x.date).slice(8),i0=w.indexOf(s),i1=w.indexOf(e);
      let ln=lanes.findIndex(z=>z<i0);if(ln<0){ln=lanes.length;lanes.push(-1)}lanes[ln]=i1;
      return `<span class="pc-e${i1>i0?" span":""}" aria-hidden="true" style="--i0:${i0};--i1:${i1};--ln:${ln};--c:${all?deptColor(x.dept):"var(--ink)"}"></span>`}).join("");
    return `<div class="pc-week" style="--lanes:${lanes.length}">${nums}${evs}</div>`}).join("");

/* 彈簧曲線取樣（質量 1、阻尼比 z、勁度 k）：回傳 0→1 的進度（會超過 1 再回來＝Q 彈）與總時間，拿來產生 Web Animations 的關鍵影格 */

<script>
/* 核心｜會長室「各部門編輯量」曲線（2026-11-05，使用者要求；只在 follow:true 的看板＝會長室）
   - 02D：會長室切到 firestore 模式後改讀新資料庫的版本歷史與稽核紀錄（actLoadFs）；下面是 github 模式（不變）。
   - 資料：GitHub 上各部門資料檔的存檔紀錄（commits，編輯紀錄頁讀的同一份；只算帶 Board-Log: 1 的）。不新增任何儲存。
     每次存檔算「改了幾項」：標題「〔名字〕更新 N 項：…」＝N；「存檔（沒有內容變更）」＝0；其他單項（「〔名字〕即時回報｜新增｜…」等）＝1。
   - 範圍：最近 7 天（168 個小時，到現在這一個小時為止），以小時為單位統計，每個部門一條平滑曲線（單調三次插值，不會畫到 0 以下）。
   - 讀取：有權杖時帶權杖（每 5 分鐘、回到分頁時更新）；沒有權杖用公開讀取（GitHub 每小時 60 次，所以 15 分鐘才更新一次）。
     repo 是公開的話，這些存檔紀錄本來任何人都看得到；這裡沒有多公開任何東西。
   - 互動：滑過（手機按住左右拖）＝直線游標＋各曲線上的點＋黑色小標籤列出那個小時各部門的數字；點圖例＝只看那個部門（再點一次取消）。 */
const ACT={at:0,busy:false,again:false,rows:null,err:"",focus:null,idx:null,start:0,ro:null};
const ACT_H=168,HOUR=36e5;
/* 一則 commit 訊息 → 改了幾項（不是看板存的回傳 null） */
function actCount(msg){
  if(!/(^|\n)Board-Log:\s*1\s*$/m.test(msg||""))return null;
  const s=msg.split("\n")[0];if(/存檔（沒有內容變更）/.test(s))return 0;
  const m=s.match(/更新 (\d+) 項/);return m?+m[1]:1;
}
async function actFetch(d,since){
  const c=cloudCfg(),h={Accept:"application/vnd.github+json"};if(ghToken())h.Authorization="Bearer "+ghToken();
  const out=[];
  for(let page=1;page<=5;page++){
    const url=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/commits?path=${encodeURIComponent(d.path)}&sha=${encodeURIComponent(c.branch)}&since=${encodeURIComponent(new Date(since).toISOString())}&per_page=100&page=${page}`;
    const r=await fetch(url,{headers:h,cache:"no-store"});
    if(!r.ok)throw r.status;
    const arr=await r.json();
    arr.forEach(x=>{const n=actCount(x.commit&&x.commit.message);const t=Date.parse((x.commit&&(x.commit.author||x.commit.committer)||{}).date);if(n!=null&&t)out.push({t,n})});
    if(arr.length<100)break;
  }
  return out;
}
async function actLoad(force){
  if(!CFG.follow)return;
  if(ACT.busy){if(force&&fsMode())ACT.again=true;return}   /* firestore 模式：讀取中登入狀態或角色變了，讀完再讀一次 */
  if(fsMode())return actLoadFs(force);
  const ttl=ghToken()?3e5:9e5;if(!force&&ACT.rows&&Date.now()-ACT.at<ttl)return;
  if(!cloudOn()){ACT.err="這個看板沒有連上 GitHub，看不到各部門的存檔紀錄。";ACT.rows=null;ACT.at=Date.now();renderActivity();return}
  ACT.busy=true;renderActivity();
  const now=new Date();now.setMinutes(0,0,0);const start=now.getTime()+HOUR-ACT_H*HOUR;   /* 最後一格＝現在這一個小時 */
  const ds=window.BOARD_DEPTS||[];let err="";
  const res=await Promise.all(ds.map(d=>actFetch(d,start).catch(s=>{err=s===403?"GitHub 讀取次數暫時用完，請過一陣子再試（有權杖的裝置不受限制）":s===404?"找不到 repo":"有部門讀取失敗";return null})));
  actSet(ds,res,start,err);
}
/* res[i]＝第 i 個部門的 [{t,n}]，null＝讀不到（圖例顯示「—」） */
function actSet(ds,res,start,err){
  ACT.start=start;ACT.rows=ds.map((d,i)=>{const v=new Array(ACT_H).fill(0);(res[i]||[]).forEach(x=>{const k=Math.floor((x.t-start)/HOUR);if(k>=0&&k<ACT_H)v[k]+=x.n});return {id:d.id,name:d.name,v,sum:v.reduce((a,b)=>a+b,0),fail:!res[i]}});
  ACT.err=err;ACT.at=Date.now();ACT.busy=false;renderActivity();
}
/* 02D：會長室在 firestore 模式（docs/architecture/migration.md 第 5 節）：已切到新資料庫的部門讀版本歷史（卡片每存一版算一項，遷移產生的第 1 版不算），
   總管理員另外加上稽核紀錄（部門設定的修改、卡片刪除，各算一項）。版本歷史只有總管理員與該部門的編輯者讀得到，讀不到的部門顯示「—」。
   還在 GitHub 的部門照舊讀存檔紀錄（有設定 repo 時；沒有就是「—」）。每 5 分鐘、回到分頁時更新。 */
async function actLoadFs(force){
  if(!force&&ACT.rows&&Date.now()-ACT.at<3e5)return;
  ACT.busy=true;renderActivity();
  const now=new Date();now.setMinutes(0,0,0);const start=now.getTime()+HOUR-ACT_H*HOUR;
  const ds=window.BOARD_DEPTS||[],c=cloudCfg(),gh=!!(c.owner&&c.repo);

  const audits=F&&fsRole()==="super"?await F.auditSince(CFG.firebase,start).catch(()=>[]):[];
  const res=await Promise.all(ds.map(d=>deptSourceOf(d.id)==="firestore"
    ?(F?F.versionsSince(CFG.firebase,d.id,start):Promise.reject()).then(v=>[...v.filter(x=>!x.imported),...audits.filter(a=>fsAuditDept(a)===d.id)].map(x=>({t:x.t,n:1}))).catch(()=>null)
    :gh?actFetch(d,start).catch(()=>null):Promise.resolve(null)));
  actSet(ds,res,start,"");
  if(ACT.again){ACT.again=false;actLoadFs(true)}
}
/* 單調三次插值（Fritsch–Carlson）：曲線平滑但不會超過相鄰兩點的範圍（不會出現負數或假的高峰） */
function actPath(pts){
  const n=pts.length;if(n<2)return "";
  const dx=[],m=[],t=[];for(let i=0;i<n-1;i++){dx[i]=pts[i+1][0]-pts[i][0];m[i]=(pts[i+1][1]-pts[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(!m[i]){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`}
  return d;
}
const actNice=v=>{if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
/* 圖的幾何（跟著寬度重算） */
function actGeo(box){const W=Math.max(280,box.clientWidth||600),H=W<560?190:230;return {W,H,l:4,r:W-4,t:16,b:H-34}}
const actX=(g,i)=>g.l+(g.r-g.l)*i/(ACT_H-1);
function actChartHTML(box){
  const g=actGeo(box),rows=ACT.rows,max=actNice(Math.max(1,...rows.map(r=>Math.max(...r.v)))),y=v=>g.b-(g.b-g.t)*v/max;
  const now=Date.now(),days=[];for(let i=0;i<ACT_H;i++){const d=new Date(ACT.start+i*HOUR);if(d.getHours()===0||i===0)days.push([i,d])}
