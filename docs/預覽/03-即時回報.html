  const lines=rows.map(r=>`<path class="ac-line${ACT.focus&&ACT.focus!==r.id?" dim":""}${!r.sum?" zero":""}" d="${actPath(r.v.map((v,i)=>[actX(g,i),y(v)]))}" style="--c:${deptColor(r.id)}"/>`).join("");
  return `<svg class="ac-svg" viewBox="0 0 ${g.W} ${g.H}" width="${g.W}" height="${g.H}" role="img" aria-label="最近 7 天各部門每小時編輯項數，最高 ${max}">
    <line class="ac-grid" x1="${g.l}" x2="${g.r}" y1="${g.t}" y2="${g.t}"/><line class="ac-grid" x1="${g.l}" x2="${g.r}" y1="${((g.t+g.b)/2).toFixed(1)}" y2="${((g.t+g.b)/2).toFixed(1)}"/><line class="ac-base" x1="${g.l}" x2="${g.r}" y1="${g.b}" y2="${g.b}"/>
    <text class="ac-yl" x="${g.r}" y="${g.t-5}">${max}</text><text class="ac-yl" x="${g.r}" y="${((g.t+g.b)/2-5).toFixed(1)}">${max/2}</text>
    ${ticks}${lines}
    <g class="ac-cur"><line x1="0" x2="0" y1="${g.t-4}" y2="${g.b}"/>${rows.map(r=>`<circle r="3.5" data-ac="${r.id}" style="--c:${deptColor(r.id)}"/>`).join("")}</g></svg>
    <div class="ac-tip" hidden></div>`;
}
function renderActivity(){

  info.innerHTML=`近 7 天共 <b class="num">${tot}</b> 項編輯${top&&top.sum?`・最多 <b>${esc(top.name)}</b> <span class="num">${top.sum}</span>`:""}${ACT.err?`<span class="ac-err">・${esc(ACT.err)}</span>`:""}`;
  const first=!box.querySelector(".ac-svg");box.innerHTML=actChartHTML(box);
  if(first)Anim.enter(box.querySelector(".ac-svg"),"rise");
  leg.innerHTML=rows.map(r=>`<button type="button" class="ac-k${ACT.focus===r.id?" on":""}${ACT.focus&&ACT.focus!==r.id?" dim":""}${!r.sum?" zero":""}" data-ack="${r.id}" aria-pressed="${ACT.focus===r.id}" style="--c:${deptColor(r.id)}"><i aria-hidden="true"></i>${esc(r.name)}<span class="num">${r.fail?"—":r.sum}</span></button>`).join("");
  if(ACT.idx!=null)actCursor(ACT.idx);
  if(!ACT.ro){ACT.ro=new ResizeObserver(()=>{if(ACT.rows&&box.querySelector(".ac-svg")&&Math.abs(box.clientWidth-(+box.querySelector(".ac-svg").getAttribute("width")))>2){box.innerHTML=actChartHTML(box);if(ACT.idx!=null)actCursor(ACT.idx)}});ACT.ro.observe(box)}
}
/* 游標：直線＋各曲線的點＋小標籤（只動 transform） */
function actCursor(i){
  const box=$("#actChart"),svg=box&&box.querySelector(".ac-svg");if(!svg)return;
  const cur=svg.querySelector(".ac-cur"),tip=box.querySelector(".ac-tip");
  if(i==null){ACT.idx=null;cur.classList.remove("on");tip.hidden=true;return}
  ACT.idx=i;const g=actGeo(box),rows=ACT.rows,max=actNice(Math.max(1,...rows.map(r=>Math.max(...r.v)))),x=actX(g,i);
  cur.classList.add("on");cur.querySelector("line").setAttribute("transform",`translate(${x.toFixed(1)},0)`);
  cur.querySelectorAll("circle").forEach(c=>{const r=rows.find(z=>z.id===c.dataset.ac),v=r.v[i];c.setAttribute("transform",`translate(${x.toFixed(1)},${(g.b-(g.b-g.t)*v/max).toFixed(1)})`);c.classList.toggle("dim",!!ACT.focus&&ACT.focus!==r.id||!v)});
  const d=new Date(ACT.start+i*HOUR),list=rows.filter(r=>(ACT.focus?r.id===ACT.focus:r.v[i]>0)).sort((a,b)=>b.v[i]-a.v[i]);
  tip.innerHTML=`<b class="num">${d.getMonth()+1}/${d.getDate()} 週${"日一二三四五六"[d.getDay()]} ${pad(d.getHours())}:00</b>${list.length?list.map(r=>`<span style="--c:${deptColor(r.id)}"><i></i>${esc(r.name)}<em class="num">${r.v[i]}</em></span>`).join(""):`<span class="ac-none">沒有編輯</span>`}`;
  tip.hidden=false;const sx=box.clientWidth/g.W,tw=tip.offsetWidth,left=Math.max(0,Math.min(box.clientWidth-tw,x*sx-tw/2));
  tip.style.transform=`translate(${left.toFixed(1)}px,0)`;
}
function actPick(e){
  const box=$("#actChart"),svg=box&&box.querySelector(".ac-svg");if(!svg||!ACT.rows)return;
  const r=svg.getBoundingClientRect(),g=actGeo(box),x=(e.clientX-r.left)*g.W/r.width,i=Math.round((x-g.l)/(g.r-g.l)*(ACT_H-1));
  actCursor(Math.max(0,Math.min(ACT_H-1,i)));
}
document.addEventListener("pointermove",e=>{if(e.target.closest&&e.target.closest("#actChart .ac-svg"))actPick(e);else if(ACT.idx!=null&&e.pointerType==="mouse"&&!(e.target.closest&&e.target.closest("#actChart")))actCursor(null)},{passive:true});
document.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest("#actChart .ac-svg"))actPick(e)},{passive:true});
document.addEventListener("click",e=>{
  const t=e.target;if(!t.closest)return;
  if(t.closest("#actRefresh")){actLoad(true);return}
  const k=t.closest("[data-ack]");if(k){ACT.focus=ACT.focus===k.dataset.ack?null:k.dataset.ack;renderActivity();return}
  if(ACT.idx!=null&&!t.closest("#actChart"))actCursor(null);
});
if(CFG.follow){
  setInterval(()=>{if(!document.hidden)actLoad()},6e4);   /* 每分鐘檢查一次是否到了更新時間（有權杖 5 分鐘、沒有 15 分鐘） */
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)actLoad()});
}

</script>
<script>
/* 核心｜秘書處的「會議報告事項」（只能看）與「會議編輯」（會長室開放才能改）面板（設定檔 meeting:true），以及會長室的授權開關（grant:true）
   - 列出各部門標了「會議要報告」（ev.report）的即時回報，依部門分組；會長室追蹤一樣的讀法，但會記住 sha 以便寫回。
   - 「會議編輯」：會長室今天開放（會長室資料的 meetGrant.date＝今天）時，登入後按這區的「編輯」，，卡片跟部門自己的即時回報同一套逐欄編輯（點哪欄改哪欄：名稱、說明、母議題、專員、標籤、時間標記與地點、連結）。
     做法：畫面與存回時把全域 state 暫時換成那個部門的資料（withState），所以 views.js／events.js 的逐欄編輯不用另寫一份。
   - 按「儲存並同步」：秘書處自己的資料照常存；改過的部門各自寫回 data-代號.json（同一個 repo、同一把權杖），
     commit 訊息照現行格式，作者是秘書處目前登入的身分（該部門的編輯紀錄會看到「〔秘書處 名字〕」）。按「取消」放棄。
   - 「會議要報告」標記仍由各部門生成週報時自動清掉；這裡不改標記本身。 */
const MT={depts:new Map(),loading:false,at:0};   /* dept id → {data,base,sha,err,dirty} */
function withState(s,fn){const keep=state;state=s;try{return fn()}finally{state=keep}}
const mtOf=el=>{const b=el&&el.closest&&el.closest("[data-mtdept]");return b?MT.depts.get(b.dataset.mtdept):null};
async function mtLoadAll(force){
  if(!CFG.meeting||MT.loading||(!force&&Date.now()-MT.at<3e5&&MT.depts.size))return;
  if(editing&&[...MT.depts.values()].some(x=>x.dirty))return;   /* 改到一半不要被覆蓋 */
  MT.loading=true;renderMeet();
  const cc=cloudCfg(),tok=ghToken();
  await Promise.all((window.BOARD_DEPTS||[]).filter(d=>d.id!==CFG.deptId).map(async d=>{
    let data=null,sha=null,err="";
    if(deptSourceOf(d.id)==="firestore"){try{data=await storeDeptData(d.id)}catch(e){err=STORE_XERR(e)}}   /* 02D D-b：已切到新資料庫的部門讀 Firestore（只讀；寫回時 mtPushAll 擋下） */
    else try{
      if(cc.owner&&cc.repo&&tok){const r=await fetch(apiURL({...cc,path:d.path})+`?ref=${encodeURIComponent(cc.branch)}&t=${Date.now()}`,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tok},cache:"no-store"});
        if(r.ok){const j=await r.json();sha=j.sha;data=JSON.parse(b64dec(j.content))}else if(r.status===404)err="還沒有資料"}
      if(!data&&!err&&location.protocol!=="file:"){const r=await fetch(d.path,{cache:"no-cache"});if(r.ok)data=await r.json();else err="還沒有資料"}
    }catch(_){err="讀不到資料"}
    if(data)data=normalize(data);
    MT.depts.set(d.id,{id:d.id,name:d.name,data,base:data&&JSON.parse(JSON.stringify(data)),sha,err,dirty:false});
  }));
  MT.loading=false;MT.at=Date.now();render();
}
/* 會長室的授權：會長室資料的 meetGrant.date 是今天才算開放（過了那天自動失效） */
function mtGrant(){const pr=MT.depts.get("president"),g=pr&&pr.data&&pr.data.meetGrant;return g&&g.date===today()?g:null}
const mtCanEdit=()=>secEd("meetedit")&&!!mtGrant();
/* 一個部門的報告事項（ed＝畫成可以點欄位編輯）。一次只畫一個部門（MTS.sel）。
   2026-11-06 使用者：秘書處看起來依然很臃腫，不要直接粗暴地條列——每一筆收成跟即時回報同一種膠囊（<details class="ev">，motion.js 的展開收合動畫），
   收合只看燈號、名稱、狀態，點了才展開說明、時間、連結；哪幾筆開著記在 MTS.open，重畫後照舊 */
const MTS={sel:"",open:new Set()};
const mtEvs=m=>m&&m.data?m.data.events.filter(e=>!e.doneAt&&e.report):[];
function mtGroupHTML(m,ed){
  const evs=mtEvs(m);if(!evs.length)return "";
  return `<section class="mt-dept" data-mtdept="${esc(m.id)}" data-fk="mt${esc(m.id)}">${ed&&m.dirty?'<p class="sub mt-dirty">已修改，按「儲存」後寫回</p>':""}
    <div class="events mt-list">${withState(m.data,()=>evs.map(e=>{const st=evStatus(e),par=parentOf(e);
      return `<details class="ev mt-ev" data-ev="${esc(e.id)}" data-mtev="${esc(e.id)}" data-st="${st}"${MTS.open.has(e.id)?" open":""}>
        <summary><span class="live-dot" aria-hidden="true"></span><b>${esc(e.name)}</b><span class="mt-st">${EV_ST[st]}</span><span class="ev-chev" aria-hidden="true">▾</span></summary>
        <div class="ev-body">${ed?evFieldsHTML(e):`${par?`<p class="ev-parent-full">母議題：${esc(par.title)}</p>`:""}${e.desc?`<p>${esc(e.desc)}</p>`:`<p class="sub">沒有說明</p>`}${evTimesHTML(e)}${staffHTML(e.staff)}${labelChipsHTML(e.labels)}${evLinksHTML(e)}`}</div></details>`}).join(""))}</div></section>`;
}
document.addEventListener("toggle",e=>{const d=e.target;if(!d.matches||!d.matches("#meetEdList .mt-ev"))return;if(d.open)MTS.open.add(d.dataset.mtev);else MTS.open.delete(d.dataset.mtev)},true);
/* 秘書處「會議」分頁的報告事項（2026-11-06 使用者：一個一個編輯每個部門釘選要報告的即時回報，最後根據改動的紀錄匯出會議紀錄 PDF）：
   上面一排有報告事項的部門（件數；改過還沒儲存的部門有小圓點），一次看一個；下面上一個／下一個部門。
   會長室今天開放時，按這張的「編輯」就能改（每個部門都能改，切換部門不會丟掉；按「儲存」才一起寫回）。沒有報告事項的部門列在最下面一行 */
function renderMeet(){
  const edp=$("#meetEdPanel");if(!edp)return;
  edp.hidden=!CFG.meeting;if(!CFG.meeting)return;
  if(!MT.depts.size&&!MT.loading){mtLoadAll();return}
  const ms=[...MT.depts.values()],has=ms.filter(m=>mtEvs(m).length),none=ms.filter(m=>m.data&&!mtEvs(m).length),errs=ms.filter(m=>!m.data&&m.err!=="還沒有資料");
  if(!has.some(m=>m.id===MTS.sel))MTS.sel=has[0]?has[0].id:"";
  const g=mtGrant(),btn=edp.querySelector("[data-edit]");
  btn.hidden=!g||fsMode();   /* 會長室今天有開放才有「編輯」（登入才看得到，見 board.css「單卡編輯」段）；firestore 模式不開放會議編輯（render.js 的 fsSecOk） */
  /* 狀態只寫一行短的 */
  $("#meetEdSt").innerHTML=g?`<span class="grant-on">開放修改中</span> · ${esc(g.by||"會長室")} ${esc((g.at||"").slice(11,16))} 開，今天有效`
    :`<span class="grant-off">未開放修改</span> · 會長室開放當天才能改`;
  $("#meetPick").innerHTML=has.map(m=>`<button type="button" role="tab" class="wk-d" data-mtpick="${esc(m.id)}" aria-selected="${m.id===MTS.sel}">${m.dirty?'<i class="wk-new" aria-label="已修改"></i>':""}${esc(m.name)}<span class="num">${mtEvs(m).length}</span></button>`).join("")
    +(MTS.sel?`<a class="fw-open mt-open" href="?d=${encodeURIComponent(MTS.sel)}" target="_blank" rel="noopener">開啟看板 →</a>`:"");   /* 開啟看板放在部門膠囊那一排的右邊，不另外佔一列 */
  const ed=mtCanEdit()&&deptSourceOf(MTS.sel)==="github",loading=MT.loading&&!MT.depts.size?`<p class="sub">讀取各部門資料中…</p>`:"";
  $("#meetEdList").innerHTML=loading+(MTS.sel?mtGroupHTML(MT.depts.get(MTS.sel),ed):MT.depts.size?`<p class="empty">目前沒有部門標「會議要報告」。各部門在自己的即時回報按「會議要報告」後會出現在這裡。</p>`:"")
    +(none.length?`<p class="sub mt-none">沒有報告事項：${none.map(m=>esc(m.name)).join("、")}</p>`:"")
    +(errs.length?`<p class="sub">讀不到：${errs.map(m=>esc(m.name)).join("、")}</p>`:"")+(mtCanEdit()&&!ghToken()?`<p class="sub">這台裝置沒有權杖，改了也寫不回其他部門。</p>`:"");
  const i=has.findIndex(m=>m.id===MTS.sel);
  $("#meetStep").innerHTML=has.length>1?`<button type="button" class="icon" data-mtstep="-1"${i>0?"":" disabled"}>${ico("prev")}${i>0?esc(has[i-1].name):"上一個部門"}</button><span class="sub num">${i+1} / ${has.length}</span><button type="button" class="icon" data-mtstep="1"${i<has.length-1?"":" disabled"}>${i<has.length-1?esc(has[i+1].name):"下一個部門"}${ico("next")}</button>`:"";
  const mins=state.minutes||[];
  $("#minutesInfo").textContent=mins.length?`已記錄 ${mins.length} 次會議（最近 ${fmt(mins[mins.length-1].date)}，${mins[mins.length-1].items.length} 項修改）`:"寫回各部門的修改會自動記下來，之後可以匯出成會議紀錄";
  renderWeekRead();
}
/* 換部門：清單淡出、新部門由下往上淡入 */
function mtPick(id){
  if(!id||id===MTS.sel)return;MTS.sel=id;const box=$("#meetEdList");
  renderMeet();if(box&&!reduceMotion())box.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:MO.base,easing:MO.out});
}
document.addEventListener("click",e=>{
  const t=e.target;if(!t.closest||!t.closest("#meetEdPanel"))return;
  const p=t.closest("[data-mtpick]");if(p){mtPick(p.dataset.mtpick);return}
  const st=t.closest("[data-mtstep]");if(st){const has=[...MT.depts.values()].filter(m=>mtEvs(m).length),i=has.findIndex(m=>m.id===MTS.sel)+(+st.dataset.mtstep);if(has[i]){mtPick(has[i].id);$("#meetEdPanel").scrollIntoView({block:"start",behavior:reduceMotion()?"auto":"smooth"})}return}
  if(t.closest("#minutesBtn"))minutesDialog();
});
/* ---------- 會長室：開放秘書處會議編輯的開關（設定檔 grant:true） ----------
   切到「開放今天」＝寫入 state.meetGrant＝{date:今天,by,at}，立刻儲存並同步（編輯中就併入這次編輯）；隔天自動失效。
   要登入才能切；取消登入或儲存失敗就切回原本的位置 */
const grantOn=()=>!!(state.meetGrant&&state.meetGrant.date===today());
/* 會長室的開關（2026-11-06 使用者：不用這麼大，小小一個開關；在「會長室」分頁）：點一下切換，要登入；狀態只寫一句短的 */
function renderGrant(){
  const p=$("#grantPanel");if(!p)return;p.hidden=!CFG.grant;if(!CFG.grant)return;
  const sw=$("#grantSw"),on=grantOn(),g=state.meetGrant;
  sw.setAttribute("aria-checked",on);sw.classList.toggle("on",on);sw.disabled=fsMode();   /* firestore 模式：授權存在 grants/meetingEdit（只有總管理員＋稽核），這個開關還沒接上 */
  $("#grantSt").textContent=on?`今天開放中（${g.by||""} ${(g.at||"").slice(11,16)} 開，23:59 自動關閉）`:"關閉：秘書處只能看各部門的報告事項";
  if(!sw._wired){sw._wired=true;sw.addEventListener("click",async()=>{
    if(fsMode())return;
    const want=!grantOn();sw.classList.toggle("on",want);
    if(readOnly()||!(await ensureLogin())){renderGrant();return}
    await settingSave(()=>{state.meetGrant=want?{date:today(),by:meName(),at:nowStr()}:null},want?"已開放秘書處今天的會議編輯":"已關閉秘書處的會議編輯");
    render()})}
}
/* 存回：秘書處自己的資料存完後，改過的部門各自寫回 */
async function mtPushAll(){
  const cc=cloudCfg(),tok=ghToken(),who=meName()?`秘書處 ${meName()}`:"秘書處";
  const dirty=[...MT.depts.values()].filter(m=>m.dirty&&m.data);if(!dirty.length)return;
  if(!tok){toast("沒有權杖，其他部門的修改沒有寫回");return}
  /* 寫回前再讀一次會長室的授權（可能剛被關掉或已過了當天） */
  const pr=await fwLoad("president",true),g=pr&&pr.data&&pr.data.meetGrant;
  if(!g||g.date!==today()){dirty.forEach(m=>{m.data=JSON.parse(JSON.stringify(m.base));m.dirty=false});render();toast("會長室的授權已經關閉或過期，其他部門的修改沒有寫回");return}
  const fails=[],rec=[];
  for(const m of dirty){
    if(deptSourceOf(m.id)!=="github"){fails.push(m.name+(deptSourceOf(m.id)==="frozen"?"（搬家中，暫停編輯）":"（已搬到新資料庫，請到那個部門的看板修改）"));continue}   /* 凍結或已搬家的部門不寫資料檔（store.js） */
    const items=mtDiff(m);
    const d=fwDept(m.id);m.data.savedAt=nowStr();m.data.savedBy=who;
    const body={message:commitMessage(m.base,m.data,who),content:b64enc(JSON.stringify(m.data,null,1)),branch:cc.branch};if(m.sha)body.sha=m.sha;
    try{const r=await fetch(apiURL({...cc,path:d.path}),{method:"PUT",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(r.ok){const j=await r.json();m.sha=j.content&&j.content.sha;m.base=JSON.parse(JSON.stringify(m.data));m.dirty=false;rec.push(...items)}
      else fails.push(m.name+(r.status===409||r.status===422?"（對方剛存過，請重新整理再改）":""))}
    catch(_){fails.push(m.name)}
  }
  render();toast(fails.length?`沒有寫回：${fails.join("、")}`:`已寫回 ${dirty.map(m=>m.name).join("、")}`);
  if(rec.length){mtRecord(rec);await persist("已記進今天的會議紀錄");render()}   /* 寫回成功的修改記進秘書處自己的資料（state.minutes），再存一次 */
}
/* ---------- 會議紀錄（2026-11-06）：寫回各部門成功時，記下改了哪一筆、哪些欄位、改完的內容 ----------
   state.minutes[]＝{id,date,by:[名字],items:[{dept,deptName,ev,name,desc,times:[{label,start,end,place}],changed:[欄位],before:{desc}|null,at}]}，
   同一天的修改併成一次會議；同一筆改很多次只留一列（欄位累加、內容是最後的樣子、before 是當天第一次改之前的說明）。
   存在秘書處自己的資料檔（公開的 repo）。匯出：選日期 → report.js 的預覽（openReport 第三個參數）→ 存成 PDF */
const MT_F=[["name","名稱"],["desc","說明"],["times","時間"],["links","連結"],["staff","專員"],["labels","標籤"],["issueId","母議題"]];
function mtDiff(m){
  const B=new Map((m.base.events||[]).map(e=>[e.id,e])),out=[];
  (m.data.events||[]).forEach(e=>{const b=B.get(e.id);
    const ch=b?MT_F.filter(([k])=>JSON.stringify(e[k]??null)!==JSON.stringify(b[k]??null)).map(f=>f[1]):["新增"];if(!ch.length)return;
    out.push({dept:m.id,deptName:m.name,ev:e.id,name:e.name,desc:e.desc||"",times:(e.times||[]).map(t=>({label:t.label||"",start:t.start||"",end:t.end||"",place:t.place||""})),changed:ch,before:b?{desc:b.desc||""}:null})});
  return out;
}
function mtRecord(items){
  const day=today(),who=meName()||"秘書處";state.minutes=state.minutes||[];
  let mn=state.minutes.find(x=>x.date===day);if(!mn){mn={id:uid("mn"),date:day,by:[],items:[]};state.minutes.push(mn)}
  if(!mn.by.includes(who))mn.by.push(who);
  items.forEach(x=>{const o=mn.items.find(y=>y.dept===x.dept&&y.ev===x.ev);
    if(o)Object.assign(o,{...x,changed:[...new Set([...o.changed,...x.changed])],before:o.before,at:nowStr()});else mn.items.push({...x,at:nowStr()})});
}
/* 匯出：選哪一天的會議；可以順便列出那天沒有修改的報告事項（各部門目前的內容，只有選今天時有意義） */
async function minutesDialog(){
  const mins=[...(state.minutes||[])].sort((a,b)=>b.date.localeCompare(a.date));

    return `${d?fmt(d).slice(5):""}${h?" "+h:""}${t.end?` – ${e&&e!==d?fmt(e).slice(5):""}${eh?" "+eh:""}`:""}`};
  const order=(window.BOARD_DEPTS||[]).map(d=>d.id),byDept=new Map();
  mn.items.forEach(x=>{if(!byDept.has(x.dept))byDept.set(x.dept,{name:x.deptName,items:[]});byDept.get(x.dept).items.push(x)});
  if(all)MT.depts.forEach(m=>mtEvs(m).forEach(e=>{if(!byDept.has(m.id))byDept.set(m.id,{name:m.name,items:[]});const g=byDept.get(m.id);
    if(!g.items.some(x=>x.ev===e.id))g.items.push({dept:m.id,deptName:m.name,ev:e.id,name:e.name,desc:e.desc||"",times:(e.times||[]).map(t=>({label:t.label||"",start:t.start||"",end:t.end||"",place:t.place||""})),changed:[],before:null})}));
  const depts=[...byDept.entries()].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  const N="一二三四五六七八九十";
  const item=x=>`<article class="rpt-issue"><h3>${esc(x.name)}<span class="rpt-st">${x.changed.length?`會議中修改：${esc(x.changed.join("、"))}`:"未修改"}</span></h3>
    ${x.desc?`<p>${esc(x.desc).replace(/\n/g,"<br>")}</p>`:""}
    ${x.times.length?`<h4>時間</h4><ul class="rpt-tl">${x.times.map(t=>`<li><span class="rpt-d">${esc(when(t))}</span>${esc(t.label)}${t.place?`（${esc(t.place)}）`:""}</li>`).join("")}</ul>`:""}
    ${x.before&&x.changed.includes("說明")&&x.before.desc!==x.desc?`<h4>修改前的說明</h4><p class="rpt-none">${esc(x.before.desc)||"（空白）"}</p>`:""}</article>`;
  const body=depts.map(([id,g],i)=>`<h3 class="rpt-h1">${N[i]||i+1}、${esc(g.name)}</h3>${g.items.map(item).join("")}`).join("")||'<p class="rpt-none">這次沒有報告事項</p>';
  const cover=`<section class="rpt-page rpt-cover">
    <div class="cv-top"><div class="cv-org"><span class="cv-logo">${suLogoColor("南臺科大學生會")}</span><b contenteditable="true">${esc(CFG.dept.name||"秘書處")}</b></div><span class="cv-date num" contenteditable="true">${dot(mn.date)}</span></div>
    <div class="cv-mid"><p class="cv-k num">MEETING MINUTES</p><h1 contenteditable="true">會議紀錄</h1><p class="cv-sub" contenteditable="true">${termCfg().yearLabel?esc(termCfg().yearLabel)+"・":""}${dot(mn.date)}</p></div>
    <div class="cv-foot"><div class="cv-col"><span>紀錄</span><span contenteditable="true">${esc(mn.by.join("、"))}</span><span contenteditable="true">南臺科技大學學生會　${esc(CFG.dept.name||"秘書處")}</span></div>
      <div class="cv-col"><span>出席</span><span contenteditable="true" data-ph="出席人員（可留白）"></span><span class="num">製表 ${dot(today())}</span></div></div></section>`;
  return cover+rptCh("mtrep","各部門報告事項",rptAuto(`<div class="rpt-body" contenteditable="true">${body}</div>`))
    +rptCh("free","討論與決議",rptTextBlk("在這裡輸入會議的討論與決議…"))+rptCh("free","臨時動議",rptTextBlk("在這裡輸入臨時動議…"));

/* ---------- 秘書處：各部門週報調閱（2026-11-05，使用者要求「秘書處有按鈕可以擷取每個部門的每週概述跟調閱」） ----------
   只讀：直接用上面 MT.depts 讀到的各部門資料（weeks[]），不另外存任何東西。「擷取最新」＝重新讀一次各部門的資料檔。
   上面一排部門膠囊（後面是週報份數；這週有新的亮綠點），下面是選到的部門：週次膠囊（新到舊）＋那一份的全文＋「複製文字」；
   「全部部門最新一份」把每個部門最新那份接在一起，可以一次複製。 */
const WK={dept:"all",week:null,open:new Set()};   /* open：全部最新裡展開的部門 */
function wkThisWeek(d){return !!d&&d>=addDays(today(),-((pd(today()).getDay()+6)%7))}   /* 這週（週一起）產出的 */
function renderWeekRead(){
  const p=$("#wkPanel");if(!p)return;p.hidden=!CFG.meeting;if(!CFG.meeting)return;
  const ms=[...MT.depts.values()],ws=m=>m.data?[...m.data.weeks].filter(w=>w.text).sort((a,b)=>b.date.localeCompare(a.date)):[];
  if(WK.dept!=="all"&&!MT.depts.has(WK.dept))WK.dept="all";
  $("#wkDepts").innerHTML=[`<button type="button" role="tab" class="wk-d" data-wkd="all" aria-selected="${WK.dept==="all"}">全部最新</button>`,
    ...ms.filter(m=>ws(m).length||m.id===WK.dept).map(m=>{const n=ws(m).length,fresh=n&&wkThisWeek(ws(m)[0].date);return `<button type="button" role="tab" class="wk-d${n?"":" none"}" data-wkd="${esc(m.id)}" aria-selected="${WK.dept===m.id}">${fresh?'<i class="wk-new" aria-label="這週有新的"></i>':""}${esc(m.name)}<span class="num">${n}</span></button>`})].join("");
  const body=$("#wkBody");
  if(MT.loading&&!ms.length){body.innerHTML=`<p class="sub">讀取各部門資料中…</p>`;return}
  const block=(m,w,head)=>`<article class="wk-doc" data-wkdoc><div class="wk-top">${head}<span class="num">${fmt(w.date)}</span>${wkThisWeek(w.date)?'<span class="wk-fresh">本週</span>':""}<button type="button" class="icon" data-wkcopy>複製文字</button></div><pre class="wk-text">${esc(w.text)}</pre></article>`;
  if(WK.dept==="all"){
    /* 全部最新：每個部門一顆膠囊（部門、日期、本週），點了才展開全文（2026-11-06 使用者：秘書處太臃腫，要收起來） */
    const cap=(m,w)=>`<details class="ev wk-cap" data-wkdoc data-wkcap="${esc(m.id)}"${WK.open.has(m.id)?" open":""}><summary><b>${esc(m.name)}</b><span class="num wk-date">${fmt(w.date)}</span>${wkThisWeek(w.date)?'<span class="wk-fresh">本週</span>':""}<span class="ev-chev" aria-hidden="true">▾</span></summary>
      <div class="ev-body"><div class="wk-top"><button type="button" class="icon" data-wkcopy>複製文字</button></div><pre class="wk-text">${esc(w.text)}</pre></div></details>`;
    const docs=ms.map(m=>{const w=ws(m)[0];return w?cap(m,w):""}).filter(Boolean);
    const miss=ms.filter(m=>!ws(m).length).map(m=>m.name);
    body.innerHTML=(docs.length?`<div class="wk-all-tools"><button type="button" class="icon" data-wkcopyall>全部複製</button></div><div class="events wk-caps">${docs.join("")}</div>`:`<p class="empty">還沒有任何部門產出週報。</p>`)+(miss.length?`<p class="sub wk-miss">還沒有週報：${miss.map(esc).join("、")}</p>`:"");
    return;
  }
  const m=MT.depts.get(WK.dept),list=ws(m);
  if(!list.length){body.innerHTML=`<p class="empty">${esc(m.name)}${m.data?"還沒有週報。":esc(m.err||"讀不到資料")}</p>`;return}
  const w=list.find(x=>x.id===WK.week)||list[0];
  body.innerHTML=`<div class="wk-weeks" role="tablist" aria-label="週次">${list.slice(0,12).map(x=>`<button type="button" role="tab" class="wk-w" data-wkw="${esc(x.id)}" aria-selected="${x.id===w.id}"><span class="num">${fmt(x.date).slice(5)}</span></button>`).join("")}</div>
    ${block(m,w,`<span class="tag sm">${esc(m.name)}</span>`)}<a class="wk-open" href="?d=${encodeURIComponent(m.id)}" target="_blank" rel="noopener">開啟${esc(m.name)}看板 →</a>`;
}
document.addEventListener("toggle",e=>{const d=e.target;if(!d.matches||!d.matches("#wkBody .wk-cap"))return;if(d.open)WK.open.add(d.dataset.wkcap);else WK.open.delete(d.dataset.wkcap)},true);
document.addEventListener("click",e=>{
  const t=e.target;if(!t.closest||!t.closest("#wkPanel"))return;
  const d=t.closest("[data-wkd]");if(d){WK.dept=d.dataset.wkd;WK.week=null;renderWeekRead();return}

});

<script>
/* 核心｜返回：系統返回鍵／返回手勢
   - 打開一層（每週概述、設定、通知、編輯紀錄、工作報告）時推一筆瀏覽紀錄：按返回／系統返回手勢先關掉最上面那層，不會直接離開網站。
   - 關的時候播的是各層自己的關閉動畫（換頁動畫 core/js/pagefx.js：這一層往後退、底下那層從後面浮上來）。
   - 瀏覽器自己做了返回動畫（iOS Safari 邊緣滑動等，popstate 的 hasUAVisualTransition）就直接關，不再播一次。
   - 2026-11-05 使用者決定拿掉「預測返回」（手指往右拖、這一層縮小右移）與它的收尾動畫，程式已刪除。 */
const Back=(()=>{
  const stack=[];let skip=0;
  if(history.state&&history.state.bl)history.replaceState(null,"");   /* 重新整理後殘留的紀錄 */
  function opened(name,close){
    if(stack.some(x=>x.name===name))return;
    stack.push({name,close});history.pushState({bl:name},"");
  }
  function closed(name){
    const i=stack.findIndex(x=>x.name===name);if(i<0)return;
    stack.splice(i,1);if(history.state&&history.state.bl){skip++;history.back()}   /* 最上面是我們推的紀錄就退一筆 */
  }
  /* 把某一層的紀錄直接換成另一層（不用先退一筆再推一筆，避免兩個非同步的瀏覽紀錄操作打架）：每週概述 → 返回設定時用 */
  function replace(name,next,close){
    const i=stack.findIndex(x=>x.name===name);if(i<0)return;
    stack[i]={name:next,close};if(history.state&&history.state.bl===name)history.replaceState({bl:next},"");
  }
  addEventListener("popstate",e=>{
    if(skip){skip--;return}
    const top=stack.pop();if(!top)return;
    top.close(!!e.hasUAVisualTransition);   /* true＝不要動畫（瀏覽器已經播過） */
  });
  /* 看板 → 各部門總覽：從總覽點進來的就用瀏覽器返回（保留總覽的捲動位置），否則直接開總覽（都有換頁動畫） */
  function home(){
    let fromHome=false;try{fromHome=!!document.referrer&&new URL(document.referrer).pathname.endsWith("/home.html")}catch(_){}
    if(fromHome&&history.length>1&&!stack.length)history.back();else PageFx.leave("home.html");
  }
  return {opened,closed,replace,home};
})();
/* 換頁動畫（pagefx.js）的「底下那一頁」：最上面還開著的全畫面層（skip 以外），沒有就是看板本身（#pager，含每週概述） */
function pageUnder(skip){for(const s of ["#rptOv","#logOv:not(.in-pane)","#setOv","#notiOv"]){const el=document.querySelector(s);if(el&&el!==skip&&!el.hidden)return el}return $("#pager")}
/* 各層打開時登記：close(instant) 關掉那一層 */
Back.layers={
  settings:()=>Back.opened("settings",i=>closeSettings(i)),
  noti:()=>Back.opened("noti",i=>closeNoti(i)),
  log:()=>Back.opened("log",i=>closeLog(i===true)),
  report:()=>Back.opened("report",i=>closeReport(i)),
};

</script>
<script>
/* 核心｜展開收合與模式切換動畫 */
/* ---------- smooth mode switch (edit <-> view): morph instead of a hard cut ---------- */
function morph(fn){
  if(reduceMotion()){fn();return}
  const ease=EXPAND.easing,D=560;
  const lay=document.querySelector(".layout"),ly=lay.getBoundingClientRect().top;
  const hr=document.querySelector(".hero-rule"),hh=hr.offsetHeight;
  fn();
  const hh2=hr.offsetHeight;if(Math.abs(hh-hh2)>1){hr.style.overflow="hidden";hr.animate([{height:hh+"px"},{height:hh2+"px"}],{duration:D,easing:ease}).onfinish=()=>{hr.style.overflow=""}}
  const dy=ly-lay.getBoundingClientRect().top;
  if(Math.abs(dy)>1)lay.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:D,easing:ease});
}
/* ---------- expand / collapse motion (app-launch style) ---------- */
const EXPAND={duration:560,easing:"cubic-bezier(.2,.9,.25,1)"};
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function detailsBody(d){
  let kids=[...d.children].filter(k=>k.tagName!=="SUMMARY");
  if(kids.length===1&&kids[0].classList.contains("dwrap"))return kids[0];
  const w=document.createElement("div");w.className="dwrap";kids.forEach(k=>w.append(k));d.append(w);return w;
}
/* 有展開收合動畫進行時在 <html> 加 .motion-busy：頁面上其他一直在跑的小動畫（燈號擴散）先暫停，動畫才順 */
let _busy=0;
function motionBusy(n){_busy=Math.max(0,_busy+n);document.documentElement.classList.toggle("motion-busy",_busy>0)}
function animateDetails(d,open){
  (d._anims||[]).forEach(a=>a.cancel());d._anims=[];
  if(reduceMotion()){d.open=open;return}
  const rad=(r,h)=>Math.min(parseFloat(r)||0,h/2)+"px";
  const h0=d.offsetHeight,r0=rad(getComputedStyle(d).borderRadius,h0);
  if(open){d.open=true}
  const w=detailsBody(d);
  const full=w.scrollHeight;
  const cur=open?0:w.getBoundingClientRect().height;
  d.open=open;const h1=open?d.offsetHeight:h0-cur;const r1=rad(getComputedStyle(d).borderRadius,h1);
  d.open=true;
  d.classList.toggle("closing",!open);
  if(open){d.classList.add("opening");clearTimeout(d._ot);d._ot=setTimeout(()=>d.classList.remove("opening"),1400)}
  /* 手機焦點：即時回報展開那一下像被拿起來——放大一點、歪一點，再落回平的（不會一直歪，展開後文字照常好讀） */
  if(open&&d.matches(".ev")&&isPhone())d.animate([{scale:1,rotate:"0deg"},{scale:1.035,rotate:"-1.6deg",offset:.3},{scale:1,rotate:"0deg"}],{duration:640,easing:"cubic-bezier(.3,.7,.3,1)"});
  w.style.overflow="hidden";
  const wa=w.animate(open?[{height:"0px",opacity:0},{height:full+"px",opacity:1}]:[{height:cur+"px",opacity:1},{height:"0px",opacity:0}],{...EXPAND,duration:open?EXPAND.duration:380});
  const anims=[wa];
  if(r0!==r1)anims.push(d.animate([{borderRadius:r0},{borderRadius:r1}],{...EXPAND,duration:open?EXPAND.duration:380}));
  d._anims=anims;d.classList.add("animating");motionBusy(1);
  wa.onfinish=()=>{w.style.overflow="";d._anims=[];d.classList.remove("animating","closing");if(!open)d.open=false;motionBusy(-1)};
  wa.oncancel=()=>{w.style.overflow="";d.classList.remove("animating","closing");motionBusy(-1)};
}
document.addEventListener("click",e=>{
  const sm=e.target.closest("summary");if(!sm)return;
  const d=sm.parentElement;if(!d||!d.matches(".ev,.week,.log"))return;
  if(e.target.closest("input,button,a")){if(e.target.closest("summary button,summary input"))e.preventDefault();return}
  e.preventDefault();
  /* 桌面、區塊被選到時：點即時回報或完成紀錄的一筆＝在右側打開，再點一次＝收起（不就地展開）。
     例外：在別的區塊被選到時就地展開過、切過來還開著的那一筆，點了先就地收起（不然會收不起來、直接跳去分欄） */
  if(!d.open&&d.matches(".ev:not([data-done]):not(.mt-ev)")&&mdOn("live")){mdSelect("live",d.dataset.ev);return}   /* 秘書處的會議膠囊（.mt-ev）是別的部門的，一律就地展開 */
  if(!d.open&&d.matches("[data-done]")&&mdOn("done")){mdSelect("done",d.dataset.issue||d.dataset.ev);return}
  /* 手機：即時回報、完成紀錄一次只開一張（打開這張時，同一區開著的其他張一起收起） */
  if(!d.open&&d.matches(".ev")&&isPhone()){const box=d.closest("#events,#doneList,#meetEdList,#wkBody");if(box)box.querySelectorAll(".ev[open]").forEach(o=>{if(o!==d)animateDetails(o,false)})}   /* 秘書處的報告事項、週報膠囊也照這條（2026-11-06 使用者：一次只能開一個） */
  animateDetails(d,!d.open);
},true);

/* open link buttons robustly: new tab first, fall back to same tab when a viewer blocks pop-ups */
document.addEventListener("click",e=>{
  const a=e.target.closest("a.link[href]");if(!a||a.closest(".sec-edit"))return;
  const url=a.getAttribute("href");if(!url||url==="#")return;
  e.preventDefault();e.stopPropagation();
  let w=null;try{w=window.open(url,"_blank")}catch(_){}
  if(w){try{w.opener=null}catch(_){}}
  else{try{window.top.location.href=url}catch(_){location.href=url}}
},true);

document.addEventListener("click",e=>{
  if(e.target.closest(".sec-edit"))return;const m=e.target.closest(".marker.quiet");if(!m)return;   /* 編輯中的議題：點註記是修改，不是偷看 */
  const tr=m.closest(".c-track");m.classList.add("peek");tr&&tr.classList.add("peeking");clearTimeout(m._pk);m._pk=setTimeout(()=>{m.classList.remove("peek");tr&&tr.classList.remove("peeking")},2200);
});
document.addEventListener("mouseover",e=>{const m=e.target.closest(".marker.quiet,.g-mk.quiet");const tr=m&&m.closest(".c-track,.g-track");document.querySelectorAll(".peeking").forEach(x=>{if(x!==tr)x.classList.remove("peeking")});if(tr)tr.classList.add("peeking")});

/* ---------- 左右兩欄的開合（即時回報、完成紀錄） ----------
   被點的那一項「飛」到右半邊變成詳情卡，原位留虛線空位（CSS 的 .sel）；收起時詳情卡縮小彈回空位，那一項再出現。
   三種動作都走 mdSelect：
   - 打開（沒選→選）：清單 FLIP 縮到左半邊，詳情卡從被點那一項原本的位置彈出放大（mdPop "out"）
   - 換選（選 A→選 B）：A 的詳情卡先縮回 A 的空位（mdPop "in"），A 出現；再從 B 彈出
   - 收起（選→沒選）：詳情卡縮回空位，那一項出現，清單 FLIP 展開回全寬
   只動 transform／clip-path（不縮放內容，字不變形）；動作進行中 mdBusy 擋住重複點擊 */
const MD={live:{list:"#events",item:".ev",key:el=>el.dataset.ev,pane:"#evDetail",get:()=>selEv,set:v=>{selEv=v},render:()=>renderEvents()},
  done:{list:"#doneList",item:"[data-done]",key:el=>el.dataset.done,pane:"#doneDetail",get:()=>selDone,set:v=>{selDone=v},render:()=>renderDone()}};
const MD_POP={out:{duration:560,easing:"cubic-bezier(.3,1.3,.5,1)"},in:{duration:300,easing:"cubic-bezier(.5,0,.3,1)"}};
let mdBusy=false;
const mdItem=(m,id)=>id&&[...document.querySelectorAll(`${m.list} ${m.item}`)].find(el=>m.key(el)===id);

async function mdSelect(k,id){
  if(mdBusy)return;

    if(cur&&pane&&!pane.hidden){const home=mdBox(mdItem(m,cur));if(home)await mdPop(pane,home,"in")}
    /* 2. 切換：打開／收起要換版面（FLIP），換選只換內容 */
    const from=next&&!cur?mdBox(mdItem(m,next)):null;           /* 打開：從清單換版面之前的位置彈出 */
    if(!!cur!==!!next)mdFlip(m,()=>set(next));else set(next);
    pane&&pane.getAnimations().forEach(x=>x.cancel());
    if(cur)mdLand(mdItem(m,cur));
    /* 3. 新選的彈出去 */
    if(next&&pane)mdPop(pane,from||mdBox(mdItem(m,next)),"out");
  }finally{mdBusy=false}
}
/* 詳情卡在「清單那一項的位置與大小」和「自己的位置」之間變形：位移＋clip-path 圓角裁切 */
function mdPop(pane,home,dir){
  if(!home)return Promise.resolve();

/* 那一項回到清單：輕輕彈一下，像剛落回原位 */
function mdLand(el){if(el)el.animate([{scale:1.05},{scale:1}],{duration:320,easing:"cubic-bezier(.3,1.5,.5,1)"})}
function mdFlip(m,mutate){
  if(reduceMotion())return mutate();
  const first=new Map([...document.querySelectorAll(`${m.list} ${m.item}`)].map(el=>[m.key(el),el.getBoundingClientRect()]));
  mutate();
  document.querySelectorAll(`${m.list} ${m.item}`).forEach((el,i)=>{
    const a=first.get(m.key(el));if(!a)return;const b=el.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(a.width-b.width)<1)return;

document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-mdclose]");if(b){e.preventDefault();const k=b.dataset.mdclose;mdSelect(k,MD[k].get())}});
/* 上一個／下一個：照清單畫面上的順序換選（現在這張縮回空位、下一張彈出）；鍵盤左右鍵同功能（游標在輸入框裡時不搶） */
function mdStep(k,dir){const m=MD[k],ids=[...document.querySelectorAll(`${m.list} ${m.item}`)].map(m.key),to=ids[ids.indexOf(m.get())+dir];if(to)mdSelect(k,to)}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-mdstep]");if(b&&!b.disabled){e.preventDefault();mdStep(b.dataset.mdstep,+b.dataset.dir)}});
document.addEventListener("keydown",e=>{
  if((e.key!=="ArrowLeft"&&e.key!=="ArrowRight")||e.altKey||e.ctrlKey||e.metaKey||setOpen||notiOpen||$("#dlg").open)return;
  const a=document.activeElement;if(a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return;
  const k=selEv&&mdOn("live")?"live":selDone&&mdOn("done")?"done":null;if(!k)return;
  e.preventDefault();mdStep(k,e.key==="ArrowRight"?1:-1);
});

/* ---------- 版面長度過渡（全介面共用） ----------
   區塊（.panel）、設定頁的群組與右側面板，內容一變高或變矮，就從原本的高度滑到新的高度，下面的東西跟著滑，不會「卡一下整個往下」。
   用 ResizeObserver 看高度（在畫面畫出來之前就收到），所以各處的程式不用自己呼叫。
   不做的情況：裡面的膠囊／清單正在跑自己的展開收合（motionBusy）、第一次出現、從隱藏變顯示（高度 0）、寬度也一起變（換區塊放大、視窗縮放，交給原本的 FLIP）、減少動態、動畫模式。
   動畫進行中自己造成的尺寸變化不理；動畫結束後如果內容又變了，ResizeObserver 會再收到一次，從目前高度接著滑 */
const FLOW_SEL=".panel,.md-pane,.ev[open],[data-flow],#setOv .set-list,#setOv .set-pane";   /* 動畫規則 1（anim.js）：新的容器加 data-flow 就有長度過渡 */
const flowLast=new WeakMap();
const flowRO=typeof ResizeObserver==="function"?new ResizeObserver(es=>{
  for(const e of es){
    const el=e.target;if(el._flow)continue;
    const bs=e.borderBoxSize&&e.borderBoxSize[0],w=bs?bs.inlineSize:el.offsetWidth,h=bs?bs.blockSize:el.offsetHeight,last=flowLast.get(el);
    flowLast.set(el,{w,h});
    if(!last||!last.h||!h||Math.abs(last.w-w)>1||Math.abs(last.h-h)<3||_busy||reduceMotion()||document.hidden||document.body.matches(".intro"))continue;   /* _busy：膠囊自己在展開收合，區塊本來就跟著平滑變高 */
    el.style.overflow="clip";
    const a=el.animate([{height:last.h+"px"},{height:h+"px"}],{duration:Math.min(560,260+Math.abs(h-last.h)*.35),easing:"cubic-bezier(.2,.9,.25,1)"});
    el._flow=a;
    const done=()=>{if(el._flow!==a)return;el._flow=null;el.style.overflow="";flowLast.set(el,{w:el.offsetWidth,h:el.offsetHeight})};
    a.onfinish=done;a.oncancel=done;
  }
}):null;
function flowWatch(){if(flowRO)document.querySelectorAll(FLOW_SEL).forEach(el=>flowRO.observe(el))}

<script>
/* 核心｜編輯密碼與權杖加密 */
/* ---------- simple edit password (default 0000) ---------- */
const pwHash=str=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const curPw=()=>state.pwHash||pwHash("0000");

let sessionPw="";
const hasSubtle=()=>!!(window.crypto&&crypto.subtle);

async function _aes(pw,salt){return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:210000},await _base(pw),{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

   回傳 "all"／"dept"／""（不對）。自動開通建立的看板只有全會密碼、沒有部門共用密碼：預設的 0000 不算 */

  if(ta&&!state.pwKdf&&!state.pwHash)return "";

}

async function tokenFromShared(pw){

  for(const o of [s.tokenAll,s.tokenEnc]){if(!o)continue;try{return await decToken(o,pw)}catch(_){}}

async function unlockShared(title,note){

    const v=await ask(title||"輸入部門共用密碼",[{name:"pw",label:all?"學生會給的密碼（或部門共用密碼）":state.sync&&state.sync.initial?"初始密碼":"共用密碼",type:"password"}],
      {...(all||state.members.length||(state.sync&&state.sync.initial)?{}:{alt:"更改密碼"}),note:note||"",

/* 新密碼的檢查（個人密碼、共用密碼共用）：錯了回傳要顯示在視窗裡的紅字 */
function pwProblem(p1,p2,what){
  if(!p1)return `請輸入${what}`;
  if(p1.length<MIN_PW)return `${what}至少要 ${MIN_PW} 碼（現在是 ${p1.length} 碼）。密碼會用來加密上傳權限，太短的密碼別人猜得到；可以用一句好記的話，例如「權益部2026開會用」。`;
  if(p1!==p2)return "兩次輸入的密碼不一樣，請再輸入一次";
  return "";
}
async function askNewPassword(title,extra=[],tail=[]){
  const named=extra.some(f=>f.name==="name");
  const v=await ask(title,[...extra,{name:"p1",label:`個人密碼（至少 ${MIN_PW} 碼）`,type:"password"},{name:"p2",label:"再輸入一次",type:"password"},...tail],
    {note:`個人密碼只有你自己知道，之後換裝置就用它登入。登入時勾「記住密碼」，同一台裝置就不用再打。`,
     validate:o=>{if(named){const n=(o.name||"").trim();if(!n)return "請填名字";if(state.members.some(m=>m.name===n))return "已經有同名的身分，請換一個名字（例如加上職稱）"}
       return pwProblem(o.p1||"",o.p2||"","個人密碼")}});
  return !v||v==="alt"?null:v;
}
/* 部門第一位管理員：初始密碼是全會共用的，建議換成部門自己的共用密碼（可以稍後再說） */
async function ownSharedPw(){
  const v=await ask("設定部門自己的共用密碼",[{name:"n1",label:`新的共用密碼（至少 ${MIN_PW} 碼）`,type:"password"},{name:"n2",label:"再輸入一次",type:"password"}],
    {note:"剛才的初始密碼是學生會全會共用的。建議換成只有你們部門知道的密碼：之後新成員加入（「＋ 新增身分」）時要輸入這組密碼。\n按「取消」＝先沿用初始密碼，之後可以到「設定 → 身分與專員」更改。",
     validate:o=>pwProblem(o.n1||"",o.n2||"","共用密碼")});
  if(!v)return;
  await setSharedPw(v.n1);await persist("已設定部門共用密碼");
}
/* 舊看板的共用密碼太短（例如預設的 0000）：新成員拿不到上傳權限，建議第一位管理員馬上換 */
async function sharedPwFix(){
  const v=await ask("部門共用密碼太短",[{name:"n1",label:`新的共用密碼（至少 ${MIN_PW} 碼）`,type:"password"},{name:"n2",label:"再輸入一次",type:"password"}],
    {note:`目前的共用密碼少於 ${MIN_PW} 碼，看板不會用它保管上傳權限，所以其他裝置的新成員建立身分後連不上雲端。建議現在換一組；按「取消」可以之後到「設定 → 身分與專員」更改。`,
     validate:o=>pwProblem(o.n1||"",o.n2||"","共用密碼")});
  if(!v)return;
  await setSharedPw(v.n1);await persist("已更換部門共用密碼");
}
/* 換共用密碼：重新加密上傳權限（這台裝置有權杖時），初始密碼的標記拿掉 */
async function setSharedPw(pw){
  await setPw(pw);sharedPwSession=pw;
  /* 這台裝置沒有權杖：先用自己身分那份（個人密碼加密）解開，不要把部門的上傳權限刪掉（2026-11-06：以前會刪，新成員就連不上雲端） */
  const me=meMember();if(!ghToken()&&me&&me.tok&&sessionPw){try{localStorage.setItem(TOKEN_KEY,await decToken(me.tok,sessionPw))}catch(_){}}
  if(ghToken())await rememberToken(ghToken(),pw);else if(state.sync)delete state.sync.tokenEnc;
  if(state.sync)delete state.sync.initial;
}
/* 登入後這台裝置還是沒有連上雲端（部門還沒開通）：明白告訴使用者資料只會存在這台裝置 */
async function cloudWarn(){
  if(!cloudOn()||ghToken())return;
  await ask("這台裝置沒有連上雲端",[],{note:"這個部門還沒開通雲端，你的修改只會存在這台裝置的瀏覽器，其他人、其他裝置都看不到。\n請通知學生會：後台管理員打開自己電腦上的看板，就會自動開通所有部門；開通後重新登入即可。"});
}
/* 加入完成（全會密碼開通的部門）：說清楚現在的狀態與之後怎麼用；萬一沒解開上傳權限（不太會發生）照舊提醒 */
async function joinDone(first){
  if(cloudOn()&&!ghToken()){await cloudWarn();return}
  const me=meMember(),dn=CFG.dept.name;
  await ask(`完成：你已經加入${dn}`,[],{note:`你的身分：${me?me.name:""}${first?"（管理員）":""}。看板已經連上雲端，按卡片上的「編輯」修改、按「儲存」後大家都看得到。\n`
    +`換一台裝置：打開設定 → 登入 → 選你的名字、輸入個人密碼，就會自動連上。\n`
    +`其他人加入：請他打開設定 → 登入 →「＋ 新增身分」，輸入學生會給的密碼（各部門都一樣）${first?"。之後也可以到「設定 → 身分與專員」設定只有你們部門知道的共用密碼":""}。`});
}
async function createMember(first,title){
  const v=await askNewPassword(title||(first?"建立你的編輯身分（第一位會是管理員）":"新增編輯身分"),[{name:"name",label:"名字（會顯示在編輯紀錄）"}],
    [{name:"rem",label:"在這個裝置上記住密碼（下次不用再輸入）",type:"check",value:true}]);
  if(!v)return false;
  const m={id:uid("m"),name:v.name.trim(),role:first?"admin":"member",kdf:await kdfMake(v.p1),createdAt:nowStr()};
  let tk=ghToken();
  if(!tk&&sharedPwSession){tk=await tokenFromShared(sharedPwSession);if(tk){try{localStorage.setItem(TOKEN_KEY,tk)}catch(_){}}}   /* 全會密碼那份或部門共用密碼那份 */
  if(tk)m.tok=await encToken(tk,v.p1);
  state.members.push(m);meId=m.id;sessionPw=v.p1;try{localStorage.setItem(ME_KEY,m.id)}catch(_){}
  if(v.rem)await remSave(m);
  await persist(`已建立身分「${m.name}」`);
  return true;
}

async function teamSettings(){
  const d=$("#dlg"),f=$("#dlgForm");d.classList.add("wide");
  const paint=()=>{f.innerHTML=teamHTML();bind()};
  const reopen=()=>{paint();d.oncancel=ev=>{ev.preventDefault();f.querySelector('[data-x="done"]')?.click()};if(!d.open)dlgOpen(false)};
  const leave=async()=>{d.oncancel=null;d.onclose=null;if(d.open)await new Promise(r=>{d.addEventListener("close",()=>setTimeout(r,0),{once:true});d.close()})};
  const bind=()=>{
    f.onsubmit=ev=>ev.preventDefault();
    f.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
      const x=b.dataset.x,id=b.dataset.id,m=state.members.find(y=>y.id===id);
      if(x==="done"){await leave();d.classList.remove("wide");if(editing)changed();else if(dirty)await settingSave(()=>{},"已更新身分與專員");else render();finish();return}
      if(x==="role"&&m){if(m.role==="admin"&&adminCount()<=1){toast("至少要保留一位管理員");return}m.role=m.role==="admin"?"member":"admin";dirty=true;paint();return}
      if(x==="del"&&m){
        if(m.role==="admin"&&adminCount()<=1){toast("至少要保留一位管理員");return}
        await leave();const ok=await ask(`刪除編輯身分「${m.name}」？${m.id===meId?"（這是你自己）":""}`,[],{danger:"刪除身分"});
        if(ok==="delete"){state.members=state.members.filter(y=>y!==m);[...state.issues,...state.events].forEach(o=>{if(o.staff)o.staff=o.staff.filter(s=>s!==m.id)});dirty=true}
        reopen();return}
      if(x==="mypw"){await leave();const me=meMember();
        const old=await ask("更改個人密碼",[{name:"old",label:"目前的個人密碼",type:"password"}],{validate:async o=>me&&await kdfCheck(me.kdf,o.old)?"":"目前的個人密碼不正確"});
        if(old&&me){
          const v=await askNewPassword("設定新的個人密碼");
          if(v){me.kdf=await kdfMake(v.p1);sessionPw=v.p1;if(ghToken())me.tok=await encToken(ghToken(),v.p1);else delete me.tok;dirty=true;toast("個人密碼已更改，儲存後生效")}}
        reopen();return}
      /* 更改部門共用密碼：只有管理員看得到這顆，不用輸入舊密碼（忘了也能重設） */
      if(x==="sharedpw"&&isAdmin()){await leave();
        const v=await ask("設定新的部門共用密碼",[{name:"n1",label:`新的共用密碼（至少 ${MIN_PW} 碼）`,type:"password"},{name:"n2",label:"再輸入一次",type:"password"}],
          {note:"新成員按「＋ 新增身分」時要輸入這組密碼。改了以後舊的共用密碼就不能用；已經有身分的人照常用自己的個人密碼登入，不受影響。"+(ghToken()?"":"\n注意：這台裝置沒有連上雲端，改完後新成員仍然拿不到上傳權限，請在有權杖的裝置上改。"),
           validate:o=>pwProblem(o.n1||"",o.n2||"","共用密碼")});
        if(v){await setSharedPw(v.n1);dirty=true;toast("共用密碼已更改，按「完成」後儲存生效")}
        reopen();return}
    });
  };
  /* 按「完成」並儲存後才結束（設定頁右側面板靠這個知道何時收起） */
  let finish;return new Promise(r=>{finish=r;reopen()});
}

/* ---------- 專員標籤 ---------- */
/* 專員＝本看板的編輯身分（members）；ev.staff／issues[].staff 存 member id（schemaVersion 8 起） */
const staffOpts=()=>state.members.map(m=>[m.id,m.name]);
/* 03 負責人（暫定，不改權限）：firestore 模式的帳號（UID）用 profiles 的名稱，總管理員另外看得到信箱；舊身分照舊用 members 的名字 */
const staffName=id=>{const m=state.members.find(x=>x.id===id);if(m)return m.name;if(!fsMode())return "";
  return (typeof acct!=="undefined"&&acct.names[id])||(staffPpl.key===staffKey()&&staffPpl.mail[id])||(String(id).startsWith("legacy:")?"":String(id).slice(0,8))};
const staffNames=ids=>(ids||[]).map(staffName).filter(Boolean);
/* 即時回報「專員」欄的選項：github 模式＝本看板的身分；firestore 模式（staffPplLoad 讀）：
   總管理員＝這個部門有角色的帳號（roles）；部門的編輯者、管理員＝已標的＋自己＋這個部門的專員名單（03 F3，deptMembers：同部門有角色的人，只有 uid，名字從 profiles） */
const staffPpl={key:"",roles:null,editors:null,mail:{}};
/* 讀到的名單只給同一個帳號、同一個角色、同一個部門用（登出、換帳號、撤權後不沿用，信箱只有總管理員看得到） */
const staffKey=()=>`${CFG.deptId}|${typeof acct!=="undefined"&&acct.user?acct.user.uid:""}|${fsRole()}`;
function staffOptsFor(ev){
  if(!fsMode())return staffOpts();
  const me=typeof acct!=="undefined"&&acct.user?acct.user.uid:"";
  const ok=staffPpl.key===staffKey(),ids=fsRole()==="super"?[...(ev.staff||[]),...(ok&&staffPpl.roles||[])]:[...(ev.staff||[]),me,...(ok&&staffPpl.editors||[])];
  return [...new Set(ids.filter(Boolean))].map(id=>[id,staffName(id)||String(id).slice(0,8)]);
}
async function staffPplLoad(){
  const key=staffKey();if(!fsMode()||staffPpl.key===key)return;
  Object.assign(staffPpl,{key,roles:null,editors:null,mail:{}});
  try{
    if(fsRole()==="super"){const A=await acctLoad(),[rs,us]=await Promise.all([A.rolesList(),A.usersList()]);
      staffPpl.roles=rs.filter(r=>(r.depts||{})[CFG.deptId]).map(r=>r.uid);us.forEach(u=>{if(u.email)staffPpl.mail[u.uid]=u.email})}
    else{const A=await acctLoad();staffPpl.editors=await A.roster(CFG.deptId)}
  }catch(_){staffPpl.key=""}   /* 讀不到：只有已標的與自己，下次開始編輯再試 */
  if(editing&&kp&&!document.querySelector(".csel.open"))render();   /* 原位編輯器的專員選項 */
}
function staffHTML(ids){
  const names=staffNames(ids);

}

/* ---------- 編輯紀錄：存檔時比對前後，寫成結構化的 commit 訊息 ---------- */
let baseline=null;
const setBaseline=()=>{baseline=JSON.parse(JSON.stringify(state))};
function diffState(a,b){
  const L=[],byId=x=>new Map((x||[]).map(o=>[o.id,o])),same=(x,y)=>JSON.stringify(x??null)===JSON.stringify(y??null);
  const rng=i=>i.start&&i.end?`${fmt(i.start).slice(5)}~${fmt(i.end).slice(5)}`:"未排";
  const sname=id=>(b.members||[]).concat(a.members||[]).find(s=>s.id===id)?.name||"?";
  const staffD=(o,x,cat,t)=>{const A=new Set(o||[]),B=new Set(x||[]);const add=[...B].filter(i=>!A.has(i)).map(sname),rm=[...A].filter(i=>!B.has(i)).map(sname);
    if(add.length||rm.length)L.push(`${cat}｜專員${add.length?" +"+add.join("、"):""}${rm.length?" −"+rm.join("、"):""}｜${t}`)};
  const lname=id=>{const l=(b.labels||[]).concat(a.labels||[]).find(x=>x.id===id);return l?l.kind+"·"+l.name:"?"};
  const lblD=(o,x,cat,t)=>{const A=new Set(o||[]),B=new Set(x||[]);const add=[...B].filter(i=>!A.has(i)).map(lname),rm=[...A].filter(i=>!B.has(i)).map(lname);
    if(add.length||rm.length)L.push(`${cat}｜標籤${add.length?" +"+add.join("、"):""}${rm.length?" −"+rm.join("、"):""}｜${t}`)};
  const linkD=(o,x,cat,t)=>{const A=byId(o),B=byId(x);for(const [k,l] of B){if(!A.has(k))L.push(`${cat}｜新增連結「${l.name}」｜${t}`);else if(!same(A.get(k),l))L.push(`${cat}｜修改連結「${l.name}」｜${t}`)}for(const [k,l] of A)if(!B.has(k))L.push(`${cat}｜刪除連結「${l.name}」｜${t}`)};
  {const S={up:"上學期",down:"下學期"};if((a.semester||"")!==(b.semester||""))L.push(`看板｜學期 ${S[a.semester]||"（不指定）"}→${S[b.semester]||"（不指定）"}`)}
  [["title","看板名稱"],["yearLabel","學年"],["termStart","開學日"]].forEach(([k,t])=>{if((a[k]||"")!==(b[k]||""))L.push(`看板｜${t} ${a[k]||"（空）"}→${b[k]||"（空）"}`)});
  if(!same(a.range,b.range))L.push("看板｜調整時間軸範圍");
  /* 議題 */
  const AI=byId(a.issues),BI=byId(b.issues);
  for(const [id,x] of BI){const o=AI.get(id),t=x.title;
    if(!o){L.push(`議題｜新增｜${t}`);continue}
    if(o.title!==x.title)L.push(`議題｜改名 ${o.title}→${x.title}`);
    const st=i=>(i.tags||[])[i.cur]||"";
    if(st(o)!==st(x))L.push(`議題｜階段 ${st(o)||"—"}→${st(x)||"—"}｜${t}`);else if(!same(o.tags,x.tags))L.push(`議題｜修改階段標籤｜${t}`);
    if((o.start||"")!==(x.start||"")||(o.end||"")!==(x.end||""))L.push(`議題｜時程 ${rng(o)}→${rng(x)}｜${t}`);
    if((o.note||"")!==(x.note||""))L.push(`議題｜更新進度說明｜${t}`);
    if((o.doneAt||"")!==(x.doneAt||""))L.push(!o.doneAt?`議題｜結案｜${t}`:!x.doneAt?`議題｜取消結案｜${t}`:`議題｜結案日期 ${fmt(x.doneAt)}｜${t}`);
    const AM=byId(o.markers),BM=byId(x.markers);
    for(const [k,m] of BM){if(!AM.has(k))L.push(`議題｜新增註記「${m.text||""}」｜${t}`);else if(!same(AM.get(k),m))L.push(`議題｜修改註記「${m.text||""}」｜${t}`)}
    for(const [k,m] of AM)if(!BM.has(k))L.push(`議題｜刪除註記「${m.text||""}」｜${t}`);
    linkD(o.links,x.links,"議題",t);staffD(o.staff,x.staff,"議題",t);lblD(o.labels,x.labels,"議題",t);
  }
  for(const [id,o] of AI)if(!BI.has(id))L.push(`議題｜刪除｜${o.title}`);
  const ord=x=>(x.issues||[]).map(i=>i.id).filter(i=>AI.has(i)&&BI.has(i)).join();
  if(ord(a)!==ord(b))L.push("議題｜調整順序");
  /* 即時回報 */
  const AE=byId(a.events),BE=byId(b.events),iname=id=>(b.issues||[]).find(i=>i.id===id)?.title||(a.issues||[]).find(i=>i.id===id)?.title||"";
  for(const [id,x] of BE){const o=AE.get(id),t=x.name;
    if(!o){L.push(x.fromEv?`即時回報｜完成第 ${x.round} 段｜${t}`:`即時回報｜新增｜${t}`);continue}
    if(o.name!==x.name)L.push(`即時回報｜改名 ${o.name}→${x.name}`);
    if((o.desc||"")!==(x.desc||""))L.push(`即時回報｜更新說明｜${t}`);
    if(!o.doneAt&&x.doneAt)L.push(`即時回報｜結案｜${t}`);else if(o.doneAt&&!x.doneAt)L.push(`即時回報｜重新開啟｜${t}`);else if(o.doneAt&&x.doneAt&&o.doneAt!==x.doneAt)L.push(`即時回報｜完成日期 ${fmt(x.doneAt)}｜${t}`);
    if((o.issueId||"")!==(x.issueId||""))L.push(x.issueId?`即時回報｜連結議題「${iname(x.issueId)}」｜${t}`:`即時回報｜取消議題連結｜${t}`);
    linkD(o.links,x.links,"即時回報",t);staffD(o.staff,x.staff,"即時回報",t);lblD(o.labels,x.labels,"即時回報",t);
    const OT=byId(o.times),XT=byId(x.times);

  if(!same(sy(a),sy(b)))L.push("設定｜雲端同步設定");else if(!same((a.sync||{}).tokenEnc,(b.sync||{}).tokenEnc))L.push("設定｜更新雲端連線");

function commitMessage(a=baseline,b=state,who=meName()||"未具名"){

  const L=diffState(a,b);

  const cnt={};L.forEach(l=>{const c=l.split("｜")[0];cnt[c]=(cnt[c]||0)+1});

/* ---------- 編輯紀錄頁（打開時才向 GitHub 讀取） ---------- */
const logState={page:0,done:false,busy:false,items:[]};
function parseCommit(c){
  const msg=(c.commit&&c.commit.message)||"",date=new Date((c.commit&&(c.commit.committer||c.commit.author)||{}).date||Date.now());
  const lines=msg.split("\n"),subj=lines[0]||"";
  const m=subj.match(/^〔(.+?)〕(.*)$/);
  if(!m)return {date,old:true,subj,sha:c.sha,url:c.html_url};
  const body=lines.slice(1).map(x=>x.trim()).filter(x=>x&&!/^Board-Log:/.test(x));
  return {date,old:false,who:m[1],subj:m[2],lines:body.length?body:[m[2]],sha:c.sha,url:c.html_url};
}
function logItemHTML(x){
  const t=`${pad(x.date.getHours())}:${pad(x.date.getMinutes())}`;
  if(x.old)return `<li class="lg-item old"><span class="lg-time num">${t}</span><div class="lg-main"><span class="lg-old">舊版存檔（無詳細紀錄）</span></div></li>`;

}
function renderLog(msg){

  list.innerHTML=groups.map(g=>`<li class="lg-day"><div class="lg-date"><span class="num">${fmt(g.k)}</span><span class="sub">${"日一二三四五六"[pd(g.k).getDay()]}</span></div><ol>${g.items.map(logItemHTML).join("")}</ol></li>`).join("")
    ||(msg?"":`<li class="sub lg-empty">${logState.busy?"讀取中…":"還沒有紀錄"}</li>`);
  $("#logMsg").textContent=msg||"";
  const more=$("#logMore");more.hidden=logState.done||!!msg&&!logState.items.length;more.disabled=logState.busy;more.textContent=logState.busy?"讀取中…":"載入更早的紀錄";
}
async function loadLog(){
  if(logState.busy||logState.done)return;
  if(fsMode())return fsLoadLog();
  if(!cloudOn()){renderLog("這個看板沒有連上 GitHub，所以沒有編輯紀錄");return}
  logState.busy=true;renderLog();
  const c=cloudCfg(),h={Accept:"application/vnd.github+json"};if(ghToken())h.Authorization="Bearer "+ghToken();
  const url=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch)}&per_page=30&page=${logState.page+1}`;
  let msg="";
  try{const r=await fetch(url,{headers:h,cache:"no-store"});
    if(r.ok){const arr=await r.json();logState.page++;logState.items.push(...arr.map(parseCommit));if(arr.length<30)logState.done=true}
    else msg=r.status===403?"GitHub 讀取次數暫時用完，請過一陣子再試":r.status===404?"找不到這個 repo 或資料檔":"讀取失敗（"+r.status+"）";
  }catch(_){msg="連不上 GitHub（離線中？）"}
  logState.busy=false;renderLog(msg);
}
/* 02D：firestore 模式的編輯紀錄＝這個部門的版本歷史（卡片每存一版一筆，遷移產生的第 1 版是「匯入」）＋總管理員才讀得到的稽核紀錄
   （部門設定的修改、卡片刪除）。同一個人相隔 10 秒內的寫入併成一筆（一次儲存可能分成好幾批）。版本歷史只有總管理員與這個部門的編輯者讀得到 */
const fsLog={vers:[],cur:null,audits:[]};

const FS_FIELD={title:"看板名稱",range:"時間軸",reportBase:"週報基準",docs:"文件",follows:"追蹤"};
const fsLogLine=x=>x.kind==="ver"?`${x.imported?"遷移｜匯入":x.version===1?"即時回報｜新增":"即時回報｜修改"}｜${x.title}`
  :x.col==="cards"?`即時回報｜刪除｜${x.before.title||""}`:FS_DEL_T[x.col]?`${FS_DEL_T[x.col]}｜刪除｜${x.before.title||""}`:`設定｜${((x.after.fields||[]).map(f=>FS_FIELD[f]||f).join("、"))||"看板設定"}`;
function fsLogItems(rows){

  rows.slice().sort((a,b)=>b.t-a.t).forEach(x=>{const g=out[out.length-1];
    if(g&&g.by===x.by&&g.t0-x.t<=1e4){g.lines.push(fsLogLine(x));return}
    out.push({by:x.by,t0:x.t,date:new Date(x.t),old:false,who:acct.names[x.by]||x.by.slice(0,8),lines:[fsLogLine(x)]})});

async function fsLoadLog(){

/* host：設定頁桌面版的右側面板（沒有就是全螢幕）。回傳的 Promise 在關閉時完成 */

    ov=$("#logOv");$("#logClose").onclick=closeLog;elastic(ov.querySelector(".log-scroll"),ov.querySelector(".log-inner"));$("#logMore").onclick=loadLog;}

  ov.classList.toggle("in-pane",!!host);const at=host||document.body;if(ov.parentNode!==at)at.append(ov);

function closeLog(instant){const ov=$("#logOv");if(!ov||ov.hidden)return;if(!ov.classList.contains("in-pane"))Back.closed("log");const done=()=>{ov.hidden=true;document.body.classList.remove("log-open");if(logDone){logDone();logDone=null}};

  const a=ov.animate([{opacity:1},{opacity:0,transform:"translateY(10px)"}],{duration:200,easing:"ease-in"});a.onfinish=done}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#logOv")&&!$("#logOv").hidden&&!$("#dlg").open)closeLog()});

<script>/* 預覽專用：開頁就是「預覽」身分（正式網站沒有這一行） */meId="mpv";</script>
<script>
/* 核心｜全會密碼與自動開通（2026-11-06 第二版，取代原本「開通部門」的手動勾選與初始密碼）
   使用者要求：部門的人第一次進系統不要處理雲端、權杖貼上；第一個開通的人也不用透過有權杖的管理員說明操作。
   做法：
   - 後台管理員（這台裝置有權杖、cloud.js 的 siteAdmin）在「設定 → 網站管理 → 全會密碼」設一次全會密碼（至少 12 碼）。
     看板用它把權杖加密成一份 tokenAll，存在這台裝置（ALL_KEY，只存加密後的，不存密碼）。
   - 自動開通（pvAuto）：後台管理員的裝置打開任何部門的看板時（最多每 10 分鐘一次，boot.js），逐一檢查所有部門的資料檔：
       沒有資料檔＝建立空白看板（只有 tokenAll，沒有部門共用密碼）；有資料檔但 tokenAll 不是最新的＝只補上 sync.tokenAll，其他內容、各部門的共用密碼都不動。
   - 部門的人：設定 → 登入 → 輸入學生會給的全會密碼（或部門自己的共用密碼）→ 取名字、設個人密碼 → 自動連上雲端（team.js 的 unlockEdit、auth.js 的 sharedKind／tokenFromShared）。
   - 權杖換新（後台管理員貼了新的權杖）：這台裝置存的 tokenAll 還是舊權杖加密的（用權杖指紋 fp 判斷），要再輸入一次全會密碼才會更新到各部門。
   資料存在哪、誰看得到：tokenAll 在各部門的資料檔（公開的 repo，任何人都下載得到），但沒有全會密碼解不開；
   知道全會密碼的人能加入任何部門，也就能寫入整個 repo，所以全會密碼只交給各部門的人。權杖不會顯示在畫面或 console。
   測試部門（dept/config.js 的 test:true，水果部）：後台管理員可以「重置」，回到剛開通的狀態（pvReset）。 */
const ALL_KEY="workboard:tokenall";
function allRead(){try{const a=JSON.parse(localStorage.getItem(ALL_KEY)||"null");return a&&a.blob?a:null}catch(_){return null}}
async function tokPrint(t){const h=await crypto.subtle.digest("SHA-256",_te.encode(String(t||"")));return toB64(new Uint8Array(h)).slice(0,16)}
const allFresh=async a=>!!(a&&ghToken()&&a.fp===await tokPrint(ghToken()));   /* 這台裝置的 tokenAll 是不是用目前這把權杖加密的 */
/* 空白看板：雲端位置照這台裝置的設定寫進去（github.io 上本來就會自動判斷，寫明了在其他網址也連得上） */
const pvBlank=d=>{const c=cloudCfg();return {schemaVersion:SCHEMA_VERSION,id:d.boardId,title:`${d.name}工作進度`,members:[],issues:[],events:[],weeks:[],savedAt:nowStr(),sync:{owner:c.owner,repo:c.repo,branch:c.branch,path:d.path}}};
async function pvStatus(d){
  const c={...cloudCfg(),path:d.path},h={Accept:"application/vnd.github+json",Authorization:"Bearer "+ghToken()};
  try{
    const r=await fetch(apiURL(c)+"?ref="+encodeURIComponent(c.branch)+"&t="+Date.now(),{headers:h,cache:"no-store"});
    if(r.status===404)return {d,st:"none"};
    if(!r.ok)return {d,st:"err",code:r.status};
    const j=await r.json();return {d,st:"ok",sha:j.sha,data:JSON.parse(b64dec(j.content))};
  }catch(_){return {d,st:"err"}}
}
async function pvPut(d,data,sha,what){
  if(deptSourceOf(d.id)!=="github")return "搬家中，暫停寫入";   /* 凍結或已搬家的部門不寫資料檔（store.js） */
  const c={...cloudCfg(),path:d.path},h={Accept:"application/vnd.github+json",Authorization:"Bearer "+ghToken(),"Content-Type":"application/json"};
  const who=meName()||"學生會管理員";
  const body={message:`〔${who}〕設定｜${what}\n\n全會密碼自動開通（provision.js）。\n\nBoard-Log: 1`,content:b64enc(JSON.stringify(data,null,1)),branch:c.branch};
  if(sha)body.sha=sha;
  try{const r=await fetch(apiURL(c),{method:"PUT",headers:h,body:JSON.stringify(body)});
    return r.ok?"":r.status===409||r.status===422?"剛好有人存過，下次再補":r.status===401?"權杖無效或過期":r.status===403||r.status===404?"權杖沒有寫入權限":"失敗（"+r.status+"）"}
  catch(_){return "連不上 GitHub"}
}
/* 自動開通：report＝true 時不看間隔、回傳結果給畫面顯示；否則安靜地做（最多每 10 分鐘一次） */
let pvBusy=false;
async function pvAuto(report){
  if(pvBusy||!siteAdmin()||!cloudOn()||!ghToken()||!hasSubtle())return null;
  const a=allRead();if(!a)return null;
  if(!(await allFresh(a))){if(!report)toast("權杖換過了：到「設定 → 網站管理 → 全會密碼」再輸入一次，各部門才會用新的權杖");return {stale:true}}
  if(!report){try{const t=+localStorage.getItem(ALL_KEY+":at")||0;if(Date.now()-t<6e5)return null;localStorage.setItem(ALL_KEY+":at",String(Date.now()))}catch(_){}}
  pvBusy=true;const out={made:[],fixed:[],bad:[]};
  try{
    for(const d of BOARD_DEPTS){
      if(d.id===CFG.deptId&&editing)continue;   /* 自己這個部門正在編輯：下次再補，免得儲存時跟雲端衝突 */
      const x=await pvStatus(d);if(x.st==="err"){out.bad.push(`${d.name}（讀取失敗${x.code?"，"+x.code:""}）`);continue}
      if(x.data&&JSON.stringify((x.data.sync||{}).tokenAll||null)===JSON.stringify(a.blob))continue;
      const data=x.data||pvBlank(d);data.sync={...(data.sync||{}),tokenAll:a.blob};
      const e=await pvPut(d,data,x.sha,x.data?"補上全會密碼的上傳權限":"開通雲端（建立看板）");
      if(e)out.bad.push(`${d.name}（${e}）`);else (x.data?out.fixed:out.made).push(d.name);
    }
  }finally{pvBusy=false}
  if([...out.made,...out.fixed].includes(CFG.dept.name)&&!editing){cloud.etag=null;await cloudPull({force:true});render()}   /* 自己這個部門剛更新：載入雲端的新版本 */
  return out;
}
const allSub=()=>allRead()?"已設定":"還沒設定";
/* 設定 → 網站管理 → 全會密碼 */
async function allPwSet(){

<script>
/* 核心｜人事時地物標籤（schemaVersion 8）

   跟時間標記上的「地點」（times[].place，自由文字）分工：「地」標籤是常去的地方，填地點時會列成快速選項，點了就填進地點欄。 */
const LABEL_KINDS=["人","事","時","地","物"];
const labelById=id=>state.labels.find(l=>l.id===id);
/* 每個標籤被用了幾次（即時回報＋議題，含已完成的） */
function labelUse(){const n=new Map();[...state.events,...state.issues].forEach(o=>(o.labels||[]).forEach(id=>n.set(id,(n.get(id)||0)+1)));return n}
/* 某一類的標籤，常用的排前面，同樣次數照名字 */
function labelsOf(kind,use=labelUse()){return state.labels.filter(l=>l.kind===kind).sort((a,b)=>(use.get(b.id)||0)-(use.get(a.id)||0)||a.name.localeCompare(b.name,"zh-Hant"))}

function labelChipsHTML(ids){

}
/* 挑選區：依類別分列，每列可以單獨點選（多選）；name＝表單欄位名（FormData 用 getAll 取） */
function labelPickerHTML(name,sel){

function placeQuickHTML(){

}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-place]");if(!b)return;e.preventDefault();
  const box=b.closest(".evf-ed,form"),inp=box&&box.querySelector('[data-e="place"],input[name="place"]');if(inp){inp.value=b.dataset.place;inp.focus()}});

/* ---------- 設定頁「標籤」：管理員新增、改名、刪除；其他人只看 ---------- */
function labelSetHTML(){
  const adm=fsMode()?fsWriter():isAdmin(),del=fsMode()?fsDelOk():adm,use=labelUse();   /* firestore 模式：編輯者以上能新增、改名，部門管理員與總管理員能刪（規則要求同批寫刪除紀錄，02D D-d） */
  const grp=k=>{const ls=labelsOf(k,use);
    return `<section class="tm-sec"><div class="att-h">${k}<span class="sub">　${{人:"例如：學務處、某位老師",事:"例如：宿舍、交通安全",時:"例如：期中考週、校慶",地:"例如：六宿、圖書館",物:"例如：飲水機、機車"}[k]}</span></div>
      <ul class="tm-list">${ls.map(l=>`<li class="tm-row">${adm?`<input data-lblname="${esc(l.id)}" value="${esc(l.name)}" aria-label="標籤名稱">`:`<span class="tm-name">${esc(l.name)}</span>`}<span class="sub">用了 ${use.get(l.id)||0} 次</span>${del?`<button type="button" class="icon danger" data-x="del" data-id="${esc(l.id)}">刪除</button>`:""}</li>`).join("")||'<li class="sub">還沒有</li>'}</ul>
      ${adm?`<div class="tm-tools"><input data-newlbl="${k}" placeholder="新增「${k}」標籤" aria-label="新增${k}標籤"><button type="button" data-x="add" data-k="${k}">＋ 新增</button></div>`:""}</section>`};
  return `<b>標籤（人事時地物）</b>
  <p class="sub tm-note">標在即時回報與議題上；挑選時常用的排前面。${adm?"":"新增、刪除標籤需要管理員。"}時間標記的地點可以直接點「地」標籤填入。</p>
  ${LABEL_KINDS.map(grp).join("")}
  <p class="sub tm-note">${editing?"變更會在按編輯中那張卡片的「儲存」後生效。":"按「完成」後會直接儲存並同步。"}</p>
  <div class="dlg-actions"><button type="button" class="primary" data-x="done">完成</button></div>`;
}
async function labelSettings(){
  const d=$("#dlg"),f=$("#dlgForm");d.classList.add("wide");
  const syncNames=()=>f.querySelectorAll("[data-lblname]").forEach(i=>{const l=labelById(i.dataset.lblname),n=i.value.trim();if(l&&n&&n!==l.name){l.name=n;dirty=true}});

    f.onkeydown=ev=>{const k=ev.target.dataset&&ev.target.dataset.newlbl;if(ev.key==="Enter"&&!ev.isComposing&&k){ev.preventDefault();f.querySelector(`[data-x="add"][data-k="${k}"]`).click()}};
    f.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{

        if(state.labels.some(l=>l.kind===k&&l.name===n)){toast("已經有這個標籤");return}
        state.labels.push({id:uid("g"),kind:k,name:n});dirty=true;paint();f.querySelector(`[data-newlbl="${k}"]`).focus();return}
      if(x==="del"){const id=b.dataset.id;state.labels=state.labels.filter(l=>l.id!==id);[...state.events,...state.issues].forEach(o=>{if(o.labels)o.labels=o.labels.filter(v=>v!==id)});dirty=true;paint();return}
      if(x==="done"){d.oncancel=null;if(d.open)await new Promise(r=>{d.addEventListener("close",()=>setTimeout(r,0),{once:true});d.close()});d.classList.remove("wide");
        if(editing)changed();else if(dirty)await settingSave(()=>{},"已更新標籤");else render();finish()}
    });
  };
  let finish;return new Promise(r=>{finish=r;paint();d.oncancel=ev=>{ev.preventDefault();f.querySelector('[data-x="done"]').click()};dlgOpen(false)});
}

</script>
<script>
/* 核心｜底部工具列、設定頁、拉到底回彈、工具列依背景反轉 */
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
/* ---------- 底部工具列（手機）／左側細欄（桌面 900px 以上） ----------
   材質：毛玻璃 .glass（util.js 的 glassify，跟對話框同一套）；選取鏡片是實心膠囊（文字色），鏡片底下的圖示反白。
   按鈕機制照 Convx（Kyant backdrop catalog 的 LiquidBottomTabs／DampedDragAnimation／InteractiveHighlight／LiquidButton），手機與桌面同一套，
   差別只在方向（手機水平、桌面直立）：
     - 只有按在鏡片那一格才能拖；拖的時候位置跟著指標（不加彈簧），整條列跟著偏最多 4px；放開吸到最近的分頁
     - 按下時鏡片放大到 78/56（主軸彈簧 .6／250、側軸 .7／250），移動時依速度沿主軸拉伸；整條列沿長邊放大 16px、分頁內容放大 1.2；
       鏡片位置一圈白光（彈簧 .5／300）
     - 點分頁＝「按下 → 鏡片移過去（彈簧 1／1000）→ 接近目標或 400ms 後放開」
   設定鍵：按下放大 4px、白光跟著指標、被指標拖著微微偏移與拉伸（tanh 阻尼），放開彈回 */
let setOpen=false;
const TABS=()=>[["live","即時回報","live"],["progress","進度","progress"],["done","完成紀錄","done"],["ext",CFG.ext,CFG.extIcon||"flag"]].filter(([k])=>secTab(k));
/* 設定打開時，三個分頁都不亮；點任一個就關掉並回到那一區 */
const tbActive=()=>setOpen?"":curSec;
const RAIL_MQ=matchMedia("(min-width:900px)");
const isRail=()=>RAIL_MQ.matches;
/* 彈簧（跟 Compose 的 spring(dampingRatio, stiffness) 一樣，質量 1） */
const spring=(x,z,k)=>({x,v:0,t:x,z,k});
function sprStep(s,dt){const c=2*s.z*Math.sqrt(s.k),n=4,h=dt/n;for(let i=0;i<n;i++){s.v+=(-s.k*(s.x-s.t)-c*s.v)*h;s.x+=s.v*h}}
const sprDone=(s,e)=>Math.abs(s.x-s.t)<e&&Math.abs(s.v)<e*20;
const sprSnap=(s,x)=>{s.x=s.t=x;s.v=0};
const PRESSED=78/56;
const lens={
  val:spring(0,1,1000),     /* 鏡片位置（第幾個分頁，可以有小數） */
  press:spring(0,1,1000),   /* 按下的程度 0–1：鏡片放大、整列放大、分頁內容放大 */
  sx:spring(1,.6,250),sy:spring(1,.7,250),
  vel:spring(0,.5,300),     /* 速度（每秒幾個分頁 ÷ 分頁間距數），放開時回到 0 */
  off:spring(0,1,300),      /* 整條列跟著拖曳的累積位移（px），顯示時壓成最多 4px */
  hl:spring(0,.5,300),      /* 整條列的白光 */
  drag:null,releaseAt:0,releasing:false,raf:0,last:0,shown:false,
};
const gearSt={p:spring(0,.5,300),ox:spring(0,.5,300),oy:spring(0,.5,300),sx0:0,sy0:0,down:false};
function tabEls(){return [...$("#tabbar").querySelectorAll(".tab")]}
/* 用版面位置（offset）計算，不受全螢幕／縮放動畫影響 */
function tabCenters(){
  /* 相對於 .tb-main（鏡片的定位容器）。分頁有 scale（--ts）時會變成圖示的 offsetParent，所以要看圖示的 offset 是相對誰 */
  const box=$("#tabbar").querySelector(".tb-tabs");
  return tabEls().map(b=>{const ind=b.querySelector(".tab-ind"),inB=ind.offsetParent===b,ix=(inB?b.offsetLeft:0)+ind.offsetLeft,iy=(inB?b.offsetTop:0)+ind.offsetTop;
    return {k:b.dataset.tab,x:box.offsetLeft+ix+ind.offsetWidth/2,y:box.offsetTop+b.offsetTop+b.offsetHeight/2,top:box.offsetTop+iy}});
}
const tabIndex=k=>tabEls().findIndex(b=>b.dataset.tab===k);
function interp(cs,v,key){if(!cs.length)return 0;const i=Math.max(0,Math.min(cs.length-1,Math.floor(v))),j=Math.min(cs.length-1,i+1),f=v-i;return cs[i][key]+(cs[j][key]-cs[i][key])*f}
const clampV=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function tbFrame(){
  const tb=$("#tabbar");if(!tb)return;
  const main=tb.querySelector(".tb-main"),el=tb.querySelector(".tb-lens"),gear=tb.querySelector(".tb-gear");
  const cs=tabCenters();if(!cs.length||!cs[0].x&&!cs[0].y)return;
  /* 手機沿 x、桌面沿 y；其他都一樣 */
  const rail=isRail(),ax=rail?"y":"x",n=cs.length,p=lens.press.x,pos=interp(cs,lens.val.x,ax),len=(rail?main.offsetHeight:main.offsetWidth)||1;
  const v=lens.vel.x/10,ma=lens.sx.x/(1-clampV(v*.75,-.2,.2)),cr=lens.sy.x*(1-clampV(v*.25,-.2,.2));   /* 主軸、側軸的縮放 */
  if(rail){el.style.top="";el.style.transform=`translate(0,${(pos-el.offsetHeight/2).toFixed(2)}px) scale(${cr.toFixed(4)},${ma.toFixed(4)})`}
  else{el.style.top=cs[0].top+"px";el.style.transform=`translate(${(pos-el.offsetWidth/2).toFixed(2)}px,0) scale(${ma.toFixed(4)},${cr.toFixed(4)})`}
  /* 鏡片底下那一格的圖示反白（跟著鏡片走，不是跟著選取狀態） */
  const lit=el.classList.contains("off")?-1:Math.round(clampV(lens.val.x,0,n-1));
  tabEls().forEach((b,i)=>b.classList.toggle("lit",i===lit));
  /* 整條列：拖曳時跟著偏最多 4px（EaseOut），按下時沿長邊放大 16px */
  const fr=clampV(lens.off.x/len,-1,1),ease=1-Math.pow(1-Math.abs(fr),2),po=4*Math.sign(fr)*ease;
  main.style.transform=po?`translate${rail?"Y":"X"}(${po.toFixed(2)}px)`:"";main.style.scale=p>.0005?(1+16/len*p).toFixed(4):"";
  tb.querySelector(".tb-tabs").style.setProperty("--ts",(1+.2*p).toFixed(4));
  main.style.setProperty("--hp",lens.hl.x.toFixed(4));
  main.style.setProperty("--hx",rail?"50%":(pos+po).toFixed(1)+"px");main.style.setProperty("--hy",rail?(pos+po).toFixed(1)+"px":"50%");
  /* 設定鍵（手機、桌面同一套） */
  const g=gearSt,gh=gear.offsetHeight||1,gw=gear.offsetWidth||1,md=Math.min(gw,gh),mx=Math.max(gw,gh),ox=g.ox.x,oy=g.oy.x;
  const gs=1+4/gh*g.p.x,ang=Math.atan2(oy,ox),mds=4/gh;
  const tx=md*Math.tanh(.05*ox/md),ty=md*Math.tanh(.05*oy/md);
  const gsx=gs+mds*Math.abs(Math.cos(ang)*ox/mx)*Math.min(gw/gh,1),gsy=gs+mds*Math.abs(Math.sin(ang)*oy/mx)*Math.min(gh/gw,1);
  gear.style.transform=(tx||ty)?`translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px)`:"";
  gear.style.scale=g.p.x>.0005||tx||ty?`${gsx.toFixed(4)} ${gsy.toFixed(4)}`:"";
  gear.style.setProperty("--hp",g.p.x.toFixed(4));gear.style.setProperty("--hx",(g.sx0+ox).toFixed(1)+"px");gear.style.setProperty("--hy",(g.sy0+oy).toFixed(1)+"px");
}
const TB_SPRINGS=()=>[lens.val,lens.press,lens.sx,lens.sy,lens.vel,lens.off,lens.hl,gearSt.p,gearSt.ox,gearSt.oy];
function tbLoop(now){
  const dt=Math.min(1/30,Math.max(1/240,(now-(lens.last||now))/1000||1/60));lens.last=now;
  if(!lens.drag)TB_SPRINGS().forEach(s=>sprStep(s,dt));
  else{[lens.press,lens.sx,lens.sy,lens.hl,gearSt.p,gearSt.ox,gearSt.oy].forEach(s=>sprStep(s,dt));
    if(now-lens.drag.t>80)sprSnap(lens.vel,0)}   /* 手指停住：速度歸零（Convx 的速度追蹤器也是看最近的移動） */
  /* 放開：等鏡片接近目標（間距的 2.5%）或最多 400ms，才讓按下的形變消失 */
  if(lens.releasing){const n=Math.max(1,tabEls().length-1);if(Math.abs(lens.val.x-lens.val.t)<n*.025||now-lens.releaseAt>400){lens.releasing=false;lens.vel.t=0;lens.press.t=0;lens.sx.t=1;lens.sy.t=1}}
  tbFrame();
  if(lens.drag||lens.releasing||gearSt.down||!TB_SPRINGS().every(s=>sprDone(s,.0008))){lens.raf=requestAnimationFrame(tbLoop);return}
  TB_SPRINGS().forEach(s=>sprSnap(s,s.t));tbFrame();lens.raf=0;lens.last=0;
}
const tbKick=()=>{if(!lens.raf){lens.last=0;lens.raf=requestAnimationFrame(tbLoop)}};
function lensPress(){if(reduceMotion())return;lens.press.t=1;lens.sx.t=PRESSED;lens.sy.t=PRESSED;lens.releasing=false}
function lensRelease(){lens.releasing=true;lens.releaseAt=performance.now()}
/* 移到某個分頁：照 animateToValue（按下 → 移過去 → 放開），手機、桌面一樣 */
function lensTo(k,instant){
  const tb=$("#tabbar");if(!tb)return;const el=tb.querySelector(".tb-lens");
  const i=k?tabIndex(k):-1;el.classList.toggle("off",i<0);
  if(i<0){lens.shown=false;tabEls().forEach(b=>b.classList.remove("lit"));return}
  if(instant||reduceMotion()||!lens.shown){lens.shown=true;sprSnap(lens.val,i);tbFrame();return}
  if(lens.val.t!==i&&!lens.drag){lens.val.t=i;lensPress();lensRelease()}   /* 點分頁：按下 → 移過去 → 放開 */
  tbKick();
}
function renderTabbar(){

/* ---------- 設定頁：合併頁（2026-11-06 使用者：同類的功能合成一頁，但功能彼此分開、不互相干涉） ----------
   畫在右側面板（桌面）或子頁（手機）裡，一列一個功能：
   - flow（有自己表單的，例如雲端同步）：合併頁先藏起來，表單畫在同一個位置；做完或取消就回到合併頁。
   - act（直接執行的，例如匯出備份、忘記這台裝置）：合併頁留著，執行完更新文字。

let hubNow=null;
function hubRun(title,rows,foot=()=>""){   /* foot：清單下面的內容（「這台裝置」的加入主畫面步驟） */
  return new Promise(res=>{
    const host=setPaneHost();if(!host)return res();
    const box=document.createElement("div");box.className="set-hub";host.prepend(box);
    let list=[];
    const draw=()=>{list=rows();box.innerHTML=`<b class="set-hub-t">${title}</b>${list.length?`<div class="set-list">${list.map(r=>setRow(r.k,r.ic,r.t,r.sub,r.off,"hub")).join("")}</div>`:""}${foot()}`;weekDotSync()};
    const me=hubNow={inFlow:false,end(){if(hubNow===me)hubNow=null;box.remove();res()}};
    draw();
    box.addEventListener("click",async e=>{
      const b=e.target.closest("[data-hub]");if(!b||me.inFlow||hubNow!==me||b.getAttribute("aria-disabled")==="true")return;
      const r=list.find(x=>x.k===b.dataset.hub);if(!r)return;
      if(r.act){await r.act();if(hubNow===me)draw();return}
      me.inFlow=true;box.hidden=true;Back.opened("hubflow",()=>paneDismiss());
      try{await r.flow()}catch(err){console.error(err)}
      Back.closed("hubflow");me.inFlow=false;
      if(hubNow!==me)return;   /* 等的時候整個合併頁已經被收掉（換項目、關設定） */
      draw();box.hidden=false;renderSettings();
    });
  });
}

/* ---------- 拉到底的回彈（iPhone 本來就有，就不重複） ---------- */
function elastic(sc,inner){
  if(IS_IOS||!sc||!inner||sc._elastic)return;sc._elastic=true;
  let off=0,acc=0,tm=0,y0=null,x0=0,axis="",base=0,anim=null;
  const set=v=>{off=v;inner.style.transform=v?`translate3d(0,${v.toFixed(1)}px,0)`:""};
  const rub=d=>Math.sign(d)*Math.min(120,Math.pow(Math.abs(d),.8)*1.15);
  const back=()=>{if(!off)return;const from=off;set(0);if(reduceMotion())return;anim&&anim.cancel();anim=inner.animate([{transform:`translate3d(0,${from}px,0)`},{transform:"translate3d(0,0,0)"}],{duration:620,easing:"cubic-bezier(.16,1.35,.4,1)"})};
  const atTop=()=>sc.scrollTop<=0,atBot=()=>sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
  sc.addEventListener("wheel",e=>{
    if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    if((e.deltaY<0&&atTop())||(e.deltaY>0&&atBot())){anim&&anim.cancel();acc=Math.max(-260,Math.min(260,acc-e.deltaY*.45));set(rub(acc));clearTimeout(tm);tm=setTimeout(()=>{acc=0;back()},120)}
  },{passive:true});
  sc.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;y0=e.touches[0].clientY;x0=e.touches[0].clientX;axis="";base=null},{passive:true});
  sc.addEventListener("touchmove",e=>{
    if(y0===null)return;const y=e.touches[0].clientY,dy=y-y0;
    /* 先判斷方向：橫向的手勢（例如左右滑甘特圖）整段都不管，不然頁面剛好在頂端／底端時會把橫向捲動擋掉 */
    if(!axis){const dx=e.touches[0].clientX-x0;if(Math.max(Math.abs(dx),Math.abs(dy))<6)return;axis=Math.abs(dx)>Math.abs(dy)?"x":"y"}
    if(axis==="x")return;
    if((dy>0&&atTop())||(dy<0&&atBot())){if(base===null)base=dy;if(e.cancelable)e.preventDefault();anim&&anim.cancel();set(rub(dy-base))}
    else if(off){set(0)}
  },{passive:false});
  const up=()=>{y0=null;base=null;back()};
  sc.addEventListener("touchend",up);sc.addEventListener("touchcancel",up);
}

function lumUnder(x,y){
  for(const el of document.elementsFromPoint(x,y)){
    if(el.closest("#tabbar,#splash")||el.classList.contains("dlg-ghost-bd"))continue;   /* 開場畫面（白底）蓋在上面時不算，看的是底下的看板 */
    for(let n=el;n&&n.nodeType===1;n=n.parentElement){
      const m=(getComputedStyle(n).backgroundColor.match(/[\d.]+/g)||[]).map(Number);
      if(m.length>=3&&(m.length<4||m[3]>.45))return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255;
    }
    break;
  }
  const m=(getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g)||[0,0,0]).map(Number);return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255;
}

/* 取樣要量版面（elementsFromPoint＋getComputedStyle），放在展開收合動畫進行中會讓動畫卡一下：

const idle=window.requestIdleCallback||(f=>setTimeout(f,60));
function tbContrastSoon(){
  if(tbCR)return;

/* 主列和設定鈕各自判斷（桌面主列是直的，取樣點改成上下排）；多點取樣＋遲滯，避免邊界附近來回閃 */
function tbContrast(){
  const tb=$("#tabbar");if(!tb)return;const rail=isRail();
  tb.querySelectorAll(".tb-main,.tb-gear").forEach(el=>{
    const r=el.getBoundingClientRect();if(!r.width)return;
    const g=el.classList.contains("tb-gear"),fx=g||rail?[.3,.5,.7]:[.1,.3,.5,.7,.9],fy=rail&&!g?[.1,.3,.5,.7,.9]:[.3,.5,.7];
    const ls=[];fx.forEach(a=>fy.forEach(b=>ls.push(lumUnder(r.left+r.width*a,r.top+r.height*b))));
    const light=ls.filter(v=>v>.6).length/ls.length,dark=ls.filter(v=>v<.4).length/ls.length;
    if(light>=.7){el.classList.add("on-light");el.classList.remove("on-dark")}
    else if(dark>=.6){el.classList.add("on-dark");el.classList.remove("on-light")}
  });
}
