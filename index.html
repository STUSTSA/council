<script>/* 換頁動畫（core/js/pagefx.js）：從站內換頁過來的，body 先透明，等它從後面浮上來（不會先閃一下完整的畫面） */try{var r=document.referrer,n=performance.getEntriesByType("navigation")[0];var h=document.documentElement,b=sessionStorage.getItem("pfx-burst");sessionStorage.removeItem("pfx-burst");if(r&&new URL(r).origin===location.origin&&(!n||n.type!=="reload")&&!matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("pfx-arrive");
  /* 從主頁點部門進來（home.js 交接 pfx-burst＝{d:部門,k:"tile"桌面色塊鋪滿｜"flip"手機翻面}，只在這一次換頁有效）：開頁第一格就蓋著那一張的底板與部門標誌，等看板穩定了再接著播（pagefx.js 的 arrive） */
  var o=b&&JSON.parse(b),d=new URLSearchParams(location.search).get("d")||"rights";if(o&&o.d===d&&/^[a-z]+$/.test(d)&&(o.k==="tile"||o.k==="flip")){h.dataset.pfx=o.k;h.dataset.pfxD=d}}}catch(e){}</script>
