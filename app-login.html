<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>登入學生會看板</title>
<!-- 安卓 App 專用的登入頁（App 內嵌畫面不能用 Google 登入，所以由 Chrome 開這一頁）。
     流程：按「用 Google 登入」→ 登入完成 → 按「回到看板」→ App 收到憑證並完成登入。Chrome 裡原本沒登入的話，這一頁登入完會立刻登出，不留狀態；原本就登入著則不動。 -->
<style>
  /* 安卓 App 登入頁（DESIGN.md「整體」：深色純黑底、淺色白底；細框、全圓角膠囊；Jost → Noto Sans TC；跟系統深淺色走；背景鋪滿含安全區）。
     這頁不載入 board.css，色票與動畫時間寫在這裡，數值與 board.css 的 --ink／--muted／--mo-* 相同。 */
  :root{--bg:#fff;--ink:#111114;--muted:#5d5d66;--hair:#e2e2e8;--ok:#3ccf7f;--mo-base:280ms;--mo-slow:460ms;--mo-out:cubic-bezier(.2,.9,.25,1);--mo-spring:cubic-bezier(.3,1.3,.5,1);
    --sa-top:env(safe-area-inset-top,0px);--sa-bottom:env(safe-area-inset-bottom,0px);--sa-left:env(safe-area-inset-left,0px);--sa-right:env(safe-area-inset-right,0px)}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f1f1f4;--muted:#a3a3ae;--hair:#2c2c34}}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:var(--sa-top) var(--sa-right) var(--sa-bottom) var(--sa-left);background:var(--bg);color:var(--ink);font:16px/1.6 Jost,"Noto Sans TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  [hidden],.pill[hidden]{display:none}
  /* 內容整組在畫面垂直中線略上方（下面多留一塊，視覺重心才不會偏下）；最寬 380px，手機兩側各留 24px */
  main{flex:1;width:100%;max-width:380px;margin:0 auto;padding:32px 24px 12vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mark{position:relative;width:96px;height:96px;margin:0 0 28px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;animation:rise var(--mo-slow) var(--mo-out) both}
  .mark::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--ink);opacity:0;animation:ring 2.8s var(--mo-out) 1s infinite}
  .logo{width:56px;height:56px;background:var(--ink);-webkit-mask:url(assets/學生會logo-單色線稿.svg) center/contain no-repeat;mask:url(assets/學生會logo-單色線稿.svg) center/contain no-repeat;transition:opacity var(--mo-base) var(--mo-out),transform var(--mo-base) var(--mo-spring)}
  .tick{position:absolute;width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity var(--mo-base) var(--mo-out),transform var(--mo-base) var(--mo-spring)}
  .tick path{stroke-dasharray:32;stroke-dashoffset:32}
  .done .mark{background:var(--ink)}
  .done .mark::after{animation:none}
  .done .logo{opacity:0;transform:scale(.6)}
  .done .tick{opacity:1;transform:none;stroke:var(--bg)}
  .done .tick path{animation:draw var(--mo-slow) var(--mo-out) 120ms forwards}
  .en{margin:0 0 6px;font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);animation:rise var(--mo-slow) var(--mo-out) 60ms both}
  h1{margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:.08em;line-height:1.3;animation:rise var(--mo-slow) var(--mo-out) 120ms both}
  #msg{margin:0 0 36px;font-size:15px;color:var(--muted);animation:rise var(--mo-slow) var(--mo-out) 180ms both}
  .btns{width:100%;display:flex;flex-direction:column;gap:12px;animation:rise var(--mo-slow) var(--mo-out) 240ms both}
  /* 按鈕：全圓角膠囊，字上大下小補視覺置中（DESIGN.md 整體） */
  .pill{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:54px;padding:3px 24px 0;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-size:16px;font-weight:500;letter-spacing:.12em;text-decoration:none;cursor:pointer;touch-action:manipulation;transition:transform .24s var(--mo-spring),opacity var(--mo-base) var(--mo-out)}
  .pill:active{transform:scale(.96)}
  .pill:disabled{opacity:.55;cursor:default}
  .pill:disabled:active{transform:none}
  .pill.busy{color:transparent}
  .pill.busy::after{content:"";position:absolute;width:20px;height:20px;border:2px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
  .pill.ghost{background:transparent;color:var(--ink)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes ring{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.5)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.mark,.en,h1,#msg,.btns,.mark::after,.pill.busy::after{animation:none}.done .tick path{animation:none;stroke-dashoffset:0}.logo,.tick,.pill{transition:none}}
</style>
</head>
<body>
<main id="app">
  <div class="mark" aria-hidden="true"><span class="logo"></span><svg class="tick" viewBox="0 0 44 44"><path d="M10 23l9 9 16-19"/></svg></div>
  <p class="en">STUSTSA · Sign in</p>
  <h1 id="ttl">登入看板</h1>
  <p id="msg">請用學生會的 Google 帳號登入。</p>
  <div class="btns">
    <button id="go" class="pill" type="button">用 Google 登入</button>
    <a id="back" class="pill" hidden>回到看板</a>
  </div>
</main>
<script src="dept/config.js"></script>
<script type="module">
import { fb } from "./core/js/fb-app.js";
import { signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const $ = id => document.getElementById(id);
/* nonce 由 App 產生、放在網址 # 後面（不會送到伺服器）；沒有或格式不對就不登入，別的網站不能拿這一頁來取得使用者的登入憑證 */
const n = new URLSearchParams(location.hash.slice(1)).get("n");
const NONCE = n && /^[A-Za-z0-9_-]{16,64}$/.test(n) ? n : "";
if (!NONCE) { $("ttl").textContent = "無法登入"; $("msg").textContent = "請從學生會看板 App 內按「Google 登入」開啟這一頁。"; $("go").hidden = true; }
$("go").onclick = async () => {
  $("go").disabled = true;
  $("go").classList.add("busy");
  try {
    if (!NONCE) throw new Error("no-nonce");
    const { auth } = fb(BOARD_BASE.firebase);
    await auth.authStateReady();
    const had = !!auth.currentUser;   /* 原本就登入著（在 Chrome 用看板）就不要幫使用者登出 */
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    const r = await signInWithPopup(auth, p);
    const c = GoogleAuthProvider.credentialFromResult(r);
    if (!had) await signOut(auth);
    if (!c || !c.idToken) throw new Error("no-credential");
    /* 用 intent 網址並指定套件名：只有我們的 App 收得到，別的 App 搶不到憑證 */
    $("back").href = "intent://auth#Intent;scheme=councilapp;package=tw.edu.stust.council;S.idToken=" + encodeURIComponent(c.idToken)
      + ";S.nonce=" + encodeURIComponent(NONCE) + ";end";
    $("ttl").textContent = "登入完成";
    $("msg").textContent = "請點下面的按鈕回到看板。";
    $("go").hidden = true;
    $("back").hidden = false;
    $("app").classList.add("done");
  } catch (e) {
    $("ttl").textContent = "登入沒有完成";
    $("msg").textContent = "請再試一次。";
    $("go").classList.remove("busy");
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
