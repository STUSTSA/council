<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南臺科技大學學生會｜各部門工作進度</title>
<meta name="description" content="南臺科技大學學生會各部門的工作看板入口。">
<link rel="icon" href="dept/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="dept/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f5f0e1">
<link rel="stylesheet" href="core/theme.css">
<script src="core/js/theme.js"></script>   <!-- 主題、深淺色：開頁前套好（跟看板同一份設定） -->
<link rel="stylesheet" href="core/board.css">   <!-- 主頁的樣式在 board.css「主頁」段（ui-07 起跟看板同一份，主題變數、分段切換、行事曆共用） -->
<link rel="stylesheet" href="core/splash.css">
<link rel="manifest" href="manifest.webmanifest">   <!-- 2026-11-06：全會共用一個 App，打開就是這一頁（core/js/app.js 的說明） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="學生會看板">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>/* 換頁動畫（core/js/pagefx.js）：從站內換頁過來的，body 先透明，等它從後面浮上來（不會先閃一下完整的畫面）。
   系統返回鍵回來（瀏覽紀錄的上一頁、沒走 bfcache）時 referrer 是這一頁當初的來源、不是剛才的部門：改看 sessionStorage「hm-dept」（home.js 進部門時記下，
   只在 back_forward 時用；新開 App 是新的 session，沒有這個值），放在 html[data-hm-back]，home.js 用它決定焦點與收回哪一張、開場不放（splash.js） */
try{var h=document.documentElement,r=document.referrer,n=performance.getEntriesByType("navigation")[0],k=n&&n.type==="back_forward"&&sessionStorage.getItem("hm-dept");if(k&&/^[a-z]+$/.test(k))h.dataset.hmBack=k;
  if((h.dataset.hmBack||r&&new URL(r).origin===location.origin)&&(!n||n.type!=="reload")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)h.classList.add("pfx-arrive")}catch(e){}</script>
</head>
<body>
<script src="core/js/splash.js"></script>
<script>mountSplash()   /* App 打開（或從網站外面進來）先跑學生會開場動畫；從看板回來（站內）不放 */</script>
<!-- 主頁（DESIGN-next 第六節「主頁」；core/js/home.js）：左上橫式學生會標誌、時間、設定、部門色塊（桌面一排／手機卡片堆）、下排。
     工具列、通知、逾期數字都要進部門才看得到 -->
<main class="hm" id="hm">
  <header class="hm-top">
    <span class="hm-me" id="hmMe"></span>
    <span class="hm-sp"></span>
    <span class="hm-clock num" id="hmClock"></span>
    <button type="button" class="hm-round" id="hmSet" aria-label="設定"></button>
  </header>
  <div class="hm-stage" id="hmStage"></div>
  <!-- 下排（寬度跟著內容、以整個畫面寬置中、浮在上面）：「全會行事曆」（公共版，notify.js 的 calMount）、個人常用連結、「+」（home.js 的 dkPaint）。
       底板是左右兩半（.hm-dk-bg），寬度改變時各自滑到新的邊 -->
  <div class="hm-dock" id="hmDock"><div class="hm-dk" id="hmDk"><span class="hm-dk-bg hm-dk-l" aria-hidden="true"><span></span></span><span class="hm-dk-bg hm-dk-r" aria-hidden="true"><span></span></span><div class="hm-dk-in" id="hmDkIn"><button type="button" class="hm-pub" id="hmPub" data-k="pub" aria-label="全會行事曆"></button></div></div></div>
</main>
<script src="core/js/pagefx.js"></script>
<script src="dept/config.js"></script>
<script src="core/js/config.js"></script>
<script src="core/js/util.js"></script>
<script src="core/js/morph.js"></script>
<script src="core/js/anim.js"></script>
<script src="core/js/icons.js"></script>
<script src="core/js/store-map.js"></script>   <!-- 以下是全會行事曆（公共版）用的：只讀，活動、會議要等有部門切到新資料庫才讀得到 -->
<script src="core/js/store.js"></script>
<script src="core/js/follow.js"></script>
<script src="core/js/notify.js"></script>
<script src="core/js/sfx.js"></script>   <!-- 音效（設定 → 外觀的開關） -->
<script src="core/js/home.js"></script>
</body>
</html>
