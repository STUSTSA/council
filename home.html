<script>/* 換頁動畫（core/js/pagefx.js）：從站內換頁過來的，body 先透明，等它從後面浮上來（不會先閃一下完整的畫面）。
   系統返回鍵回來（瀏覽紀錄的上一頁、沒走 bfcache）時 referrer 是這一頁當初的來源、不是剛才的部門：改看 sessionStorage「hm-dept」（home.js 進部門時記下，
   只在 back_forward 時用；新開 App 是新的 session，沒有這個值），放在 html[data-hm-back]，home.js 用它決定焦點與收回哪一張、開場不放（splash.js） */
try{var h=document.documentElement,r=document.referrer,n=performance.getEntriesByType("navigation")[0],k=n&&n.type==="back_forward"&&sessionStorage.getItem("hm-dept");if(k&&/^[a-z]+$/.test(k))h.dataset.hmBack=k;
  if((h.dataset.hmBack||r&&new URL(r).origin===location.origin)&&(!n||n.type!=="reload")&&!matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("pfx-arrive");h.setAttribute("data-pfx-quick","");
    /* 回主頁的底板（home.js 的 hmCollapse 接手、收回那一張卡）：第一格就蓋滿畫面，不用等後面十幾支 script 跑完，中間不會是一片空白底色 */
    var c=document.createElement("div");c.className="hm-fx hm-fx-pre";c.setAttribute("aria-hidden","true");c.style.cssText="left:0;top:0;width:100%;height:100%";h.appendChild(c)}}catch(e){}</script>
</head>
<body>
<script src="core/js/splash.js"></script>
<script>mountSplash()   /* App 打開（或從網站外面進來）先跑學生會開場動畫；從看板回來（站內）不放 */</script>
<!-- 主頁（DESIGN-next 第六節「主頁」；core/js/home.js）：左上橫式學生會標誌、時間、設定、部門色塊（桌面一排／手機卡片堆）、下排。
     工具列、通知、逾期數字都要進部門才看得到 -->
<main class="hm" id="hm">
  <header class="hm-top">
    <span class="hm-me" id="hmMe"></span>
    <span class="hm-sp"></span>
    <span class="hm-clock num" id="hmClock"></span>
    <button type="button" class="hm-round" id="hmSet" aria-label="外觀主題"></button>
  </header>
  <div class="hm-stage" id="hmStage"></div>
  <!-- 下排（寬度跟著內容、以整個畫面寬置中）：「全會行事曆」（公共版，notify.js 的 calMount）、個人常用連結、「+」（home.js 的 dkPaint）。
       桌面是一顆一顆分開的圓鈕（底板不畫）；手機浮在膠囊上，底板是左右兩半（.hm-dk-bg），寬度改變時各自滑到新的邊 -->
  <div class="hm-dock" id="hmDock"><div class="hm-dk" id="hmDk"><span class="hm-dk-bg hm-dk-l" aria-hidden="true"><span></span></span><span class="hm-dk-bg hm-dk-r" aria-hidden="true"><span></span></span><div class="hm-dk-in" id="hmDkIn"><button type="button" class="hm-pub" id="hmPub" data-k="pub" aria-label="全會行事曆"></button><button type="button" class="hm-bk" id="hmBk" data-k="bk" aria-label="跟會長預約"></button></div></div></div>
</main>
<script src="core/js/pagefx.js"></script>

<script src="core/js/config.js"></script>
<script src="core/js/util.js"></script>

<script src="core/js/icons.js"></script>

<script src="core/js/store.js"></script>
<script src="core/js/follow.js"></script>
<script src="core/js/notify.js"></script>
<script src="core/js/sfx.js"></script>   <!-- 音效（設定 → 外觀的開關） -->
<script src="core/js/wallet.js"></script>   <!-- 手機卡片堆的動作引擎（主頁部門；看板完成紀錄的週也用） -->
<script src="core/js/home.js"></script>
